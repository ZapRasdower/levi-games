<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levi Galaxy - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(900px 500px at 50% -80px, #16163a, #0f0f1a 70%);
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(255,230,0,0.35);
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-align: center;
    }

    #gameCanvas {
      border: 3px solid #333;
      border-radius: 10px;
      background: #05050f;
      display: block;
      max-width: 100%;
      touch-action: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      cursor: none;
    }

    #ui {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 560px;
      margin-top: 14px;
      font-size: 0.78rem;
      color: #99a;
      letter-spacing: 1px;
    }

    #ui .pill {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      padding: 6px 14px;
    }

    #ui span { color: #ffe600; font-size: 0.95rem; margin-left: 5px; }
    #ui .lives { color: #ff5b6b; }

    #ui button {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      color: #ffe600;
      font-size: 0.9rem;
      padding: 5px 12px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
      transition: border-color 0.12s;
    }

    #ui button:hover { border-color: #ffe600; }
    #bombBtn { color: #ffb347; }
    #bombBtn:hover { border-color: #ffb347; }

    #message {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 2px;
      min-height: 22px;
      text-align: center;
    }

    .back-link {
      margin-top: 24px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }
  </style>
</head>
<body>

  <h1>&#128126; Levi Galaxy</h1>
  <p class="subtitle">Move to dodge &middot; Levi fires automatically &middot; B drops a bomb &middot; P to pause</p>

  <canvas id="gameCanvas" width="520" height="700"></canvas>

  <div id="ui">
    <div class="pill">SCORE<span id="score">0</span></div>
    <div class="pill">WAVE<span id="wave">1</span></div>
    <div class="pill">BEST<span id="best">0</span></div>
    <div class="pill lives" id="lives">&#9829;&#9829;&#9829;</div>
    <button id="bombBtn" title="drop a bomb (B)">&#128165; <span id="bombs">2</span></button>
    <button id="muteBtn" title="toggle sound">&#128266;</button>
  </div>

  <div id="message">Click, tap or press SPACE to launch</div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const waveEl = document.getElementById('wave');
  const bestEl = document.getElementById('best');
  const livesEl = document.getElementById('lives');
  const bombsEl = document.getElementById('bombs');
  const msgEl = document.getElementById('message');

  const BEST_KEY = 'leviGalaxy.best';
  const MUTE_KEY = 'leviGalaxy.muted';

  // ---- SOUND (tiny WebAudio synth — no audio files) ----
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  let audio = null;
  function ac() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  function beep(freq, dur, type = 'sine', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      const a = ac();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination);
      o.start();
      o.stop(a.currentTime + dur);
    } catch (e) { /* audio blocked — stay silent */ }
  }
  function noise(dur, vol = 0.08) {
    if (muted) return;
    try {
      const a = ac();
      const len = Math.floor(a.sampleRate * dur);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const s = a.createBufferSource();
      s.buffer = buf;
      const g = a.createGain();
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      s.connect(g).connect(a.destination);
      s.start();
    } catch (e) { /* silent */ }
  }
  const sfx = {
    shoot()    { beep(880, 0.05, 'square', 0.02, -300); },
    hit()      { beep(200, 0.05, 'square', 0.04); },
    explode(n) { noise(0.18, 0.06); beep(160 + Math.min(12, n) * 30, 0.12, 'triangle', 0.05, -80); },
    rock()     { noise(0.12, 0.04); },
    power()    { beep(620, 0.09); setTimeout(() => beep(930, 0.12), 70); setTimeout(() => beep(1240, 0.14), 140); },
    shield()   { beep(500, 0.15, 'triangle', 0.06, 200); },
    bomb()     { noise(0.5, 0.12); beep(90, 0.5, 'sawtooth', 0.09, -60); },
    die()      { noise(0.4, 0.1); beep(320, 0.6, 'sawtooth', 0.08, -280); },
    life()     { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.06), i * 90)); },
    clear()    { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.06), i * 110)); },
    boss()     { [110, 110, 138, 110].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'sawtooth', 0.08), i * 240)); },
    bossDown() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.07), i * 130)); },
    best()     { beep(660, 0.1); setTimeout(() => beep(880, 0.12), 90); setTimeout(() => beep(1108, 0.18), 200); },
  };

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    refreshMute();
    muteBtn.blur();
  });
  refreshMute();

  // ---- Levi sprite (the pilot!) ----
  const leviImg = new Image();
  leviImg.src = 'levi.png';
  let imgLoaded = false;
  leviImg.onload = () => { imgLoaded = true; };

  // ---- Helpers ----
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
  function bez(p0, p1, p2, t) {
    const u = 1 - t;
    return { x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x, y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y };
  }
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  // ---- Enemy types ----
  const TYPES = {
    drone: { hp: 1, pts: 10, color: '#5dff7a', dark: '#1f8f3a', r: 14, diveT: 2.3, shoot: false },
    crab:  { hp: 2, pts: 20, color: '#c77dff', dark: '#6a2ea3', r: 15, diveT: 2.5, shoot: true },
    wasp:  { hp: 1, pts: 30, color: '#ffb347', dark: '#b3641a', r: 13, diveT: 1.4, shoot: false, zig: true },
    tank:  { hp: 4, pts: 50, color: '#ff5b6b', dark: '#8f1f2c', r: 17, diveT: 2.9, shoot: true, spread: true },
  };

  const POWERS = {
    spread: { color: '#ffe600', label: 'S', name: 'SPREAD SHOT' },
    rapid:  { color: '#4dd9ff', label: 'R', name: 'RAPID FIRE' },
    shield: { color: '#5d8bff', label: '●', name: 'SHIELD' },
    bomb:   { color: '#ffb347', label: 'B', name: '+1 BOMB' },
    life:   { color: '#ff6b9d', label: '♥', name: 'EXTRA LIFE' },
  };

  // ---- State ----
  let state = 'title'; // title | play | banner | over | paused
  let prevState = 'play';
  let score = 0;
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  let lives = 3;
  let bombs = 2;
  let wave = 0;
  let streak = 0;
  let time = 0;
  let shake = 0;
  let flash = 0;
  let bannerT = 0;
  let bannerText = '';
  let bannerSub = '';
  let overT = 0;
  let newBest = false;
  let killsThisWave = 0;

  const player = {
    x: W / 2, y: H - 72, targetX: W / 2, alive: true,
    invuln: 0, shield: false, spread: 0, rapid: 0, fireCd: 0, respawnT: 0, tilt: 0,
  };

  let enemies = [], pBullets = [], eBullets = [], particles = [], powerups = [], asteroids = [], popups = [];
  let boss = null;
  let formCols = 5;
  let diveCd = 2;
  let asteroidCd = 5;
  let bossDroneCd = 0;

  // ---- Stars ----
  const stars = [];
  for (let i = 0; i < 110; i++) {
    const layer = i % 3;
    stars.push({ x: Math.random() * W, y: Math.random() * H, layer, size: layer === 2 ? 2 : 1, tw: Math.random() * 6.28 });
  }

  function updateHud() {
    scoreEl.textContent = score;
    waveEl.textContent = Math.max(1, wave);
    bestEl.textContent = best;
    livesEl.innerHTML = lives > 0 ? '&#9829;'.repeat(lives) : '&#9760;';
    bombsEl.textContent = bombs;
  }
  updateHud();

  // ---- Input ----
  const keys = { left: false, right: false };
  let pointerActive = false;

  function canvasX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; pointerActive = false; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; pointerActive = false; e.preventDefault(); }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); primaryAction(); }
    if (e.code === 'KeyB' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { e.preventDefault(); useBomb(); }
    if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); togglePause(); }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  canvas.addEventListener('mousemove', e => { player.targetX = canvasX(e.clientX); pointerActive = true; });
  canvas.addEventListener('mousedown', e => { e.preventDefault(); primaryAction(); });
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    player.targetX = canvasX(e.touches[0].clientX);
    pointerActive = true;
    primaryAction();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    player.targetX = canvasX(e.touches[0].clientX);
    pointerActive = true;
  }, { passive: false });

  document.getElementById('bombBtn').addEventListener('click', e => { useBomb(); e.currentTarget.blur(); });

  function primaryAction() {
    if (state === 'title' || (state === 'over' && overT > 1)) startGame();
    else if (state === 'paused') togglePause();
  }

  function togglePause() {
    if (state === 'play' || state === 'banner') {
      prevState = state;
      state = 'paused';
      msgEl.textContent = 'PAUSED — press P, SPACE or tap to resume';
    } else if (state === 'paused') {
      state = prevState;
      msgEl.textContent = '';
    }
  }

  // ---- Game flow ----
  function startGame() {
    score = 0; lives = 3; bombs = 2; wave = 0; streak = 0; newBest = false;
    enemies = []; pBullets = []; eBullets = []; particles = []; powerups = []; asteroids = []; popups = [];
    boss = null; shake = 0; flash = 0;
    player.x = W / 2; player.targetX = W / 2; player.alive = true; player.invuln = 2;
    player.shield = false; player.spread = 0; player.rapid = 0; player.fireCd = 0;
    msgEl.textContent = '';
    nextWave();
  }

  function nextWave() {
    wave++;
    killsThisWave = 0;
    updateHud();
    state = 'banner';
    bannerT = 0;
    if (wave % 5 === 0) {
      bannerText = 'WARNING!';
      bannerSub = 'MOTHERSHIP APPROACHING';
      sfx.boss();
    } else {
      bannerText = 'WAVE ' + wave;
      bannerSub = wave === 1 ? 'HERE THEY COME' : ['GET READY', 'THEY\'RE FASTER NOW', 'STAY SHARP', 'DON\'T BLINK'][wave % 4];
    }
  }

  function spawnWave() {
    enemies = [];
    boss = null;
    if (wave % 5 === 0) { spawnBoss(); return; }
    const rows = Math.min(5, 2 + Math.floor((wave - 1) / 2));
    formCols = Math.min(8, 5 + Math.floor((wave - 1) / 3));
    let idx = 0;
    for (let row = 0; row < rows; row++) {
      const type = rowType(row, rows, wave);
      for (let col = 0; col < formCols; col++) {
        const t = TYPES[type];
        const side = (row % 2 === 0) ? (col % 2 === 0 ? -1 : 1) : (col % 2 === 0 ? 1 : -1);
        enemies.push({
          type, hp: t.hp, col, row, alive: true, flash: 0,
          x: side < 0 ? -30 : W + 30, y: -20 - row * 12,
          state: 'enter', t: -0.05 * idx - row * 0.15,
          start: { x: side < 0 ? -30 : W + 30, y: -20 - row * 12 },
          ctrl: { x: side < 0 ? W * 0.25 : W * 0.75, y: 260 + row * 30 },
          shootCd: rand(2, 6), wob: Math.random() * 6.28,
        });
        idx++;
      }
    }
    diveCd = 2.5;
  }

  function rowType(row, rows, n) {
    if (row === 0) return n >= 4 ? 'tank' : (n >= 2 ? 'crab' : 'drone');
    if (row === 1) return n >= 2 ? 'crab' : 'drone';
    if (row === 2 && n >= 3) return 'wasp';
    return 'drone';
  }

  function spawnBoss() {
    const tier = wave / 5;
    boss = {
      x: W / 2, y: -80, targetY: 120, hp: 40 + 30 * tier, maxHp: 40 + 30 * tier, tier,
      t: 0, shootCd: 2, pattern: 0, flash: 0, alive: true, dir: 1,
    };
    bossDroneCd = 5;
  }

  function slotPos(e) {
    const sway = Math.sin(time * 0.9) * (40 + Math.min(40, wave * 4));
    const fx = W / 2 + sway + (e.col - (formCols - 1) / 2) * 52;
    const fy = 90 + e.row * 42 + Math.sin(time * 2 + e.wob) * 2;
    return { x: fx, y: fy };
  }

  // ---- Actions ----
  function fire() {
    const speed = 560;
    if (player.spread > 0) {
      pBullets.push({ x: player.x, y: player.y - 30, vx: 0, vy: -speed });
      pBullets.push({ x: player.x - 8, y: player.y - 24, vx: -150, vy: -speed });
      pBullets.push({ x: player.x + 8, y: player.y - 24, vx: 150, vy: -speed });
    } else {
      pBullets.push({ x: player.x, y: player.y - 30, vx: 0, vy: -speed });
    }
    sfx.shoot();
  }

  function useBomb() {
    if (state !== 'play' || !player.alive || bombs <= 0) return;
    bombs--;
    updateHud();
    sfx.bomb();
    flash = 1;
    shake = 14;
    eBullets = [];
    enemies.forEach(e => { if (e.alive) damageEnemy(e, 3); });
    asteroids.forEach(a => breakAsteroid(a));
    asteroids = [];
    if (boss && boss.alive) damageBoss(8);
    for (let i = 0; i < 60; i++) {
      const ang = Math.random() * 6.28, sp = rand(120, 420);
      particles.push({ x: player.x, y: player.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 100, life: 0.8, max: 0.8, color: '#ffb347', size: rand(2, 5) });
    }
  }

  function addScore(pts, x, y) {
    const mult = 1 + Math.min(4, Math.floor(streak / 8));
    const v = pts * mult;
    score += v;
    if (score > best) {
      if (!newBest && best > 0) sfx.best();
      newBest = true;
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    if (x !== undefined) popups.push({ x, y, text: '+' + v + (mult > 1 ? ' x' + mult : ''), life: 0.9, color: mult > 1 ? '#ffe600' : '#fff' });
    updateHud();
  }

  function explode(x, y, color, n = 16, sp = 220) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * 6.28, s = rand(40, sp);
      particles.push({ x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, life: rand(0.35, 0.7), max: 0.7, color, size: rand(2, 4) });
    }
  }

  function damageEnemy(e, dmg) {
    e.hp -= dmg;
    e.flash = 0.1;
    if (e.hp <= 0) {
      e.alive = false;
      const t = TYPES[e.type];
      streak++;
      killsThisWave++;
      addScore(t.pts, e.x, e.y);
      explode(e.x, e.y, t.color, 18);
      sfx.explode(streak);
      maybeDrop(e.x, e.y);
    } else {
      sfx.hit();
    }
  }

  function damageBoss(dmg) {
    boss.hp -= dmg;
    boss.flash = 0.1;
    if (boss.hp <= 0) {
      boss.alive = false;
      streak += 5;
      addScore(500 * boss.tier, boss.x, boss.y);
      for (let i = 0; i < 6; i++) setTimeout(() => explode(boss.x + rand(-50, 50), boss.y + rand(-30, 30), ['#ff5b6b', '#ffe600', '#fff'][i % 3], 22, 300), i * 90);
      shake = 18;
      sfx.bossDown();
      powerups.push({ x: boss.x, y: boss.y, kind: 'life', vy: 80 });
      powerups.push({ x: boss.x - 40, y: boss.y, kind: 'bomb', vy: 80 });
    } else {
      sfx.hit();
    }
  }

  function maybeDrop(x, y) {
    if (Math.random() > 0.13) return;
    const roll = Math.random();
    let kind = 'spread';
    if (roll < 0.30) kind = 'spread';
    else if (roll < 0.58) kind = 'rapid';
    else if (roll < 0.80) kind = 'shield';
    else if (roll < 0.94) kind = 'bomb';
    else kind = 'life';
    powerups.push({ x, y, kind, vy: 85 });
  }

  function collectPower(p) {
    sfx.power();
    let text = POWERS[p.kind].name;
    if (p.kind === 'spread') player.spread = 12;
    else if (p.kind === 'rapid') player.rapid = 12;
    else if (p.kind === 'shield') player.shield = true;
    else if (p.kind === 'bomb') { bombs = Math.min(5, bombs + 1); updateHud(); }
    else if (p.kind === 'life') { lives = Math.min(5, lives + 1); updateHud(); sfx.life(); }
    popups.push({ x: player.x, y: player.y - 50, text, life: 1.2, color: POWERS[p.kind].color });
  }

  function enemyShoot(e) {
    const t = TYPES[e.type];
    const dx = player.x - e.x, dy = player.y - e.y;
    const len = Math.hypot(dx, dy) || 1;
    const sp = 200 + Math.min(120, wave * 8);
    if (t.spread) {
      for (let k = -1; k <= 1; k++) {
        const ang = Math.atan2(dy, dx) + k * 0.28;
        eBullets.push({ x: e.x, y: e.y + 10, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 4, color: t.color });
      }
    } else {
      eBullets.push({ x: e.x, y: e.y + 10, vx: dx / len * sp, vy: dy / len * sp, r: 4, color: t.color });
    }
  }

  function startDive(e) {
    e.state = 'dive';
    e.t = 0;
    e.start = { x: e.x, y: e.y };
    const tx = clamp(player.x + rand(-80, 80), 30, W - 30);
    e.ctrl = { x: clamp(e.x + rand(-220, 220), 0, W), y: H * 0.5 };
    e.end = { x: tx, y: H + 50 };
    e.shot = false;
  }

  function spawnAsteroid() {
    const r = rand(13, 26);
    const pts = [];
    const n = 7 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const ang = i / n * 6.28;
      const rr = r * rand(0.72, 1.12);
      pts.push({ x: Math.cos(ang) * rr, y: Math.sin(ang) * rr });
    }
    asteroids.push({ x: rand(30, W - 30), y: -40, vx: rand(-30, 30), vy: rand(55, 105), r, pts, rot: 0, vr: rand(-1.5, 1.5), hp: Math.round(1 + r / 9), flash: 0 });
  }

  function breakAsteroid(a) {
    explode(a.x, a.y, '#a9a9b8', 14, 160);
    sfx.rock();
  }

  function hitPlayer() {
    if (!player.alive || player.invuln > 0) return;
    if (player.shield) {
      player.shield = false;
      player.invuln = 1.2;
      sfx.shield();
      explode(player.x, player.y, '#5d8bff', 20, 200);
      popups.push({ x: player.x, y: player.y - 50, text: 'SHIELD BROKE', life: 1, color: '#5d8bff' });
      return;
    }
    player.alive = false;
    player.respawnT = 1.6;
    player.spread = 0; player.rapid = 0;
    streak = 0;
    lives--;
    updateHud();
    shake = 16;
    sfx.die();
    explode(player.x, player.y, '#ffe600', 30, 300);
    explode(player.x, player.y, '#fff', 14, 200);
    eBullets = [];
    if (lives <= 0) {
      state = 'over';
      overT = 0;
      msgEl.textContent = 'Game over — click, tap or press SPACE to play again';
    }
  }

  // ---- Update ----
  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 2.5);

    // stars
    const warp = state === 'banner' ? 6 : 1;
    stars.forEach(s => {
      s.y += (20 + s.layer * 35) * warp * dt;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    });

    updateParticles(dt);

    if (state === 'banner') {
      bannerT += dt;
      if (bannerT >= 1.7) { state = 'play'; spawnWave(); }
      updatePlayer(dt, false);
      return;
    }
    if (state === 'over') { overT += dt; updateBullets(dt); updateEnemies(dt); return; }
    if (state !== 'play') return;

    updatePlayer(dt, true);
    updateBullets(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateAsteroids(dt);
    updatePowerups(dt);
    collide();

    // wave clear?
    const formationLeft = enemies.some(e => e.alive);
    const bossLeft = boss && boss.alive;
    if (!formationLeft && !bossLeft && player.alive) {
      if (wave % 5 === 0) { /* boss reward already given */ }
      else if (killsThisWave === enemies.length && enemies.length > 0) { addScore(100 * wave); popups.push({ x: W / 2, y: H / 2, text: 'WAVE CLEAR +' + (100 * wave * (1 + Math.min(4, Math.floor(streak / 8)))), life: 1.4, color: '#ffe600' }); }
      sfx.clear();
      nextWave();
    }
  }

  function updatePlayer(dt, canFire) {
    if (!player.alive) {
      player.respawnT -= dt;
      if (player.respawnT <= 0 && lives > 0 && state !== 'over') {
        player.alive = true;
        player.invuln = 2.2;
        player.x = W / 2; player.targetX = W / 2;
      }
      return;
    }
    if (player.invuln > 0) player.invuln -= dt;
    if (player.spread > 0) player.spread -= dt;
    if (player.rapid > 0) player.rapid -= dt;

    let vx = 0;
    if (keys.left) vx -= 380;
    if (keys.right) vx += 380;
    if (vx !== 0) {
      player.x += vx * dt;
    } else if (pointerActive) {
      const dx = player.targetX - player.x;
      const step = dx * Math.min(1, dt * 14);
      player.x += step;
      vx = step / Math.max(dt, 0.001);
    }
    player.x = clamp(player.x, 26, W - 26);
    player.tilt += ((clamp(vx / 380, -1, 1) * 0.28) - player.tilt) * Math.min(1, dt * 10);

    if (canFire) {
      player.fireCd -= dt;
      if (player.fireCd <= 0) {
        fire();
        player.fireCd = player.rapid > 0 ? 0.1 : 0.2;
      }
    }
  }

  function updateBullets(dt) {
    for (let i = pBullets.length - 1; i >= 0; i--) {
      const b = pBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -20 || b.x < -10 || b.x > W + 10) pBullets.splice(i, 1);
    }
    for (let i = eBullets.length - 1; i >= 0; i--) {
      const b = eBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) eBullets.splice(i, 1);
    }
  }

  function updateEnemies(dt) {
    let inFormation = [];
    enemies.forEach(e => {
      if (!e.alive) return;
      if (e.flash > 0) e.flash -= dt;
      const t = TYPES[e.type];
      if (e.state === 'enter') {
        e.t += dt / 1.3;
        if (e.t < 0) { e.x = e.start.x; e.y = e.start.y; return; }
        const slot = slotPos(e);
        if (e.t >= 1) { e.state = 'formation'; e.x = slot.x; e.y = slot.y; }
        else { const p = bez(e.start, e.ctrl, slot, easeOut(e.t)); e.x = p.x; e.y = p.y; }
      } else if (e.state === 'formation') {
        const slot = slotPos(e);
        e.x = slot.x; e.y = slot.y;
        inFormation.push(e);
        if (t.shoot && wave >= 2 && state === 'play') {
          e.shootCd -= dt;
          if (e.shootCd <= 0) { enemyShoot(e); e.shootCd = rand(3, 7) - Math.min(2, wave * 0.15); }
        }
      } else if (e.state === 'dive') {
        e.t += dt / t.diveT;
        const p = bez(e.start, e.ctrl, e.end, Math.min(1, e.t));
        e.x = p.x + (t.zig ? Math.sin(e.t * 18) * 26 : 0);
        e.y = p.y;
        if (!e.shot && e.t > 0.45 && t.shoot && state === 'play') { e.shot = true; enemyShoot(e); }
        if (e.t >= 1) {
          if (e.fromBoss) { e.alive = false; return; } // mothership escorts don't come back
          e.state = 'return'; e.t = 0;
          const slot = slotPos(e);
          e.start = { x: clamp(slot.x + rand(-60, 60), 20, W - 20), y: -40 };
          e.ctrl = { x: slot.x, y: slot.y - 40 };
          e.x = e.start.x; e.y = e.start.y;
        }
      } else if (e.state === 'return') {
        e.t += dt / 1.1;
        const slot = slotPos(e);
        if (e.t >= 1) { e.state = 'formation'; e.x = slot.x; e.y = slot.y; }
        else { const p = bez(e.start, e.ctrl, slot, easeOut(e.t)); e.x = p.x; e.y = p.y; }
      }
    });

    if (state !== 'play') return;
    diveCd -= dt;
    if (diveCd <= 0 && inFormation.length > 0) {
      const count = wave >= 6 ? 2 : 1;
      for (let k = 0; k < count && inFormation.length > 0; k++) {
        // prefer lower rows (closest to the player) — pick from the bottom two rows when possible
        const maxRow = Math.max(...inFormation.map(e => e.row));
        const pool = inFormation.filter(e => e.row >= maxRow - 1);
        const e = pool[Math.floor(Math.random() * pool.length)];
        inFormation = inFormation.filter(o => o !== e);
        startDive(e);
      }
      const alive = enemies.filter(e => e.alive).length;
      diveCd = Math.max(0.6, 2.6 - wave * 0.12) * (alive <= 3 ? 0.6 : 1);
    }
  }

  function updateBoss(dt) {
    if (!boss || !boss.alive) return;
    boss.t += dt;
    if (boss.flash > 0) boss.flash -= dt;
    if (boss.y < boss.targetY) { boss.y += 60 * dt; return; }
    const speed = 70 + boss.tier * 25;
    boss.x += boss.dir * speed * dt;
    if (boss.x > W - 90) boss.dir = -1;
    if (boss.x < 90) boss.dir = 1;
    boss.y = boss.targetY + Math.sin(boss.t * 1.3) * 14;

    boss.shootCd -= dt;
    if (boss.shootCd <= 0) {
      boss.pattern = (boss.pattern + 1) % 3;
      const sp = 170 + boss.tier * 20;
      if (boss.pattern === 0) {
        const n = 10 + boss.tier * 2;
        for (let i = 0; i < n; i++) {
          const ang = i / n * 6.28 + boss.t;
          eBullets.push({ x: boss.x, y: boss.y + 20, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 5, color: '#ff5b6b' });
        }
      } else if (boss.pattern === 1) {
        const base = Math.atan2(player.y - boss.y, player.x - boss.x);
        for (let k = -2; k <= 2; k++) {
          const ang = base + k * 0.2;
          eBullets.push({ x: boss.x, y: boss.y + 30, vx: Math.cos(ang) * sp * 1.25, vy: Math.sin(ang) * sp * 1.25, r: 5, color: '#ffe600' });
        }
      } else {
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            if (!boss || !boss.alive || state !== 'play') return;
            const base = Math.atan2(player.y - boss.y, player.x - boss.x);
            eBullets.push({ x: boss.x + (i % 2 ? 40 : -40), y: boss.y + 30, vx: Math.cos(base) * sp * 1.4, vy: Math.sin(base) * sp * 1.4, r: 4, color: '#c77dff' });
          }, i * 110);
        }
      }
      boss.shootCd = Math.max(0.9, 2.1 - boss.tier * 0.2);
    }

    bossDroneCd -= dt;
    if (bossDroneCd <= 0) {
      bossDroneCd = Math.max(3.5, 7 - boss.tier);
      for (let k = -1; k <= 1; k += 2) {
        const e = {
          type: boss.tier >= 2 ? 'wasp' : 'drone', hp: 1, col: 0, row: 0, alive: true, flash: 0,
          x: boss.x + k * 50, y: boss.y + 30, state: 'dive', t: 0, shootCd: 99, wob: 0, shot: false,
          start: { x: boss.x + k * 50, y: boss.y + 30 }, ctrl: { x: boss.x + k * 200, y: H * 0.55 },
          end: { x: clamp(player.x + rand(-60, 60), 30, W - 30), y: H + 50 }, fromBoss: true,
        };
        enemies.push(e);
      }
    }
  }

  function updateAsteroids(dt) {
    if (wave >= 3) {
      asteroidCd -= dt;
      if (asteroidCd <= 0) { spawnAsteroid(); asteroidCd = rand(3, 7) - Math.min(2, wave * 0.1); }
    }
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.vr * dt;
      if (a.flash > 0) a.flash -= dt;
      if (a.y > H + 40) asteroids.splice(i, 1);
    }
  }

  function updatePowerups(dt) {
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy * dt;
      if (p.y > H + 20) powerups.splice(i, 1);
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.98; p.vy = p.vy * 0.98 + 60 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 30 * dt; p.life -= dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  function collide() {
    // player bullets vs enemies / boss / asteroids
    for (let i = pBullets.length - 1; i >= 0; i--) {
      const b = pBullets[i];
      let used = false;
      for (const e of enemies) {
        if (!e.alive || e.y < -10) continue;
        const r = TYPES[e.type].r + 3;
        if (dist2(b.x, b.y, e.x, e.y) < r * r) { damageEnemy(e, 1); used = true; break; }
      }
      if (!used && boss && boss.alive && boss.y > 0) {
        if (Math.abs(b.x - boss.x) < 70 && Math.abs(b.y - boss.y) < 34) { damageBoss(1); used = true; }
      }
      if (!used) {
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (dist2(b.x, b.y, a.x, a.y) < (a.r + 3) * (a.r + 3)) {
            a.hp--; a.flash = 0.1; used = true;
            if (a.hp <= 0) { breakAsteroid(a); asteroids.splice(j, 1); streak++; addScore(5, a.x, a.y); }
            else sfx.hit();
            break;
          }
        }
      }
      if (used) pBullets.splice(i, 1);
    }

    // stuff vs player
    if (player.alive && player.invuln <= 0) {
      const pr = 16;
      for (let i = eBullets.length - 1; i >= 0; i--) {
        const b = eBullets[i];
        if (dist2(b.x, b.y, player.x, player.y) < (pr + b.r) * (pr + b.r)) { eBullets.splice(i, 1); hitPlayer(); if (!player.alive) return; }
      }
      for (const e of enemies) {
        if (!e.alive) continue;
        const r = TYPES[e.type].r + pr - 4;
        if (dist2(e.x, e.y, player.x, player.y) < r * r) { damageEnemy(e, 99); hitPlayer(); if (!player.alive) return; }
      }
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (dist2(a.x, a.y, player.x, player.y) < (a.r + pr - 4) * (a.r + pr - 4)) { breakAsteroid(a); asteroids.splice(j, 1); hitPlayer(); if (!player.alive) return; }
      }
      if (boss && boss.alive && Math.abs(boss.x - player.x) < 70 + pr && Math.abs(boss.y - player.y) < 34 + pr) { hitPlayer(); if (!player.alive) return; }
    }

    // powerups vs player
    if (player.alive) {
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        if (dist2(p.x, p.y, player.x, player.y) < 30 * 30) { powerups.splice(i, 1); collectPower(p); }
      }
    }
  }

  // ---- Drawing ----
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    // background
    ctx.fillStyle = '#05050f';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    const warp = state === 'banner';
    stars.forEach(s => {
      const a = s.layer === 2 ? 0.9 : s.layer === 1 ? 0.6 : 0.35;
      ctx.fillStyle = `rgba(255,255,255,${a * (0.7 + 0.3 * Math.sin(time * 3 + s.tw))})`;
      if (warp) ctx.fillRect(s.x, s.y - 10 - s.layer * 8, s.size, 12 + s.layer * 8);
      else ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    drawAsteroids();
    drawPowerups();
    drawEnemies();
    drawBoss();
    drawBullets();
    drawPlayer();
    drawParticles();
    drawPopups();
    drawStreak();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,240,200,${flash * 0.7})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    if (state === 'title') drawTitle();
    else if (state === 'banner') drawBanner();
    else if (state === 'over') drawOver();
    else if (state === 'paused') drawPaused();

    ctx.restore();
  }

  function drawPlayer() {
    if (!player.alive || state === 'title') return;
    if (player.invuln > 0 && Math.floor(time * 16) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);

    // rocket flames
    const fl = 12 + Math.sin(time * 40) * 5 + (player.rapid > 0 ? 6 : 0);
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath(); ctx.moveTo(-12, 26); ctx.lineTo(-6, 26 + fl); ctx.lineTo(0, 26); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(6, 26 + fl * 1.2); ctx.lineTo(12, 26); ctx.fill();
    ctx.fillStyle = '#ffe600';
    ctx.beginPath(); ctx.moveTo(-9, 26); ctx.lineTo(-6, 26 + fl * 0.5); ctx.lineTo(-3, 26); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, 26); ctx.lineTo(6, 26 + fl * 0.6); ctx.lineTo(9, 26); ctx.fill();

    // rocket board
    ctx.fillStyle = '#d0d0e0';
    ctx.beginPath();
    ctx.moveTo(-26, 18); ctx.lineTo(26, 18); ctx.lineTo(22, 27); ctx.lineTo(-22, 27); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff5b6b';
    ctx.fillRect(-26, 18, 52, 4);
    ctx.fillStyle = '#4dd9ff';
    ctx.fillRect(-16, 22, 6, 3); ctx.fillRect(10, 22, 6, 3);
    // fins
    ctx.fillStyle = '#ff5b6b';
    ctx.beginPath(); ctx.moveTo(-26, 18); ctx.lineTo(-34, 30); ctx.lineTo(-22, 27); ctx.fill();
    ctx.beginPath(); ctx.moveTo(26, 18); ctx.lineTo(34, 30); ctx.lineTo(22, 27); ctx.fill();

    // laser guns on the board
    ctx.fillStyle = '#ffe600';
    ctx.fillRect(-24, 8, 4, 10); ctx.fillRect(20, 8, 4, 10);

    // Levi!
    if (imgLoaded) {
      const h = 66;
      const w = h * (leviImg.width / leviImg.height);
      ctx.drawImage(leviImg, -w / 2, 19 - h, w, h);
    } else {
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(-8, -40, 16, 58);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // shield bubble
    if (player.shield) {
      ctx.strokeStyle = `rgba(93,139,255,${0.55 + 0.3 * Math.sin(time * 6)})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(player.x, player.y, 40, 0, 6.28); ctx.stroke();
      ctx.fillStyle = 'rgba(93,139,255,0.08)';
      ctx.fill();
    }

    // power-up timers
    let ty = player.y + 48;
    if (player.spread > 0) { drawTimerBar(player.x, ty, player.spread / 12, POWERS.spread.color); ty += 7; }
    if (player.rapid > 0) { drawTimerBar(player.x, ty, player.rapid / 12, POWERS.rapid.color); }
  }

  function drawTimerBar(x, y, f, color) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x - 22, y, 44, 4);
    ctx.fillStyle = color;
    ctx.fillRect(x - 22, y, 44 * clamp(f, 0, 1), 4);
  }

  function drawBullets() {
    pBullets.forEach(b => {
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
      ctx.fillStyle = '#fff';
      ctx.fillRect(b.x - 1, b.y - 6, 2, 8);
    });
    eBullets.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, 6.28); ctx.fill();
    });
  }

  function drawEnemies() {
    enemies.forEach(e => {
      if (!e.alive) return;
      ctx.save();
      ctx.translate(e.x, e.y);
      const t = TYPES[e.type];
      const flap = Math.sin(time * 8 + e.wob);
      const body = e.flash > 0 ? '#fff' : t.color;
      const dark = e.flash > 0 ? '#ddd' : t.dark;
      if (e.type === 'drone') {
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.ellipse(0, 4, 15, 6, 0, 0, 6.28); ctx.fill();
        ctx.fillStyle = body;
        ctx.beginPath(); ctx.arc(0, 0, 9, Math.PI, 0); ctx.fill();
        ctx.fillRect(-15, 1, 30, 4);
        ctx.fillStyle = '#05050f';
        ctx.fillRect(-4, -5, 3, 3); ctx.fillRect(1, -5, 3, 3);
        ctx.fillStyle = '#ffe600';
        [-10, 0, 10].forEach((lx, i) => { if (Math.floor(time * 6 + i) % 3 === 0) ctx.fillRect(lx - 1, 6, 2, 2); });
      } else if (e.type === 'crab') {
        ctx.fillStyle = dark;
        ctx.fillRect(-18, -4 + flap * 2, 6, 12); ctx.fillRect(12, -4 - flap * 2, 6, 12);
        ctx.fillRect(-20, -8 + flap * 2, 5, 5); ctx.fillRect(15, -8 - flap * 2, 5, 5);
        ctx.fillStyle = body;
        ctx.fillRect(-13, -8, 26, 16);
        ctx.fillRect(-9, -12, 18, 4);
        ctx.fillStyle = '#05050f';
        ctx.fillRect(-8, -4, 5, 4); ctx.fillRect(3, -4, 5, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-7, -3, 2, 2); ctx.fillRect(4, -3, 2, 2);
        ctx.fillStyle = dark;
        ctx.fillRect(-10, 8, 4, 4); ctx.fillRect(-3, 8, 6, 3); ctx.fillRect(6, 8, 4, 4);
      } else if (e.type === 'wasp') {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.ellipse(-12, -2, 10, 4 + flap * 3, -0.4, 0, 6.28); ctx.fill();
        ctx.beginPath(); ctx.ellipse(12, -2, 10, 4 + flap * 3, 0.4, 0, 6.28); ctx.fill();
        ctx.fillStyle = body;
        ctx.beginPath(); ctx.ellipse(0, 0, 7, 13, 0, 0, 6.28); ctx.fill();
        ctx.fillStyle = dark;
        ctx.fillRect(-7, -2, 14, 3); ctx.fillRect(-6, 5, 12, 3);
        ctx.fillStyle = '#05050f';
        ctx.fillRect(-5, -9, 3, 3); ctx.fillRect(2, -9, 3, 3);
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.moveTo(-3, 12); ctx.lineTo(0, 18); ctx.lineTo(3, 12); ctx.fill();
      } else if (e.type === 'tank') {
        ctx.fillStyle = dark;
        ctx.fillRect(-18, -14, 36, 30);
        ctx.fillStyle = body;
        ctx.fillRect(-15, -11, 30, 24);
        ctx.fillStyle = dark;
        ctx.fillRect(-15, -3, 30, 3); ctx.fillRect(-15, 5, 30, 3);
        ctx.fillStyle = e.flash > 0 ? '#fff' : `hsl(${(time * 200) % 360}, 100%, 70%)`;
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#05050f';
        ctx.fillRect(-11, -9, 4, 3); ctx.fillRect(7, -9, 4, 3);
        ctx.fillStyle = dark;
        ctx.fillRect(-12, 16, 5, 5); ctx.fillRect(7, 16, 5, 5);
        // hp pips
        for (let i = 0; i < TYPES.tank.hp; i++) {
          ctx.fillStyle = i < e.hp ? '#ffe600' : 'rgba(255,255,255,0.15)';
          ctx.fillRect(-14 + i * 8, -19, 6, 3);
        }
      }
      ctx.restore();
    });
  }

  function drawBoss() {
    if (!boss || !boss.alive) return;
    ctx.save();
    ctx.translate(boss.x, boss.y);
    const hurt = boss.flash > 0;
    // hull
    ctx.fillStyle = hurt ? '#fff' : '#3a3a5c';
    ctx.beginPath(); ctx.ellipse(0, 10, 78, 26, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = hurt ? '#eee' : '#5a5a86';
    ctx.beginPath(); ctx.ellipse(0, 4, 68, 18, 0, 0, 6.28); ctx.fill();
    // dome
    ctx.fillStyle = hurt ? '#fff' : 'rgba(77,217,255,0.85)';
    ctx.beginPath(); ctx.arc(0, -4, 30, Math.PI, 0); ctx.fill();
    ctx.fillStyle = hurt ? '#ddd' : '#ff5b6b';
    ctx.beginPath(); ctx.arc(0, -10, 12, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#05050f';
    ctx.beginPath(); ctx.arc(Math.cos(boss.t * 2) * 4, -10, 5, 0, 6.28); ctx.fill();
    // lights
    for (let i = -3; i <= 3; i++) {
      ctx.fillStyle = (Math.floor(time * 8) + i) % 3 === 0 ? '#ffe600' : (hurt ? '#ccc' : '#ff5b6b');
      ctx.beginPath(); ctx.arc(i * 20, 24, 4, 0, 6.28); ctx.fill();
    }
    // cannons
    ctx.fillStyle = hurt ? '#ccc' : '#2a2a44';
    ctx.fillRect(-46, 26, 12, 12); ctx.fillRect(34, 26, 12, 12); ctx.fillRect(-6, 30, 12, 12);
    ctx.restore();

    // hp bar
    const bw = 300;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(W / 2 - bw / 2, 18, bw, 10);
    ctx.fillStyle = '#ff5b6b';
    ctx.fillRect(W / 2 - bw / 2, 18, bw * clamp(boss.hp / boss.maxHp, 0, 1), 10);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(W / 2 - bw / 2, 18, bw, 10);
    ctx.fillStyle = '#ff5b6b';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MOTHERSHIP', W / 2, 44);
  }

  function drawAsteroids() {
    asteroids.forEach(a => {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.fillStyle = a.flash > 0 ? '#fff' : '#6d6d80';
      ctx.strokeStyle = a.flash > 0 ? '#fff' : '#a9a9b8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      a.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.arc(a.r * 0.3, -a.r * 0.2, a.r * 0.22, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(-a.r * 0.35, a.r * 0.3, a.r * 0.16, 0, 6.28); ctx.fill();
      ctx.restore();
    });
  }

  function drawPowerups() {
    powerups.forEach(p => {
      const c = POWERS[p.kind];
      const pulse = 1 + Math.sin(time * 8) * 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = c.color;
      ctx.shadowColor = c.color; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, 6.28); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#05050f';
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(c.label, 0, 1);
      ctx.restore();
    });
    ctx.textBaseline = 'alphabetic';
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center';
    popups.forEach(p => {
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;
  }

  function drawStreak() {
    if (state !== 'play' || streak < 8) return;
    const mult = 1 + Math.min(4, Math.floor(streak / 8));
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('STREAK ' + streak + '  ×' + mult, W - 14, H - 14);
  }

  function drawOverlay(alpha = 0.55) {
    ctx.fillStyle = `rgba(5,5,15,${alpha})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  function drawTitle() {
    drawOverlay(0.45);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 44px "Courier New", monospace';
    ctx.fillText('LEVI GALAXY', W / 2, 150);
    ctx.fillStyle = '#4dd9ff';
    ctx.font = '15px "Courier New", monospace';
    ctx.fillText('THE INVADERS ARE HERE. LEVI IS READY.', W / 2, 185);

    // Levi on his rocket board, bobbing
    ctx.save();
    ctx.translate(W / 2, 320 + Math.sin(time * 2) * 8);
    const fl = 14 + Math.sin(time * 40) * 5;
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath(); ctx.moveTo(-18, 40); ctx.lineTo(-9, 40 + fl * 1.5); ctx.lineTo(0, 40); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(9, 40 + fl * 1.8); ctx.lineTo(18, 40); ctx.fill();
    ctx.fillStyle = '#d0d0e0';
    ctx.beginPath(); ctx.moveTo(-40, 28); ctx.lineTo(40, 28); ctx.lineTo(34, 41); ctx.lineTo(-34, 41); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5b6b'; ctx.fillRect(-40, 28, 80, 6);
    ctx.fillStyle = '#ffe600'; ctx.fillRect(-37, 12, 6, 16); ctx.fillRect(31, 12, 6, 16);
    if (imgLoaded) {
      const h = 100, w = h * (leviImg.width / leviImg.height);
      ctx.drawImage(leviImg, -w / 2, 30 - h, w, h);
    }
    ctx.restore();

    ctx.fillStyle = '#ccc';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('← → / A D / mouse / touch to move', W / 2, 440);
    ctx.fillText('Levi fires automatically · B = bomb · P = pause', W / 2, 464);
    ctx.fillStyle = '#888';
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('Catch power-ups: S spread  R rapid  ● shield  B bomb  ♥ life', W / 2, 496);
    ctx.fillText('Every 5th wave: a MOTHERSHIP. Kill streaks multiply your score.', W / 2, 516);

    if (Math.floor(time * 2) % 2 === 0) {
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('CLICK / TAP / SPACE TO LAUNCH', W / 2, 590);
    }
    if (best > 0) {
      ctx.fillStyle = '#666';
      ctx.font = '13px "Courier New", monospace';
      ctx.fillText('BEST: ' + best, W / 2, 640);
    }
  }

  function drawBanner() {
    const a = bannerT < 0.3 ? bannerT / 0.3 : bannerT > 1.3 ? Math.max(0, (1.7 - bannerT) / 0.4) : 1;
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    const bossWave = wave % 5 === 0;
    ctx.fillStyle = bossWave ? '#ff5b6b' : '#ffe600';
    ctx.font = 'bold 46px "Courier New", monospace';
    ctx.fillText(bannerText, W / 2, H / 2 - 10);
    ctx.fillStyle = bossWave ? '#ffb347' : '#4dd9ff';
    ctx.font = '16px "Courier New", monospace';
    ctx.fillText(bannerSub, W / 2, H / 2 + 26);
    ctx.globalAlpha = 1;
  }

  function drawOver() {
    drawOverlay(0.6);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5b6b';
    ctx.font = 'bold 44px "Courier New", monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 70);
    ctx.fillStyle = '#fff';
    ctx.font = '20px "Courier New", monospace';
    ctx.fillText('SCORE ' + score, W / 2, H / 2 - 20);
    ctx.fillStyle = '#4dd9ff';
    ctx.font = '15px "Courier New", monospace';
    ctx.fillText('reached wave ' + wave, W / 2, H / 2 + 8);
    if (newBest) {
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText('★ NEW BEST! ★', W / 2, H / 2 + 44);
    } else {
      ctx.fillStyle = '#888';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('BEST ' + best, W / 2, H / 2 + 44);
    }
    if (overT > 1 && Math.floor(time * 2) % 2 === 0) {
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText('CLICK / TAP / SPACE TO PLAY AGAIN', W / 2, H / 2 + 100);
    }
  }

  function drawPaused() {
    drawOverlay(0.6);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.fillStyle = '#888';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('press P, SPACE or tap to resume', W / 2, H / 2 + 34);
  }

  // ---- Loop ----
  let last = 0;
  function loop(ts) {
    const dt = Math.min(0.033, (ts - last) / 1000 || 0);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play') togglePause();
  });
</script>
</body>
</html>
