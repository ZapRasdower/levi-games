<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levi Leap - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(900px 500px at 50% -80px, #191932, #0f0f1a 70%);
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(255,230,0,0.35);
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    #gameCanvas {
      border: 3px solid #333;
      border-radius: 10px;
      background: #111125;
      display: block;
      image-rendering: pixelated;
      max-width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }

    #ui {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 600px;
      margin-top: 14px;
      font-size: 0.78rem;
      color: #99a;
      letter-spacing: 1px;
    }

    #ui .pill {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      padding: 6px 14px;
    }

    #ui span { color: #ffe600; font-size: 0.95rem; margin-left: 5px; }

    #muteBtn {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      color: #ffe600;
      font-size: 0.9rem;
      padding: 5px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.12s;
    }

    #muteBtn:hover { border-color: #ffe600; }

    #message {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      min-height: 24px;
      text-align: center;
    }

    .back-link {
      margin-top: 28px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }
  </style>
</head>
<body>

  <h1>&#129354; Levi Leap</h1>
  <p class="subtitle">SPACE / TAP to jump &middot; double-jump &middot; P to pause</p>

  <canvas id="gameCanvas" width="600" height="220"></canvas>

  <div id="ui">
    <div class="pill">SCORE<span id="score">0</span></div>
    <div class="pill">COINS<span id="coins">0</span></div>
    <div class="pill">BEST<span id="best">0</span></div>
    <button id="muteBtn" title="toggle sound">&#128266;</button>
  </div>

  <div id="message">Press SPACE or tap to start</div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const coinsEl = document.getElementById('coins');
  const msgEl = document.getElementById('message');

  const BEST_KEY = 'leviLeap.best';
  const COINS_KEY = 'leviLeap.totalCoins';
  const MUTE_KEY = 'leviLeap.muted';

  // ---- SOUND (tiny WebAudio synth — no audio files) ----
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  let audio = null;
  function ac() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  function beep(freq, dur, type = 'square', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      const a = ac();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination);
      o.start();
      o.stop(a.currentTime + dur);
    } catch (e) { /* audio blocked — play silently */ }
  }
  const sfx = {
    jump()  { beep(340, 0.14, 'square', 0.05, 280); },
    coin(n) { beep(880 + Math.min(6, n) * 90, 0.12, 'sine', 0.08); },
    death() { beep(300, 0.4, 'sawtooth', 0.08, -240); },
    best()  { beep(660, 0.1); setTimeout(() => beep(880, 0.12), 90); setTimeout(() => beep(1108, 0.18), 200); },
    mile()  { beep(720, 0.08, 'triangle'); setTimeout(() => beep(960, 0.1, 'triangle'), 70); },
  };

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    refreshMute();
    muteBtn.blur(); // so SPACE jumps instead of re-toggling the button
  });
  refreshMute();

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = H - 40;

  const C = {
    skyTop:    '#070716',
    skyHorizon:'#1d1538',
    skyTopAlt: '#1a0d2e',
    skyHorAlt: '#3a2255',
    ground:    '#1c1a3a',
    groundTop: '#3a3a6a',
    grass:     '#2a4a7a',
    bgFar:     '#0e0e22',
    bgMid:     '#171834',
    obstBase:  '#1b1430',
    obstEdge:  '#5a2a6a',
    obstGlow:  '#ff4466',
    coinBody:  '#ffe600',
    coinDark:  '#b8a800',
    star:      '#ffe600',
    moon:      '#f4f1d4',
  };

  // Load Levi sprite
  const leviImg = new Image();
  leviImg.src = 'levi.png';
  let imgLoaded = false;
  leviImg.onload = () => { imgLoaded = true; };

  let state = 'idle';
  let score = 0;
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  let totalCoins = parseInt(localStorage.getItem(COINS_KEY) || '0', 10);
  let runCoins = 0;
  let frame = 0;
  let speed = 4;
  let stars = [];
  let obstacles = [];
  let coins = [];
  let particles = [];
  let floaters = [];
  let nextObstacle = 80;
  let nextCoin = 140;
  let groundOffset = 0;
  let bgFarOffset = 0;
  let bgMidOffset = 0;
  let shake = 0;
  let combo = 0;          // consecutive coins grabbed without a long gap
  let comboTimer = 0;
  let bonusScore = 0;     // score earned from coins (on top of distance)
  let flash = 0;          // milestone screen flash
  let lastMilestone = 0;
  let streaks = [];       // wind streaks at high speed
  bestEl.textContent = best;
  coinsEl.textContent = totalCoins;

  // ---- BACKGROUNDS (pre-rendered for performance) ----
  let bgFar = null;     // far mountains
  let bgMid = null;     // mid hills
  let skyGradient = null;
  const moon = { x: W - 90, y: 38, r: 14 };

  function buildMountainLayer(width, height, baseY, fill, peakCount, minPeak, maxPeak, rough) {
    const off = document.createElement('canvas');
    off.width = width;
    off.height = height;
    const c = off.getContext('2d');

    // Compute peak heights, ensuring first === last for seamless tiling.
    const ys = [];
    for (let i = 0; i < peakCount; i++) {
      const t = i / peakCount;
      const base = minPeak + Math.random() * (maxPeak - minPeak);
      // Layer some sines for organic ridges
      const extra = Math.sin(t * Math.PI * 4 + Math.random()) * rough;
      ys.push(baseY - base + extra);
    }
    ys.push(ys[0]);

    c.fillStyle = fill;
    c.beginPath();
    c.moveTo(0, height);
    const step = width / peakCount;
    for (let i = 0; i <= peakCount; i++) {
      // Small mid-point bumps so silhouettes aren't pure triangles
      const x = i * step;
      c.lineTo(x, ys[i]);
    }
    c.lineTo(width, height);
    c.closePath();
    c.fill();
    return off;
  }

  function buildBackgrounds() {
    // Far layer: gentle distant mountains
    bgFar = buildMountainLayer(W * 2, GROUND, GROUND - 14,
      C.bgFar, 14, 28, 70, 8);
    // Mid layer: closer, jaggier hills
    bgMid = buildMountainLayer(W * 2, GROUND, GROUND - 4,
      C.bgMid, 24, 18, 55, 12);
  }

  // ---- PLAYER (Levi) ----
  const SPRITE_W = 50;
  const SPRITE_H = 100;

  const player = {
    x: 90, y: GROUND, vy: 0, onGround: true, jumpCount: 0,
    squish: 1, rot: 0, targetRot: 0,
    draw() {
      const px = Math.floor(this.x);
      const py = Math.floor(this.y);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      const shadowScale = this.onGround ? 1 : Math.max(0.3, 1 - (GROUND - py) / 200);
      ctx.beginPath();
      ctx.ellipse(px, GROUND + 2, 22 * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(px, py - SPRITE_H / 2 * this.squish);
      ctx.rotate(this.rot);
      // Slight tilt during jump
      const sw = SPRITE_W;
      const sh = SPRITE_H * this.squish;
      if (imgLoaded) {
        ctx.drawImage(leviImg, -sw / 2, -sh / 2, sw, sh);
      } else {
        // fallback while image loads
        ctx.fillStyle = '#fff';
        ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
      }
      ctx.restore();

      // Double-jump-ready pip above the head while airborne
      if (!this.onGround && this.jumpCount < 2 && state === 'playing') {
        ctx.fillStyle = 'rgba(255,230,0,0.85)';
        ctx.beginPath();
        ctx.moveTo(px, py - SPRITE_H - 16);
        ctx.lineTo(px - 5, py - SPRITE_H - 8);
        ctx.lineTo(px + 5, py - SPRITE_H - 8);
        ctx.closePath();
        ctx.fill();
      }
    },
    jump() {
      if (this.jumpCount < 2) {
        this.vy = -11;
        this.onGround = false;
        this.jumpCount++;
        this.squish = 0.85;
        this.targetRot = this.jumpCount === 2 ? -Math.PI * 2 : -0.3;
        spawnJumpParticles(this.x, this.y);
        sfx.jump();
      }
    },
    update() {
      this.vy += 0.55;
      this.y += this.vy;
      if (this.y >= GROUND) {
        this.y = GROUND;
        this.vy = 0;
        if (!this.onGround) {
          this.squish = 1.15;
          spawnLandDust(this.x, this.y);
        }
        this.onGround = true;
        this.jumpCount = 0;
        this.targetRot = 0;
        this.rot = 0;
      }
      this.squish += (1 - this.squish) * 0.2;
      // Animate flip rotation
      this.rot += (this.targetRot - this.rot) * 0.15;
    },
    getBox() {
      return { x: this.x - 18, y: this.y - SPRITE_H + 8, w: 36, h: SPRITE_H - 8 };
    }
  };

  // ---- PARTICLES ----
  function spawnJumpParticles(x, y) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y - 4,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 2,
        life: 18,
        maxLife: 18,
        color: '#aaa'
      });
    }
  }

  function spawnDeathParticles(x, y) {
    for (let i = 0; i < 18; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 8,
        vy: -Math.random() * 7 - 2,
        life: 40,
        maxLife: 40,
        color: i % 2 === 0 ? '#ffe600' : C.obstGlow
      });
    }
  }

  function initStars() {
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * (GROUND - 80),
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 1.6,
        size:  Math.random() < 0.15 ? 2 : 1,
        base:  0.35 + Math.random() * 0.5,
      });
    }
  }

  function spawnLandDust(x, y) {
    for (let i = 0; i < 5; i++) {
      const dir = i < 3 ? -1 : 1;
      particles.push({
        x: x + dir * (4 + Math.random() * 6),
        y: y - 2,
        vx: dir * (0.8 + Math.random() * 1.2),
        vy: -Math.random() * 1.2,
        life: 14,
        maxLife: 14,
        color: '#8a8aaa',
        size: 2,
      });
    }
  }

  function spawnObstacle() {
    // Occasionally spawn a tall thin spike pair, otherwise a block
    if (score > 30 && Math.random() < 0.25) {
      const h1 = 28 + Math.floor(Math.random() * 20);
      const h2 = 24 + Math.floor(Math.random() * 24);
      obstacles.push({ x: W + 20, w: 14, h: h1 });
      obstacles.push({ x: W + 20 + 36, w: 14, h: h2 });
    } else {
      const h = 24 + Math.floor(Math.random() * 32);
      const w = 16 + Math.floor(Math.random() * 14);
      obstacles.push({ x: W + 20, w, h });
    }
  }

  function spawnCoin() {
    // Place coin at a height reachable by jump (single or double)
    const heights = [GROUND - 30, GROUND - 60, GROUND - 95];
    const y = heights[Math.floor(Math.random() * heights.length)];
    const count = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      coins.push({ x: W + 20 + i * 22, y, r: 6, taken: false, spin: Math.random() * Math.PI * 2 });
    }
  }

  function drawCoin(c) {
    // Soft glow
    const g = ctx.createRadialGradient(c.x, c.y, 1, c.x, c.y, c.r * 2.4);
    g.addColorStop(0, 'rgba(255,230,0,0.45)');
    g.addColorStop(1, 'rgba(255,230,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    // Spinning coin body
    const sx = Math.cos(c.spin) * c.r;
    ctx.fillStyle = C.coinBody;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, Math.max(1.5, Math.abs(sx)), c.r, 0, 0, Math.PI * 2);
    ctx.fill();
    // Dark edge & center mark
    ctx.fillStyle = C.coinDark;
    ctx.fillRect(c.x - 1, c.y - 2, 2, 4);
    // White highlight (only when coin is face-on)
    if (Math.abs(sx) > c.r * 0.5) {
      ctx.fillStyle = '#fff8b0';
      ctx.fillRect(c.x - Math.abs(sx) * 0.4, c.y - c.r * 0.5, 1, 2);
    }
  }

  function spawnFloater(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 40, maxLife: 40 });
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function drawSky(t) {
    // t is the day/night blend factor (0..1)
    const top = lerpColor(C.skyTop, C.skyTopAlt, t);
    const hor = lerpColor(C.skyHorizon, C.skyHorAlt, t);
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, top);
    g.addColorStop(1, hor);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND);
  }

  function drawMoon() {
    // Soft glow
    const g = ctx.createRadialGradient(moon.x, moon.y, moon.r * 0.4, moon.x, moon.y, moon.r * 2.2);
    g.addColorStop(0, 'rgba(244,241,212,0.35)');
    g.addColorStop(1, 'rgba(244,241,212,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.r * 2.2, 0, Math.PI * 2);
    ctx.fill();
    // Body
    ctx.fillStyle = C.moon;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
    ctx.fill();
    // Crescent shadow
    ctx.fillStyle = 'rgba(20,20,40,0.4)';
    ctx.beginPath();
    ctx.arc(moon.x - 4, moon.y - 2, moon.r * 0.95, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStars() {
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(frame * 0.04 * s.speed + s.phase);
      ctx.globalAlpha = s.base * (0.4 + 0.6 * tw);
      ctx.fillStyle = C.star;
      ctx.fillRect(s.x | 0, s.y | 0, s.size, s.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawParallax() {
    if (!bgFar || !bgMid) return;
    const fw = bgFar.width;
    const mw = bgMid.width;
    const fx = -(bgFarOffset % fw);
    const mx = -(bgMidOffset % mw);
    ctx.drawImage(bgFar, fx, 0);
    ctx.drawImage(bgFar, fx + fw, 0);
    ctx.drawImage(bgMid, mx, 0);
    ctx.drawImage(bgMid, mx + mw, 0);
  }

  function drawGround() {
    // Top strip
    ctx.fillStyle = C.groundTop;
    ctx.fillRect(0, GROUND, W, 3);

    // Body gradient
    const g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, C.ground);
    g.addColorStop(1, '#0a0820');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND + 3, W, H - GROUND - 3);

    // Tufts / pebbles on the surface (scroll with ground)
    for (let i = 0; i < 22; i++) {
      const x = ((i * 30 - groundOffset) % W + W) % W;
      ctx.fillStyle = C.grass;
      ctx.fillRect(x, GROUND - 1, 4, 1);
      if (i % 3 === 0) {
        ctx.fillStyle = '#272750';
        ctx.fillRect(x + 14, GROUND + 6, 3, 2);
      }
    }
    // Stripes lower down
    ctx.fillStyle = '#252548';
    for (let i = 0; i < 15; i++) {
      const x = ((i * 44 - groundOffset) % W + W) % W;
      ctx.fillRect(x, GROUND + 14, 28, 2);
    }
  }

  function drawObstacle(obs) {
    const x = Math.floor(obs.x);
    const py = GROUND - obs.h;
    const w = obs.w;
    const h = obs.h;

    // Crystal shape: vertical body with a triangular tip, gradient + glow seam
    ctx.save();

    // Soft glow halo
    const glow = ctx.createRadialGradient(x + w / 2, py + h * 0.4, 2, x + w / 2, py + h * 0.4, h * 0.9);
    glow.addColorStop(0, 'rgba(255,68,102,0.35)');
    glow.addColorStop(1, 'rgba(255,68,102,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x - 10, py - 6, w + 20, h + 8);

    // Body (with peaked top)
    const g = ctx.createLinearGradient(x, py, x, py + h);
    g.addColorStop(0, C.obstEdge);
    g.addColorStop(1, C.obstBase);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, py - 4);     // peak
    ctx.lineTo(x + w, py + 5);
    ctx.lineTo(x + w, py + h);
    ctx.lineTo(x, py + h);
    ctx.lineTo(x, py + 5);
    ctx.closePath();
    ctx.fill();

    // Left highlight edge
    ctx.fillStyle = '#a14ab0';
    ctx.fillRect(x + 1, py + 6, 1, h - 6);
    // Glowing crack/seam down the middle
    ctx.fillStyle = C.obstGlow;
    ctx.fillRect(x + w / 2 - 1, py + 2, 2, h - 4);
    // Bright tip
    ctx.fillStyle = '#ffd1d8';
    ctx.fillRect(x + w / 2 - 1, py - 3, 2, 3);

    ctx.restore();
  }

  function reset() {
    player.y = GROUND; player.vy = 0; player.onGround = true;
    player.jumpCount = 0; player.squish = 1;
    player.rot = 0; player.targetRot = 0;
    obstacles = []; particles = []; coins = []; floaters = [];
    score = 0; frame = 0; speed = 4;
    runCoins = 0;
    coinsEl.textContent = totalCoins;
    nextObstacle = 80;
    nextCoin = 140;
    groundOffset = 0;
    bgFarOffset = 0;
    bgMidOffset = 0;
    shake = 0;
    combo = 0; comboTimer = 0; bonusScore = 0;
    flash = 0; lastMilestone = 0;
    streaks = [];
  }

  function lerpColor(a, b, t) {
    const ai = parseInt(a.slice(1), 16), bi = parseInt(b.slice(1), 16);
    const ar = (ai >> 16) & 255, ag = (ai >> 8) & 255, ab = ai & 255;
    const br = (bi >> 16) & 255, bg = (bi >> 8) & 255, bb = bi & 255;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function update() {
    if (state === 'playing') {
      frame++;
      score = Math.floor(frame / 6) + bonusScore;
      scoreEl.textContent = score;
      speed = 4 + Math.min(6, score / 25);

      // Milestone celebration every 100 points
      if (score - lastMilestone >= 100) {
        lastMilestone = Math.floor(score / 100) * 100;
        flash = 10;
        spawnFloater(player.x + 60, GROUND - 120, lastMilestone + '!', '#6bffd1');
        sfx.mile();
      }

      // Coin combo decays if you go too long without one
      if (comboTimer > 0) comboTimer--;
      else combo = 0;

      // Wind streaks once you're moving fast
      if (speed > 6 && frame % 3 === 0) {
        streaks.push({ x: W + 10, y: 16 + Math.random() * (GROUND - 40), len: 20 + Math.random() * 30 });
      }
      for (const s of streaks) s.x -= speed * 2.2;
      streaks = streaks.filter(s => s.x + s.len > -10);

      groundOffset = (groundOffset + speed) % 44;
      bgFarOffset = (bgFarOffset + speed * 0.12) % (W * 2);
      bgMidOffset = (bgMidOffset + speed * 0.35) % (W * 2);

      nextObstacle--;
      if (nextObstacle <= 0) {
        spawnObstacle();
        const gap = Math.max(50, 100 - score / 2);
        nextObstacle = gap + Math.floor(Math.random() * 40);
      }

      nextCoin--;
      if (nextCoin <= 0) {
        spawnCoin();
        nextCoin = 90 + Math.floor(Math.random() * 120);
      }

      for (const obs of obstacles) obs.x -= speed;
      obstacles = obstacles.filter(o => o.x > -40);

      for (const c of coins) { c.x -= speed; c.spin += 0.18; }
      coins = coins.filter(c => c.x > -20 && !c.taken);

      const fb = player.getBox();

      // Coin pickup
      for (const c of coins) {
        if (c.taken) continue;
        if (c.x > fb.x - 8 && c.x < fb.x + fb.w + 8 &&
            c.y > fb.y - 8 && c.y < fb.y + fb.h + 8) {
          c.taken = true;
          runCoins++;
          totalCoins++;
          localStorage.setItem(COINS_KEY, totalCoins);
          coinsEl.textContent = totalCoins;
          // Combo: coins grabbed in quick succession are worth more
          combo = comboTimer > 0 ? combo + 1 : 1;
          comboTimer = 120;
          const bonus = 5 * combo;
          bonusScore += bonus;
          spawnFloater(c.x, c.y - 6, combo > 1 ? `+${bonus} x${combo}` : `+${bonus}`, C.star);
          sfx.coin(combo);
        }
      }

      for (const obs of obstacles) {
        const ob = { x: obs.x + 2, y: GROUND - obs.h + 2, w: obs.w - 4, h: obs.h - 2 };
        if (rectsOverlap(fb, ob)) {
          state = 'dead';
          const isBest = score > best;
          if (isBest) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem(BEST_KEY, best);
          }
          spawnDeathParticles(player.x, player.y - SPRITE_H / 2);
          shake = 14;
          sfx.death();
          if (isBest) setTimeout(() => sfx.best(), 420);
          msgEl.textContent = '';
          break;
        }
      }

      player.update();
    }

    if (shake > 0) shake *= 0.85;

    // Particles and floaters animate even when dead
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    for (const f of floaters) {
      f.y -= 0.6; f.life--;
    }
    floaters = floaters.filter(f => f.life > 0);
  }

  function render() {
    // Apply optional screen shake on death
    if (shake > 0.5) {
      const sx = (Math.random() - 0.5) * shake;
      const sy = (Math.random() - 0.5) * shake;
      ctx.setTransform(1, 0, 0, 1, sx, sy);
    } else {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // Day/night blend based on score
    const t = (Math.sin(frame / 600) + 1) / 2;

    drawSky(t);
    drawStars();
    drawMoon();
    drawParallax();
    drawGround();

    // Wind streaks behind the action
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    for (const s of streaks) {
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.len, s.y);
      ctx.stroke();
    }

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C.star;
      ctx.font = 'bold 24px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W / 2, H / 2);
    }

    for (const obs of obstacles) drawObstacle(obs);
    for (const c of coins) if (!c.taken) drawCoin(c);

    if (state !== 'dead') player.draw();

    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      const sz = p.size || 4;
      ctx.fillRect(p.x | 0, p.y | 0, sz, sz);
    }
    ctx.globalAlpha = 1;

    for (const f of floaters) {
      ctx.globalAlpha = f.life / f.maxLife;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // Milestone flash
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash / 40})`;
      ctx.fillRect(0, 0, W, H);
      flash--;
    }

    drawScreens();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // Start & game-over screens drawn on the canvas itself
  function drawScreens() {
    ctx.textAlign = 'center';
    if (state === 'idle') {
      ctx.fillStyle = 'rgba(6,6,16,0.35)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C.star;
      ctx.font = 'bold 30px Courier New';
      ctx.fillText('LEVI LEAP', W / 2, 72);
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.004);
      ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.45 * pulse})`;
      ctx.font = '12px Courier New';
      ctx.fillText('PRESS SPACE OR TAP TO START', W / 2, 98);
    } else if (state === 'dead') {
      ctx.fillStyle = 'rgba(6,6,16,0.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff6b7a';
      ctx.font = 'bold 26px Courier New';
      ctx.fillText('GAME OVER', W / 2, 74);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px Courier New';
      ctx.fillText(`SCORE ${score}`, W / 2, 104);
      ctx.fillStyle = C.star;
      ctx.font = '12px Courier New';
      const bestNote = score >= best ? '★ NEW BEST!' : `BEST ${best}`;
      ctx.fillText(`${bestNote}   ·   +${runCoins} COINS`, W / 2, 128);
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.005);
      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * pulse})`;
      ctx.fillText('SPACE / TAP TO TRY AGAIN', W / 2, 158);
    }
  }

  // Fixed timestep so the game plays at the same speed on 60/120/144Hz displays.
  const TICK_MS = 1000 / 60;
  let lastTime = 0;
  let acc = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    // Cap dt so a tabbed-out window doesn't dump hundreds of ticks at once
    if (dt > 250) dt = 250;
    acc += dt;
    let safety = 8;
    while (acc >= TICK_MS && safety-- > 0) {
      update();
      acc -= TICK_MS;
    }
    render();
  }

  function handleJump() {
    if (state === 'idle') {
      state = 'playing';
      msgEl.textContent = '';
      player.jump();
    } else if (state === 'playing') {
      player.jump();
    } else if (state === 'paused') {
      state = 'playing';
      msgEl.textContent = '';
    } else if (state === 'dead') {
      reset();
      state = 'playing';
      msgEl.textContent = '';
    }
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      msgEl.textContent = 'Paused — press P or SPACE to resume';
    } else if (state === 'paused') {
      state = 'playing';
      msgEl.textContent = '';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleJump();
    } else if (e.code === 'KeyP') {
      e.preventDefault();
      togglePause();
    }
  });
  canvas.addEventListener('click', handleJump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleJump(); }, { passive: false });

  initStars();
  buildBackgrounds();

  // Auto-pause when the tab is hidden so we don't keep ticking in the
  // background (and so the dt-cap doesn't eat the first frame back).
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
    lastTime = 0; // reset dt baseline on resume
  });

  requestAnimationFrame(loop);
</script>
</body>
</html>
