<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levi Leap - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    #gameCanvas {
      border: 3px solid #333;
      background: #111125;
      display: block;
      image-rendering: pixelated;
    }

    #ui {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 1px;
    }

    #ui span { color: #ffe600; }

    #message {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      min-height: 24px;
      text-align: center;
    }

    .back-link {
      margin-top: 28px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }
  </style>
</head>
<body>

  <h1>&#129354; Levi Leap</h1>
  <p class="subtitle">SPACE / TAP to jump &middot; double-jump &middot; P to pause</p>

  <canvas id="gameCanvas" width="600" height="220"></canvas>

  <div id="ui">
    <div>SCORE: <span id="score">0</span></div>
    <div>COINS: <span id="coins">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>

  <div id="message">Press SPACE or tap to start</div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const coinsEl = document.getElementById('coins');
  const msgEl = document.getElementById('message');

  const BEST_KEY = 'leviLeap.best';
  const COINS_KEY = 'leviLeap.totalCoins';

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = H - 40;

  const C = {
    sky:      '#111125',
    ground:   '#2a2a4a',
    groundTop:'#4a4a8a',
    obstacle: '#ff4444',
    obstDark: '#8a0000',
    star:     '#ffe600',
  };

  // Load Levi sprite
  const leviImg = new Image();
  leviImg.src = 'levi.png';
  let imgLoaded = false;
  leviImg.onload = () => { imgLoaded = true; };

  let state = 'idle';
  let score = 0;
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  let totalCoins = parseInt(localStorage.getItem(COINS_KEY) || '0', 10);
  let runCoins = 0;
  let frame = 0;
  let speed = 4;
  let stars = [];
  let obstacles = [];
  let coins = [];
  let particles = [];
  let floaters = [];
  let nextObstacle = 80;
  let nextCoin = 140;
  let groundOffset = 0;
  bestEl.textContent = best;
  coinsEl.textContent = totalCoins;

  // ---- PLAYER (Levi) ----
  const SPRITE_W = 50;
  const SPRITE_H = 100;

  const player = {
    x: 90, y: GROUND, vy: 0, onGround: true, jumpCount: 0,
    squish: 1, rot: 0, targetRot: 0,
    draw() {
      const px = Math.floor(this.x);
      const py = Math.floor(this.y);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      const shadowScale = this.onGround ? 1 : Math.max(0.3, 1 - (GROUND - py) / 200);
      ctx.beginPath();
      ctx.ellipse(px, GROUND + 2, 22 * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(px, py - SPRITE_H / 2 * this.squish);
      ctx.rotate(this.rot);
      // Slight tilt during jump
      const sw = SPRITE_W;
      const sh = SPRITE_H * this.squish;
      if (imgLoaded) {
        ctx.drawImage(leviImg, -sw / 2, -sh / 2, sw, sh);
      } else {
        // fallback while image loads
        ctx.fillStyle = '#fff';
        ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
      }
      ctx.restore();
    },
    jump() {
      if (this.jumpCount < 2) {
        this.vy = -11;
        this.onGround = false;
        this.jumpCount++;
        this.squish = 0.85;
        this.targetRot = this.jumpCount === 2 ? -Math.PI * 2 : -0.3;
        spawnJumpParticles(this.x, this.y);
      }
    },
    update() {
      this.vy += 0.55;
      this.y += this.vy;
      if (this.y >= GROUND) {
        this.y = GROUND;
        this.vy = 0;
        if (!this.onGround) this.squish = 1.15;
        this.onGround = true;
        this.jumpCount = 0;
        this.targetRot = 0;
        this.rot = 0;
      }
      this.squish += (1 - this.squish) * 0.2;
      // Animate flip rotation
      this.rot += (this.targetRot - this.rot) * 0.15;
    },
    getBox() {
      return { x: this.x - 18, y: this.y - SPRITE_H + 8, w: 36, h: SPRITE_H - 8 };
    }
  };

  // ---- PARTICLES ----
  function spawnJumpParticles(x, y) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y - 4,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 2,
        life: 18,
        maxLife: 18,
        color: '#aaa'
      });
    }
  }

  function spawnDeathParticles(x, y) {
    for (let i = 0; i < 18; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 8,
        vy: -Math.random() * 7 - 2,
        life: 40,
        maxLife: 40,
        color: i % 2 === 0 ? '#ffe600' : C.obstacle
      });
    }
  }

  function initStars() {
    for (let i = 0; i < 50; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * (GROUND - 20) });
    }
  }

  function spawnObstacle() {
    // Occasionally spawn a tall thin spike pair, otherwise a block
    if (score > 30 && Math.random() < 0.25) {
      const h1 = 28 + Math.floor(Math.random() * 20);
      const h2 = 24 + Math.floor(Math.random() * 24);
      obstacles.push({ x: W + 20, w: 14, h: h1 });
      obstacles.push({ x: W + 20 + 36, w: 14, h: h2 });
    } else {
      const h = 24 + Math.floor(Math.random() * 32);
      const w = 16 + Math.floor(Math.random() * 14);
      obstacles.push({ x: W + 20, w, h });
    }
  }

  function spawnCoin() {
    // Place coin at a height reachable by jump (single or double)
    const heights = [GROUND - 30, GROUND - 60, GROUND - 95];
    const y = heights[Math.floor(Math.random() * heights.length)];
    const count = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      coins.push({ x: W + 20 + i * 22, y, r: 6, taken: false, spin: Math.random() * Math.PI * 2 });
    }
  }

  function drawCoin(c) {
    const sx = Math.cos(c.spin) * c.r;
    ctx.fillStyle = C.star;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, Math.max(1.5, Math.abs(sx)), c.r, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#b8a800';
    ctx.fillRect(c.x - 1, c.y - 2, 2, 4);
  }

  function spawnFloater(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 40, maxLife: 40 });
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function drawGround() {
    ctx.fillStyle = C.groundTop;
    ctx.fillRect(0, GROUND, W, 4);
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, GROUND + 4, W, H - GROUND - 4);

    ctx.fillStyle = '#3a3a6a';
    for (let i = 0; i < 15; i++) {
      const x = ((i * 44 - groundOffset) % W + W) % W;
      ctx.fillRect(x, GROUND + 10, 28, 3);
    }
  }

  function drawObstacle(obs) {
    const py = GROUND - obs.h;
    ctx.fillStyle = C.obstacle;
    ctx.fillRect(Math.floor(obs.x), py, obs.w, obs.h);
    ctx.fillStyle = C.obstDark;
    ctx.fillRect(Math.floor(obs.x), py, obs.w, 5);
    ctx.fillRect(Math.floor(obs.x) + obs.w - 4, py, 4, obs.h);
  }

  function reset() {
    player.y = GROUND; player.vy = 0; player.onGround = true;
    player.jumpCount = 0; player.squish = 1;
    player.rot = 0; player.targetRot = 0;
    obstacles = []; particles = []; coins = []; floaters = [];
    score = 0; frame = 0; speed = 4;
    runCoins = 0;
    coinsEl.textContent = totalCoins;
    nextObstacle = 80;
    nextCoin = 140;
    groundOffset = 0;
  }

  function lerpColor(a, b, t) {
    const ai = parseInt(a.slice(1), 16), bi = parseInt(b.slice(1), 16);
    const ar = (ai >> 16) & 255, ag = (ai >> 8) & 255, ab = ai & 255;
    const br = (bi >> 16) & 255, bg = (bi >> 8) & 255, bb = bi & 255;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
  }

  function update() {
    if (state === 'playing') {
      frame++;
      score = Math.floor(frame / 6);
      scoreEl.textContent = score;
      speed = 4 + Math.min(6, score / 25);

      groundOffset = (groundOffset + speed) % 44;

      nextObstacle--;
      if (nextObstacle <= 0) {
        spawnObstacle();
        const gap = Math.max(50, 100 - score / 2);
        nextObstacle = gap + Math.floor(Math.random() * 40);
      }

      nextCoin--;
      if (nextCoin <= 0) {
        spawnCoin();
        nextCoin = 90 + Math.floor(Math.random() * 120);
      }

      for (const obs of obstacles) obs.x -= speed;
      obstacles = obstacles.filter(o => o.x > -40);

      for (const c of coins) { c.x -= speed; c.spin += 0.18; }
      coins = coins.filter(c => c.x > -20 && !c.taken);

      const fb = player.getBox();

      // Coin pickup
      for (const c of coins) {
        if (c.taken) continue;
        if (c.x > fb.x - 8 && c.x < fb.x + fb.w + 8 &&
            c.y > fb.y - 8 && c.y < fb.y + fb.h + 8) {
          c.taken = true;
          runCoins++;
          totalCoins++;
          localStorage.setItem(COINS_KEY, totalCoins);
          coinsEl.textContent = totalCoins;
          spawnFloater(c.x, c.y - 6, '+1', C.star);
        }
      }

      for (const obs of obstacles) {
        const ob = { x: obs.x + 2, y: GROUND - obs.h + 2, w: obs.w - 4, h: obs.h - 2 };
        if (rectsOverlap(fb, ob)) {
          state = 'dead';
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem(BEST_KEY, best);
            spawnFloater(player.x, player.y - SPRITE_H, 'NEW BEST!', C.star);
          }
          spawnDeathParticles(player.x, player.y - SPRITE_H / 2);
          msgEl.textContent = `GAME OVER! Score ${score} (+${runCoins} coins) — SPACE to retry`;
          break;
        }
      }

      player.update();
    }

    // Particles and floaters animate even when dead
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    for (const f of floaters) {
      f.y -= 0.6; f.life--;
    }
    floaters = floaters.filter(f => f.life > 0);
  }

  function render() {
    // Day/night cycle based on score
    const t = (Math.sin(frame / 600) + 1) / 2;
    const sky = lerpColor('#111125', '#3a2a55', t);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = C.star;
    for (const s of stars) {
      if (Math.random() < 0.002) continue;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), 2, 2);
    }

    drawGround();

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = C.star;
      ctx.font = 'bold 24px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W / 2, H / 2);
    }

    for (const obs of obstacles) drawObstacle(obs);
    for (const c of coins) if (!c.taken) drawCoin(c);

    if (state !== 'dead') player.draw();

    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 4, 4);
    }
    ctx.globalAlpha = 1;

    for (const f of floaters) {
      ctx.globalAlpha = f.life / f.maxLife;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // Fixed timestep so the game plays at the same speed on 60/120/144Hz displays.
  const TICK_MS = 1000 / 60;
  let lastTime = 0;
  let acc = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    // Cap dt so a tabbed-out window doesn't dump hundreds of ticks at once
    if (dt > 250) dt = 250;
    acc += dt;
    let safety = 8;
    while (acc >= TICK_MS && safety-- > 0) {
      update();
      acc -= TICK_MS;
    }
    render();
  }

  function handleJump() {
    if (state === 'idle') {
      state = 'playing';
      msgEl.textContent = '';
      player.jump();
    } else if (state === 'playing') {
      player.jump();
    } else if (state === 'paused') {
      state = 'playing';
      msgEl.textContent = '';
    } else if (state === 'dead') {
      reset();
      state = 'playing';
      msgEl.textContent = '';
    }
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      msgEl.textContent = 'Paused — press P or SPACE to resume';
    } else if (state === 'paused') {
      state = 'playing';
      msgEl.textContent = '';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleJump();
    } else if (e.code === 'KeyP') {
      e.preventDefault();
      togglePause();
    }
  });
  canvas.addEventListener('click', handleJump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleJump(); }, { passive: false });

  initStars();
  requestAnimationFrame(loop);
</script>
</body>
</html>
