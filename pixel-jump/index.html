<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levi Leap - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    #gameCanvas {
      border: 3px solid #333;
      background: #111125;
      display: block;
      image-rendering: pixelated;
    }

    #ui {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 1px;
    }

    #ui span { color: #ffe600; }

    #message {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      min-height: 24px;
      text-align: center;
    }

    .back-link {
      margin-top: 28px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }
  </style>
</head>
<body>

  <h1>&#129354; Levi Leap</h1>
  <p class="subtitle">Press SPACE or tap to jump</p>

  <canvas id="gameCanvas" width="600" height="220"></canvas>

  <div id="ui">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>

  <div id="message">Press SPACE or tap to start</div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('message');

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = H - 40;

  const C = {
    sky:      '#111125',
    ground:   '#2a2a4a',
    groundTop:'#4a4a8a',
    obstacle: '#ff4444',
    obstDark: '#8a0000',
    star:     '#ffe600',
  };

  // Load Levi sprite
  const leviImg = new Image();
  leviImg.src = 'levi.png';
  let imgLoaded = false;
  leviImg.onload = () => { imgLoaded = true; };

  let state = 'idle';
  let score = 0;
  let best = 0;
  let frame = 0;
  let speed = 4;
  let stars = [];
  let obstacles = [];
  let particles = [];
  let nextObstacle = 80;
  let groundOffset = 0;

  // ---- PLAYER (Levi) ----
  const SPRITE_W = 50;
  const SPRITE_H = 100;

  const player = {
    x: 90, y: GROUND, vy: 0, onGround: true, jumpCount: 0,
    squish: 1, rot: 0, targetRot: 0,
    draw() {
      const px = Math.floor(this.x);
      const py = Math.floor(this.y);

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      const shadowScale = this.onGround ? 1 : Math.max(0.3, 1 - (GROUND - py) / 200);
      ctx.beginPath();
      ctx.ellipse(px, GROUND + 2, 22 * shadowScale, 4 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(px, py - SPRITE_H / 2 * this.squish);
      ctx.rotate(this.rot);
      // Slight tilt during jump
      const sw = SPRITE_W;
      const sh = SPRITE_H * this.squish;
      if (imgLoaded) {
        ctx.drawImage(leviImg, -sw / 2, -sh / 2, sw, sh);
      } else {
        // fallback while image loads
        ctx.fillStyle = '#fff';
        ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
      }
      ctx.restore();
    },
    jump() {
      if (this.jumpCount < 2) {
        this.vy = -11;
        this.onGround = false;
        this.jumpCount++;
        this.squish = 0.85;
        this.targetRot = this.jumpCount === 2 ? -Math.PI * 2 : -0.3;
        spawnJumpParticles(this.x, this.y);
      }
    },
    update() {
      this.vy += 0.55;
      this.y += this.vy;
      if (this.y >= GROUND) {
        this.y = GROUND;
        this.vy = 0;
        if (!this.onGround) this.squish = 1.15;
        this.onGround = true;
        this.jumpCount = 0;
        this.targetRot = 0;
        this.rot = 0;
      }
      this.squish += (1 - this.squish) * 0.2;
      // Animate flip rotation
      this.rot += (this.targetRot - this.rot) * 0.15;
    },
    getBox() {
      return { x: this.x - 18, y: this.y - SPRITE_H + 8, w: 36, h: SPRITE_H - 8 };
    }
  };

  // ---- PARTICLES ----
  function spawnJumpParticles(x, y) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y - 4,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 2,
        life: 18,
        maxLife: 18,
        color: '#aaa'
      });
    }
  }

  function spawnDeathParticles(x, y) {
    for (let i = 0; i < 18; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 8,
        vy: -Math.random() * 7 - 2,
        life: 40,
        maxLife: 40,
        color: i % 2 === 0 ? '#ffe600' : C.obstacle
      });
    }
  }

  function initStars() {
    for (let i = 0; i < 50; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * (GROUND - 20) });
    }
  }

  function spawnObstacle() {
    const h = 24 + Math.floor(Math.random() * 28);
    const w = 16 + Math.floor(Math.random() * 12);
    obstacles.push({ x: W + 20, w, h });
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function drawGround() {
    ctx.fillStyle = C.groundTop;
    ctx.fillRect(0, GROUND, W, 4);
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, GROUND + 4, W, H - GROUND - 4);

    ctx.fillStyle = '#3a3a6a';
    for (let i = 0; i < 15; i++) {
      const x = ((i * 44 - groundOffset) % W + W) % W;
      ctx.fillRect(x, GROUND + 10, 28, 3);
    }
  }

  function drawObstacle(obs) {
    const py = GROUND - obs.h;
    ctx.fillStyle = C.obstacle;
    ctx.fillRect(Math.floor(obs.x), py, obs.w, obs.h);
    ctx.fillStyle = C.obstDark;
    ctx.fillRect(Math.floor(obs.x), py, obs.w, 5);
    ctx.fillRect(Math.floor(obs.x) + obs.w - 4, py, 4, obs.h);
  }

  function reset() {
    player.y = GROUND; player.vy = 0; player.onGround = true;
    player.jumpCount = 0; player.squish = 1;
    player.rot = 0; player.targetRot = 0;
    obstacles = []; particles = [];
    score = 0; frame = 0; speed = 4;
    nextObstacle = 80;
    groundOffset = 0;
  }

  function loop() {
    requestAnimationFrame(loop);
    ctx.fillStyle = C.sky;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = C.star;
    for (const s of stars) {
      if (Math.random() < 0.002) continue;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), 2, 2);
    }

    drawGround();

    if (state === 'playing') {
      frame++;
      score = Math.floor(frame / 6);
      scoreEl.textContent = score;
      speed = 4 + Math.floor(score / 10) * 0.5;

      groundOffset = (groundOffset + speed) % 44;

      nextObstacle--;
      if (nextObstacle <= 0) {
        spawnObstacle();
        const gap = Math.max(45, 90 - score);
        nextObstacle = gap + Math.floor(Math.random() * 30);
      }

      for (const obs of obstacles) obs.x -= speed;
      obstacles = obstacles.filter(o => o.x > -40);

      const fb = player.getBox();
      for (const obs of obstacles) {
        const ob = { x: obs.x + 2, y: GROUND - obs.h + 2, w: obs.w - 4, h: obs.h - 2 };
        if (rectsOverlap(fb, ob)) {
          state = 'dead';
          if (score > best) { best = score; bestEl.textContent = best; }
          spawnDeathParticles(player.x, player.y - SPRITE_H / 2);
          msgEl.textContent = 'GAME OVER! Press SPACE to try again';
          break;
        }
      }

      player.update();
    }

    for (const obs of obstacles) drawObstacle(obs);

    if (state !== 'dead') player.draw();

    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 4, 4);
    }
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
  }

  function handleJump() {
    if (state === 'idle') {
      state = 'playing';
      msgEl.textContent = '';
      player.jump();
    } else if (state === 'playing') {
      player.jump();
    } else if (state === 'dead') {
      reset();
      state = 'playing';
      msgEl.textContent = '';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleJump();
    }
  });
  canvas.addEventListener('click', handleJump);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleJump(); }, { passive: false });

  initStars();
  loop();
</script>
</body>
</html>
