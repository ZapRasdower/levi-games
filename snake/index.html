<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levi Snake - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(900px 500px at 50% -80px, #191932, #0f0f1a 70%);
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(255,230,0,0.35);
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 24px;
      text-align: center;
    }

    #gameCanvas {
      border: 3px solid #333;
      border-radius: 10px;
      background: #111125;
      display: block;
      touch-action: none;
      max-width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }

    #ui {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 480px;
      margin-top: 14px;
      font-size: 0.78rem;
      color: #99a;
      letter-spacing: 1px;
    }

    #ui .pill {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      padding: 6px 14px;
    }

    #ui span { color: #ffe600; font-size: 0.95rem; margin-left: 5px; }

    #muteBtn {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      color: #ffe600;
      font-size: 0.9rem;
      padding: 5px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.12s;
    }

    #muteBtn:hover { border-color: #ffe600; }

    #message {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      min-height: 24px;
      text-align: center;
    }

    .back-link {
      margin-top: 24px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }
  </style>
</head>
<body>

  <h1>&#128013; Levi Snake</h1>
  <p class="subtitle">Arrow keys / WASD / swipe &middot; P to pause</p>

  <canvas id="gameCanvas" width="480" height="480"></canvas>

  <div id="ui">
    <div class="pill">SCORE<span id="score">0</span></div>
    <div class="pill">LEN<span id="len">3</span></div>
    <div class="pill">BEST<span id="best">0</span></div>
    <button id="muteBtn" title="toggle sound">&#128266;</button>
  </div>

  <div id="message">Press an arrow key to start</div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const lenEl = document.getElementById('len');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('message');

  const BEST_KEY = 'leviSnake.best';
  const MUTE_KEY = 'leviSnake.muted';

  // ---- SOUND (tiny WebAudio synth — no audio files) ----
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  let audio = null;
  function ac() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  function beep(freq, dur, type = 'sine', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      const a = ac();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination);
      o.start();
      o.stop(a.currentTime + dur);
    } catch (e) { /* audio blocked — stay silent */ }
  }
  const sfx = {
    eat(len)  { beep(520 + Math.min(20, len) * 18, 0.1, 'square', 0.06); },
    bonus()   { beep(780, 0.09); setTimeout(() => beep(1170, 0.14), 80); },
    die()     { beep(280, 0.45, 'sawtooth', 0.08, -220); },
    best()    { beep(660, 0.1, 'square', 0.06); setTimeout(() => beep(880, 0.12, 'square', 0.06), 90); setTimeout(() => beep(1108, 0.18, 'square', 0.06), 200); },
  };

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    refreshMute();
    muteBtn.blur(); // so SPACE restarts the game instead of re-toggling
  });
  refreshMute();

  const CELL = 24;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;

  const C = {
    bgTop:    '#12122a',
    bgBot:    '#0a0a18',
    checkerA: '#15152b',
    checkerB: '#101023',
    bodyHead: '#9bff5a',
    bodyTail: '#2f8a3a',
    bodyGloss:'#e6ffd0',
    food:     '#ff5a5a',
    foodDark: '#b02828',
    leaf:     '#5ac85a',
    bonus:    '#6bffd1',
    text:     '#aaa',
  };

  let snake, prevSnake, dir, nextDir, food, bonus, bonusTimer;
  let particles = [];
  let score = 0;
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  let state = 'idle';
  let tickMs = 120;
  let lastTick = 0;
  let pulse = 0;
  bestEl.textContent = best;

  const lerp = (a, b, t) => a + (b - a) * t;
  function lerpColor(a, b, t) {
    const ai = parseInt(a.slice(1), 16), bi = parseInt(b.slice(1), 16);
    const ar = (ai >> 16) & 255, ag = (ai >> 8) & 255, ab = ai & 255;
    const br = (bi >> 16) & 255, bg = (bi >> 8) & 255, bb = bi & 255;
    return `rgb(${Math.round(lerp(ar, br, t))},${Math.round(lerp(ag, bg, t))},${Math.round(lerp(ab, bb, t))})`;
  }

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    prevSnake = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 120;
    bonus = null;
    bonusTimer = 0;
    particles = [];
    placeFood();
    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function maybePlaceBonus() {
    if (bonus || Math.random() > 0.18) return;
    let tries = 30;
    while (tries-- > 0) {
      const b = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === b.x && s.y === b.y) &&
          (b.x !== food.x || b.y !== food.y)) {
        bonus = b;
        bonusTimer = 60; // ticks until disappears
        return;
      }
    }
  }

  function tick() {
    // Apply queued direction (only if not a 180)
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
      dir = nextDir;
    }

    // Snapshot positions for smooth interpolation between ticks
    prevSnake = snake.map(s => ({ ...s }));

    const head = snake[0];
    const nh = { x: head.x + dir.x, y: head.y + dir.y };

    // Wall collision
    if (nh.x < 0 || nh.x >= COLS || nh.y < 0 || nh.y >= ROWS) {
      die();
      return;
    }
    // Self collision (ignore tail tip since it'll move — but only when not eating)
    const willEat = nh.x === food.x && nh.y === food.y;
    const body = willEat ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === nh.x && s.y === nh.y)) {
      die();
      return;
    }

    snake.unshift(nh);

    if (willEat) {
      score += 10;
      burst(food.x, food.y, C.food, 12);
      sfx.eat(snake.length);
      placeFood();
      maybePlaceBonus();
      tickMs = Math.max(55, tickMs - 2);
    } else if (bonus && nh.x === bonus.x && nh.y === bonus.y) {
      score += 50;
      burst(bonus.x, bonus.y, C.bonus, 20);
      sfx.bonus();
      bonus = null;
      bonusTimer = 0;
      snake.pop(); // bonus doesn't grow
    } else {
      snake.pop();
    }

    if (bonus) {
      bonusTimer--;
      if (bonusTimer <= 0) bonus = null;
    }

    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
  }

  function die() {
    state = 'dead';
    sfx.die();
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, best);
      msgEl.textContent = `NEW BEST: ${score}! Press SPACE to play again`;
      setTimeout(() => sfx.best(), 480);
    } else {
      msgEl.textContent = `Game over — score ${score}. SPACE to play again`;
    }
  }

  const cc = (n) => n * CELL + CELL / 2; // cell index -> pixel center

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function burst(cx, cy, color, n) {
    const px = cc(cx), py = cc(cy);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x: px, y: py,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 20 + Math.random() * 12, maxLife: 32, color,
      });
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, C.bgTop);
    g.addColorStop(1, C.bgBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? C.checkerA : C.checkerB;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    // Vignette
    const v = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, canvas.height * 0.3,
      canvas.width / 2, canvas.height / 2, canvas.height * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawFood() {
    const px = cc(food.x), py = cc(food.y);
    const pulseScale = 1 + Math.sin(pulse * 0.12) * 0.08;
    const r = (CELL / 2 - 3) * pulseScale;

    ctx.save();
    ctx.shadowColor = C.food;
    ctx.shadowBlur = 14;
    // Apple body
    ctx.fillStyle = C.food;
    ctx.beginPath();
    ctx.arc(px, py + 1, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Shading
    ctx.fillStyle = C.foodDark;
    ctx.beginPath();
    ctx.arc(px + r * 0.25, py + r * 0.3, r * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(px - r * 0.35, py - r * 0.35, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    // Leaf
    ctx.fillStyle = C.leaf;
    ctx.beginPath();
    ctx.ellipse(px + 3, py - r - 1, 4, 2.2, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBonus() {
    if (!bonus) return;
    const px = cc(bonus.x), py = cc(bonus.y);
    const fade = bonusTimer < 20 ? (bonusTimer % 6 < 3 ? 1 : 0.35) : 1;
    const r = CELL / 2 - 3 + Math.sin(pulse * 0.2) * 1.5;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.shadowColor = C.bonus;
    ctx.shadowBlur = 16;
    // Gem (diamond)
    ctx.fillStyle = C.bonus;
    ctx.beginPath();
    ctx.moveTo(px, py - r);
    ctx.lineTo(px + r, py);
    ctx.lineTo(px, py + r);
    ctx.lineTo(px - r, py);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Facets
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px - r, py); ctx.lineTo(px + r, py);
    ctx.moveTo(px, py - r); ctx.lineTo(px, py + r);
    ctx.stroke();
    ctx.restore();
  }

  // Interpolated pixel positions for the snake between ticks.
  function snakePoints(interp) {
    const pts = [];
    for (let i = 0; i < snake.length; i++) {
      const cur = snake[i];
      const prev = prevSnake[i] || cur;
      pts.push({
        x: cc(lerp(prev.x, cur.x, interp)),
        y: cc(lerp(prev.y, cur.y, interp)),
      });
    }
    return pts;
  }

  function drawSnake(interp) {
    const pts = snakePoints(interp);
    if (pts.length === 0) return;

    // Body as a thick rounded stroke
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Outer glow
    ctx.save();
    ctx.shadowColor = C.bodyHead;
    ctx.shadowBlur = 8;
    ctx.strokeStyle = C.bodyTail;
    ctx.lineWidth = CELL - 6;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
    ctx.restore();

    // Gradient body head->tail (approx along head-to-tail axis)
    const tail = pts[pts.length - 1];
    const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, tail.x, tail.y);
    grad.addColorStop(0, C.bodyHead);
    grad.addColorStop(1, C.bodyTail);
    ctx.strokeStyle = grad;
    ctx.lineWidth = CELL - 8;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // Glossy spine highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = (CELL - 8) * 0.4;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    // Head
    const h = pts[0];
    const hr = CELL / 2 - 2;
    ctx.fillStyle = C.bodyHead;
    roundRect(h.x - hr, h.y - hr, hr * 2, hr * 2, 7);
    ctx.fill();

    // Eyes (face travel direction)
    const ex = dir.x, ey = dir.y;
    const perp = { x: -ey, y: ex };
    const eyeFwd = hr * 0.35, eyeSide = hr * 0.45, eyeR = 2.6;
    for (const s of [1, -1]) {
      const exx = h.x + ex * eyeFwd + perp.x * eyeSide * s;
      const eyy = h.y + ey * eyeFwd + perp.y * eyeSide * s;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(exx, eyy, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0a0a18';
      ctx.beginPath(); ctx.arc(exx + ex * 1.1, eyy + ey * 1.1, 1.3, 0, Math.PI * 2); ctx.fill();
    }

    // Flicking tongue
    if (state === 'playing' && Math.sin(pulse * 0.3) > 0.4) {
      const tx = h.x + ex * hr, ty = h.y + ey * hr;
      ctx.strokeStyle = '#ff4d6d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + ex * 6, ty + ey * 6);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function updateParticles() {
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life--;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function draw(now) {
    let interp = 1;
    if (state === 'playing') interp = Math.min(1, (now - lastTick) / tickMs);

    drawBackground();
    drawFood();
    drawBonus();
    drawSnake(interp);
    drawParticles();

    if (state === 'idle') {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = C.bodyHead;
      ctx.font = 'bold 28px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    }
  }

  function loop(now) {
    requestAnimationFrame(loop);
    pulse++;
    if (state === 'playing' && now - lastTick >= tickMs) {
      lastTick = now;
      tick();
    }
    updateParticles();
    draw(now);
  }

  function setDir(x, y) {
    if (state === 'idle') {
      state = 'playing';
      msgEl.textContent = '';
      lastTick = performance.now();
    }
    if (state !== 'playing') return;
    // Prevent reversing on the same tick
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  document.addEventListener('keydown', e => {
    switch (e.code) {
      case 'ArrowUp': case 'KeyW': e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown': case 'KeyS': e.preventDefault(); setDir(0, 1); break;
      case 'ArrowLeft': case 'KeyA': e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': case 'KeyD': e.preventDefault(); setDir(1, 0); break;
      case 'KeyP':
        e.preventDefault();
        if (state === 'playing') { state = 'paused'; msgEl.textContent = 'Paused — P to resume'; }
        else if (state === 'paused') { state = 'playing'; msgEl.textContent = ''; lastTick = performance.now(); }
        break;
      case 'Space':
        e.preventDefault();
        if (state === 'dead') {
          reset();
          state = 'idle';
          msgEl.textContent = 'Press an arrow key to start';
        }
        break;
    }
  });

  // Touch swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state === 'dead') {
      reset();
      state = 'idle';
      msgEl.textContent = 'Swipe to start';
      return;
    }
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  canvas.addEventListener('touchend', () => { touchStart = null; });

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
