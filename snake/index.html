<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levi Snake - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(900px 500px at 50% -80px, #191932, #0f0f1a 70%);
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(255,230,0,0.35);
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 24px;
      text-align: center;
    }

    #gameCanvas {
      border: 3px solid #333;
      border-radius: 10px;
      background: #111125;
      display: block;
      touch-action: none;
      max-width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }

    #ui {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 480px;
      margin-top: 14px;
      font-size: 0.78rem;
      color: #99a;
      letter-spacing: 1px;
    }

    #ui .pill {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      padding: 6px 14px;
    }

    #ui span { color: #ffe600; font-size: 0.95rem; margin-left: 5px; }

    #muteBtn {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      color: #ffe600;
      font-size: 0.9rem;
      padding: 5px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.12s;
    }

    #muteBtn:hover { border-color: #ffe600; }

    #opts { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: 480px; }
    .optrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .optlabel { font-size: 0.65rem; letter-spacing: 2px; color: #777; }
    .optbtn { font-family: inherit; font-size: 0.68rem; letter-spacing: 1px; font-weight: bold; padding: 5px 9px; margin: 0 2px; background: #1a1a30; color: #bbb; border: 2px solid #33334d; border-radius: 3px; cursor: pointer; }
    .optbtn.on { border-color: #9bff5a; color: #9bff5a; }
    .optbtn.locked { opacity: 0.45; cursor: default; }
    .optbtn i { font-style: normal; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    #message {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #888;
      letter-spacing: 2px;
      min-height: 24px;
      text-align: center;
    }

    .back-link {
      margin-top: 24px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }
  </style>
</head>
<body>

  <h1>&#128013; Levi Snake</h1>
  <p class="subtitle">Arrow keys / WASD / swipe &middot; P to pause &middot; eat fast for combos</p>

  <canvas id="gameCanvas" width="480" height="480"></canvas>

  <div id="ui">
    <div class="pill">SCORE<span id="score">0</span></div>
    <div class="pill">LEN<span id="len">3</span></div>
    <div class="pill">BEST<span id="best">0</span></div>
    <button id="muteBtn" title="toggle sound">&#128266;</button>
  </div>

  <div id="opts">
    <div class="optrow"><span class="optlabel">MODE</span><span id="modes"></span></div>
    <div class="optrow"><span class="optlabel">SKIN</span><span id="skins"></span></div>
  </div>

  <div id="message">Press an arrow key to start</div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const lenEl = document.getElementById('len');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('message');

  const BEST_KEY = 'leviSnake.best';
  const MUTE_KEY = 'leviSnake.muted';

  // ---- SOUND (tiny WebAudio synth — no audio files) ----
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  let audio = null;
  function ac() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  function beep(freq, dur, type = 'sine', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      const a = ac();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination);
      o.start();
      o.stop(a.currentTime + dur);
    } catch (e) { /* audio blocked — stay silent */ }
  }
  const sfx = {
    eat(len)  { beep(520 + Math.min(20, len) * 18, 0.1, 'square', 0.06); },
    bonus()   { beep(780, 0.09); setTimeout(() => beep(1170, 0.14), 80); },
    die()     { beep(280, 0.45, 'sawtooth', 0.08, -220); },
    best()    { beep(660, 0.1, 'square', 0.06); setTimeout(() => beep(880, 0.12, 'square', 0.06), 90); setTimeout(() => beep(1108, 0.18, 'square', 0.06), 200); },
  };

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    refreshMute();
    muteBtn.blur(); // so SPACE restarts the game instead of re-toggling
  });
  refreshMute();

  // ---- MODES & SKINS ----
  const MODE_KEY = 'leviSnake.mode', SKIN_KEY = 'leviSnake.skin';
  const MODES = [
    { id: 'classic', name: 'CLASSIC', tip: 'Walls are deadly' },
    { id: 'portal',  name: 'PORTAL',  tip: 'Walls wrap around to the other side' },
    { id: 'maze',    name: 'MAZE',    tip: 'A rock appears every 3 apples' },
  ];
  const SKINS = [
    { id: 'green',   name: 'GARDEN',  need: 0,    head: '#9bff5a', tail: '#2f8a3a' },
    { id: 'ocean',   name: 'OCEAN',   need: 100,  head: '#6be0ff', tail: '#2a4fb0' },
    { id: 'lava',    name: 'LAVA',    need: 250,  head: '#ffd24a', tail: '#d2301c' },
    { id: 'candy',   name: 'CANDY',   need: 500,  head: '#ff9ae0', tail: '#8a4ad8' },
    { id: 'rainbow', name: 'RAINBOW', need: 800,  head: '#ff5a5a', tail: '#5a8aff', rainbow: true },
    { id: 'gold',    name: 'GOLD',    need: 1200, head: '#fff3a0', tail: '#c98a14' },
  ];
  let mode = localStorage.getItem(MODE_KEY) || 'classic';
  if (!MODES.some(m => m.id === mode)) mode = 'classic';
  let skinId = localStorage.getItem(SKIN_KEY) || 'green';
  const modeBestKey = () => BEST_KEY + '.' + mode;

  const CELL = 24;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;

  const C = {
    bgTop:    '#12122a',
    bgBot:    '#0a0a18',
    checkerA: '#15152b',
    checkerB: '#101023',
    bodyHead: '#9bff5a',
    bodyTail: '#2f8a3a',
    bodyGloss:'#e6ffd0',
    food:     '#ff5a5a',
    foodDark: '#b02828',
    leaf:     '#5ac85a',
    bonus:    '#6bffd1',
    text:     '#aaa',
  };

  let snake, prevSnake, dir, nextDir, food, bonus, bonusTimer;
  let walls = [], power = null, fx = { ice: 0, ghost: 0 }, combo = 0, comboTicks = 0, apples = 0, floats = [], shake = 0;
  const POWERS = { ice: { e: '\u2744\uFE0F', c: '#9ad8ff', name: 'SLOW-MO' }, ghost: { e: '\uD83D\uDC7B', c: '#d8c8ff', name: 'GHOST' }, cut: { e: '\u2702\uFE0F', c: '#ffb38a', name: 'SNIP!' } };
  let particles = [];
  let score = 0;
  let allBest = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  let best = parseInt(localStorage.getItem(modeBestKey()) || (mode === 'classic' ? allBest : 0), 10) || 0;
  let state = 'idle';
  let tickMs = 120;
  let lastTick = 0;
  let pulse = 0;
  bestEl.textContent = best;

  const lerp = (a, b, t) => a + (b - a) * t;
  function lerpColor(a, b, t) {
    const ai = parseInt(a.slice(1), 16), bi = parseInt(b.slice(1), 16);
    const ar = (ai >> 16) & 255, ag = (ai >> 8) & 255, ab = ai & 255;
    const br = (bi >> 16) & 255, bg = (bi >> 8) & 255, bb = bi & 255;
    return `rgb(${Math.round(lerp(ar, br, t))},${Math.round(lerp(ag, bg, t))},${Math.round(lerp(ab, bb, t))})`;
  }

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    prevSnake = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 120;
    bonus = null;
    bonusTimer = 0;
    particles = [];
    walls = []; power = null; fx = { ice: 0, ghost: 0 }; combo = 0; comboTicks = 0; apples = 0; floats = [];
    placeFood();
    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (isFree(f.x, f.y)) {
        food = f;
        return;
      }
    }
  }
  function isFree(x, y) {
    return !snake.some(s => s.x === x && s.y === y) && !walls.some(w => w.x === x && w.y === y) &&
      !(food && food.x === x && food.y === y) && !(bonus && bonus.x === x && bonus.y === y) && !(power && power.x === x && power.y === y);
  }
  function randomFree(avoidHead) {
    for (let t = 0; t < 60; t++) {
      const c = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!isFree(c.x, c.y)) continue;
      if (avoidHead && Math.abs(c.x - snake[0].x) + Math.abs(c.y - snake[0].y) < 5) continue;
      return c;
    }
    return null;
  }
  function addFloat(cx, cy, text, color) { floats.push({ x: cc(cx), y: cc(cy), text, color, life: 50 }); }
  function maybePlacePower() {
    if (power || apples < 3 || Math.random() > 0.16) return;
    const c = randomFree(false); if (!c) return;
    const types = snake.length > 8 ? ['ice', 'ghost', 'cut'] : ['ice', 'ghost'];
    power = { x: c.x, y: c.y, type: types[Math.floor(Math.random() * types.length)], timer: 75 };
  }

  function maybePlaceBonus() {
    if (bonus || Math.random() > 0.18) return;
    let tries = 30;
    while (tries-- > 0) {
      const b = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (isFree(b.x, b.y)) {
        bonus = b;
        bonusTimer = 60; // ticks until disappears
        return;
      }
    }
  }

  function tick() {
    // Apply queued direction (only if not a 180)
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) {
      dir = nextDir;
    }

    // Snapshot positions for smooth interpolation between ticks
    prevSnake = snake.map(s => ({ ...s }));

    const head = snake[0];
    const nh = { x: head.x + dir.x, y: head.y + dir.y };

    // Wall collision (portal mode wraps around instead)
    if (mode === 'portal') { nh.x = (nh.x + COLS) % COLS; nh.y = (nh.y + ROWS) % ROWS; }
    else if (nh.x < 0 || nh.x >= COLS || nh.y < 0 || nh.y >= ROWS) {
      die();
      return;
    }
    if (walls.some(w => w.x === nh.x && w.y === nh.y)) { die(); return; }
    if (fx.ice > 0) fx.ice--;
    if (fx.ghost > 0) fx.ghost--;
    if (comboTicks > 0 && --comboTicks === 0) combo = 0;
    // Self collision (ignore tail tip since it'll move — but only when not eating)
    const willEat = nh.x === food.x && nh.y === food.y;
    const body = willEat ? snake : snake.slice(0, -1);
    if (fx.ghost <= 0 && body.some(s => s.x === nh.x && s.y === nh.y)) {
      die();
      return;
    }

    snake.unshift(nh);

    if (willEat) {
      combo = comboTicks > 0 ? Math.min(5, combo + 1) : 1;
      comboTicks = 26;
      score += 10 * combo;
      apples++;
      addFloat(food.x, food.y, combo > 1 ? `+${10 * combo}  x${combo}` : '+10', combo > 1 ? '#ffe36a' : '#fff');
      burst(food.x, food.y, C.food, 12 + combo * 3);
      sfx.eat(snake.length + combo * 3);
      food = null;
      placeFood();
      maybePlaceBonus();
      maybePlacePower();
      if (mode === 'maze' && apples % 3 === 0) { const w = randomFree(true); if (w) { walls.push(w); burst(w.x, w.y, '#8a8aa8', 10); } }
      tickMs = Math.max(55, tickMs - 2);
    } else if (power && nh.x === power.x && nh.y === power.y) {
      const P = POWERS[power.type];
      burst(power.x, power.y, P.c, 22); sfx.bonus(); addFloat(power.x, power.y, P.name, P.c);
      if (power.type === 'ice') fx.ice = 45;
      else if (power.type === 'ghost') fx.ghost = 45;
      else { const n = Math.min(5, snake.length - 4); for (let i = 0; i < n; i++) { const t = snake.pop(); burst(t.x, t.y, C.bodyTail, 5); } score += 20; }
      power = null;
      snake.pop();
    } else if (bonus && nh.x === bonus.x && nh.y === bonus.y) {
      score += 50;
      burst(bonus.x, bonus.y, C.bonus, 20);
      sfx.bonus();
      bonus = null;
      bonusTimer = 0;
      snake.pop(); // bonus doesn't grow
    } else {
      snake.pop();
    }

    if (bonus) {
      bonusTimer--;
      if (bonusTimer <= 0) bonus = null;
    }
    if (power && --power.timer <= 0) power = null;

    scoreEl.textContent = score;
    lenEl.textContent = snake.length;
  }

  function die() {
    state = 'dead';
    sfx.die();
    shake = 18;
    for (const sg of snake) burst(sg.x, sg.y, C.bodyHead, 3);
    if (score > allBest) { allBest = score; localStorage.setItem(BEST_KEY, allBest); buildOpts(); }
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(modeBestKey(), best);
      msgEl.textContent = `NEW BEST: ${score}! Press SPACE to play again`;
      setTimeout(() => sfx.best(), 480);
    } else {
      msgEl.textContent = `Game over — score ${score}. SPACE to play again`;
    }
  }

  const cc = (n) => n * CELL + CELL / 2; // cell index -> pixel center

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function burst(cx, cy, color, n) {
    const px = cc(cx), py = cc(cy);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x: px, y: py,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 20 + Math.random() * 12, maxLife: 32, color,
      });
    }
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
    g.addColorStop(0, C.bgTop);
    g.addColorStop(1, C.bgBot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? C.checkerA : C.checkerB;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    // Vignette
    const v = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, canvas.height * 0.3,
      canvas.width / 2, canvas.height / 2, canvas.height * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawFood() {
    const px = cc(food.x), py = cc(food.y);
    const pulseScale = 1 + Math.sin(pulse * 0.12) * 0.08;
    const r = (CELL / 2 - 3) * pulseScale;

    ctx.save();
    ctx.shadowColor = C.food;
    ctx.shadowBlur = 14;
    // Apple body
    ctx.fillStyle = C.food;
    ctx.beginPath();
    ctx.arc(px, py + 1, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Shading
    ctx.fillStyle = C.foodDark;
    ctx.beginPath();
    ctx.arc(px + r * 0.25, py + r * 0.3, r * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.arc(px - r * 0.35, py - r * 0.35, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    // Leaf
    ctx.fillStyle = C.leaf;
    ctx.beginPath();
    ctx.ellipse(px + 3, py - r - 1, 4, 2.2, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBonus() {
    if (!bonus) return;
    const px = cc(bonus.x), py = cc(bonus.y);
    const fade = bonusTimer < 20 ? (bonusTimer % 6 < 3 ? 1 : 0.35) : 1;
    const r = CELL / 2 - 3 + Math.sin(pulse * 0.2) * 1.5;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.shadowColor = C.bonus;
    ctx.shadowBlur = 16;
    // Gem (diamond)
    ctx.fillStyle = C.bonus;
    ctx.beginPath();
    ctx.moveTo(px, py - r);
    ctx.lineTo(px + r, py);
    ctx.lineTo(px, py + r);
    ctx.lineTo(px - r, py);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Facets
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px - r, py); ctx.lineTo(px + r, py);
    ctx.moveTo(px, py - r); ctx.lineTo(px, py + r);
    ctx.stroke();
    ctx.restore();
  }

  // Interpolated pixel positions for the snake between ticks.
  function snakePoints(interp) {
    const pts = [];
    for (let i = 0; i < snake.length; i++) {
      const cur = snake[i];
      const prev = prevSnake[i] || cur;
      const jump = Math.abs(prev.x - cur.x) > 1 || Math.abs(prev.y - cur.y) > 1;
      pts.push({
        x: cc(jump ? cur.x : lerp(prev.x, cur.x, interp)),
        y: cc(jump ? cur.y : lerp(prev.y, cur.y, interp)),
      });
    }
    return pts;
  }

  // Trace the body, lifting the pen where the snake jumps through a portal wall.
  function trace(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      if (Math.abs(pts[i].x - pts[i - 1].x) > CELL * 1.5 || Math.abs(pts[i].y - pts[i - 1].y) > CELL * 1.5) ctx.moveTo(pts[i].x, pts[i].y);
      else ctx.lineTo(pts[i].x, pts[i].y);
    }
  }
  function drawWalls() {
    for (const w of walls) {
      const x = w.x * CELL, y = w.y * CELL;
      ctx.fillStyle = '#3a3a55'; roundRect(x + 2, y + 2, CELL - 4, CELL - 4, 5); ctx.fill();
      ctx.fillStyle = '#5a5a7a'; roundRect(x + 4, y + 3, CELL - 9, CELL - 11, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x + 6, y + 5, 6, 2);
    }
  }
  function drawPower() {
    if (!power) return;
    const P = POWERS[power.type], px = cc(power.x), py = cc(power.y);
    ctx.save();
    ctx.globalAlpha = power.timer < 20 ? (power.timer % 6 < 3 ? 1 : 0.35) : 1;
    ctx.shadowColor = P.c; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(px, py, CELL / 2 - 1 + Math.sin(pulse * 0.15) * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(P.e, px, py + 1);
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  }
  function drawFx() {
    ctx.textAlign = 'center'; ctx.font = 'bold 14px Courier New';
    for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life / 20); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - (50 - f.life) * 0.6); }
    ctx.globalAlpha = 1;
    let y = 8;
    for (const k of ['ice', 'ghost']) if (fx[k] > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(8, y, 104, 12);
      ctx.fillStyle = POWERS[k].c; ctx.fillRect(10, y + 2, 100 * fx[k] / 45, 8);
      ctx.fillStyle = '#111'; ctx.font = 'bold 9px Courier New'; ctx.textAlign = 'left'; ctx.fillText(POWERS[k].name, 13, y + 9.5);
      y += 16;
    }
    if (combo > 1 && comboTicks > 0) { ctx.textAlign = 'right'; ctx.font = 'bold 16px Courier New'; ctx.fillStyle = '#ffe36a'; ctx.globalAlpha = 0.4 + 0.6 * comboTicks / 26; ctx.fillText('COMBO x' + combo, canvas.width - 10, 20); ctx.globalAlpha = 1; }
    if (mode === 'portal') { ctx.strokeStyle = 'rgba(107,255,209,' + (0.35 + Math.sin(pulse * 0.08) * 0.2) + ')'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.strokeRect(1.5, 1.5, canvas.width - 3, canvas.height - 3); ctx.setLineDash([]); }
  }

  function drawSnake(interp) {
    const pts = snakePoints(interp);
    if (pts.length === 0) return;
    const skin = SKINS.find(k => k.id === skinId) || SKINS[0];
    C.bodyHead = skin.head; C.bodyTail = skin.tail;
    if (fx.ghost > 0) ctx.globalAlpha = fx.ghost < 10 && fx.ghost % 4 < 2 ? 0.9 : 0.5;

    // Body as a thick rounded stroke
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Outer glow
    ctx.save();
    ctx.shadowColor = C.bodyHead;
    ctx.shadowBlur = 8;
    ctx.strokeStyle = C.bodyTail;
    ctx.lineWidth = CELL - 6;
    trace(pts);
    ctx.stroke();
    ctx.restore();

    // Gradient body head->tail (approx along head-to-tail axis)
    const tail = pts[pts.length - 1];
    const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, tail.x, tail.y);
    if (skin.rainbow) ['#ff5a5a', '#ffb347', '#ffe36a', '#7bd88f', '#6bd1ff', '#b07bff'].forEach((c, i) => grad.addColorStop(i / 5, c));
    else { grad.addColorStop(0, C.bodyHead); grad.addColorStop(1, C.bodyTail); }
    ctx.strokeStyle = grad;
    ctx.lineWidth = CELL - 8;
    trace(pts);
    ctx.stroke();

    // Glossy spine highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = (CELL - 8) * 0.4;
    trace(pts);
    ctx.stroke();

    // Head
    const h = pts[0];
    const hr = CELL / 2 - 2;
    ctx.fillStyle = C.bodyHead;
    roundRect(h.x - hr, h.y - hr, hr * 2, hr * 2, 7);
    ctx.fill();

    // Eyes (face travel direction)
    const ex = dir.x, ey = dir.y;
    const perp = { x: -ey, y: ex };
    const eyeFwd = hr * 0.35, eyeSide = hr * 0.45, eyeR = 2.6;
    for (const s of [1, -1]) {
      const exx = h.x + ex * eyeFwd + perp.x * eyeSide * s;
      const eyy = h.y + ey * eyeFwd + perp.y * eyeSide * s;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(exx, eyy, eyeR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0a0a18';
      ctx.beginPath(); ctx.arc(exx + ex * 1.1, eyy + ey * 1.1, 1.3, 0, Math.PI * 2); ctx.fill();
    }

    // Flicking tongue
    if (state === 'playing' && Math.sin(pulse * 0.3) > 0.4) {
      const tx = h.x + ex * hr, ty = h.y + ey * hr;
      ctx.strokeStyle = '#ff4d6d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx + ex * 6, ty + ey * 6);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function updateParticles() {
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.life--;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function draw(now) {
    let interp = 1;
    if (state === 'playing') interp = Math.min(1, (now - lastTick) / (tickMs * (fx.ice > 0 ? 1.7 : 1)));

    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.85; if (shake < 0.5) shake = 0; }
    drawBackground();
    drawWalls();
    if (food) drawFood();
    drawBonus();
    drawPower();
    drawSnake(interp);
    drawParticles();
    drawFx();
    ctx.restore();

    if (state === 'idle') {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = C.bodyHead;
      ctx.font = 'bold 28px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    }
  }

  function loop(now) {
    requestAnimationFrame(loop);
    pulse++;
    for (const f of floats) f.life--;
    floats = floats.filter(f => f.life > 0);
    if (state === 'playing' && now - lastTick >= tickMs * (fx.ice > 0 ? 1.7 : 1)) {
      lastTick = now;
      tick();
    }
    updateParticles();
    draw(now);
  }

  function setDir(x, y) {
    if (state === 'idle') {
      state = 'playing';
      msgEl.textContent = '';
      lastTick = performance.now();
    }
    if (state !== 'playing') return;
    // Prevent reversing on the same tick
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  document.addEventListener('keydown', e => {
    switch (e.code) {
      case 'ArrowUp': case 'KeyW': e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown': case 'KeyS': e.preventDefault(); setDir(0, 1); break;
      case 'ArrowLeft': case 'KeyA': e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': case 'KeyD': e.preventDefault(); setDir(1, 0); break;
      case 'KeyP':
        e.preventDefault();
        if (state === 'playing') { state = 'paused'; msgEl.textContent = 'Paused — P to resume'; }
        else if (state === 'paused') { state = 'playing'; msgEl.textContent = ''; lastTick = performance.now(); }
        break;
      case 'Space':
        e.preventDefault();
        if (state === 'dead') {
          reset();
          state = 'idle';
          msgEl.textContent = 'Press an arrow key to start';
        }
        break;
    }
  });

  // Touch swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state === 'dead') {
      reset();
      state = 'idle';
      msgEl.textContent = 'Swipe to start';
      return;
    }
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!touchStart) return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  canvas.addEventListener('touchend', () => { touchStart = null; });

  // ---- mode & skin pickers ----
  function buildOpts() {
    const mEl = document.getElementById('modes'), sEl = document.getElementById('skins');
    mEl.innerHTML = ''; sEl.innerHTML = '';
    for (const m of MODES) {
      const b = document.createElement('button'); b.className = 'optbtn' + (m.id === mode ? ' on' : ''); b.textContent = m.name; b.title = m.tip;
      b.addEventListener('click', () => {
        b.blur(); if (state === 'playing' || state === 'paused') return;
        mode = m.id; localStorage.setItem(MODE_KEY, mode);
        best = parseInt(localStorage.getItem(modeBestKey()) || (mode === 'classic' ? allBest : 0), 10) || 0; bestEl.textContent = best;
        reset(); state = 'idle'; msgEl.textContent = m.tip + ' — press an arrow key to start'; buildOpts();
      });
      mEl.appendChild(b);
    }
    for (const k of SKINS) {
      const open = allBest >= k.need, b = document.createElement('button');
      b.className = 'optbtn' + (k.id === skinId ? ' on' : '') + (open ? '' : ' locked');
      b.innerHTML = `<i style="background:linear-gradient(135deg,${k.head},${k.tail})"></i>${open ? k.name : '&#128274; ' + k.need}`;
      b.title = open ? k.name : `Score ${k.need} in any mode to unlock`;
      b.addEventListener('click', () => { b.blur(); if (!open) { msgEl.textContent = `Score ${k.need} in any mode to unlock the ${k.name} skin`; return; } skinId = k.id; localStorage.setItem(SKIN_KEY, skinId); buildOpts(); });
      sEl.appendChild(b);
    }
  }
  if (!SKINS.some(k => k.id === skinId && allBest >= k.need)) skinId = 'green';
  buildOpts();

  reset();
  requestAnimationFrame(loop);
</script>
</body>
</html>
