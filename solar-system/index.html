<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Explorer - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #04040c;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-align: center;
    }

    #questionBar {
      width: 100%;
      max-width: 720px;
      min-height: 28px;
      margin-bottom: 8px;
      padding: 8px 12px;
      background: #1a1a2e;
      border: 2px solid #ffe60055;
      color: #ffe600;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-align: center;
      display: none;
    }

    #questionBar.show { display: block; }
    #questionBar.right { border-color: #6bffd1; color: #6bffd1; }
    #questionBar.wrong { border-color: #ff6b6b; color: #ff6b6b; }

    #gameCanvas {
      border: 3px solid #1a1a2e;
      background: #04040c;
      display: block;
      cursor: grab;
      touch-action: none;
      max-width: 100%;
    }

    .controls {
      width: 100%;
      max-width: 720px;
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #1a1a2e;
      color: #ffe600;
      border: 2px solid #333;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 1px;
    }

    button:hover { border-color: #ffe600; }
    button.active { background: #2a2a4a; border-color: #ffe600; }

    .panel {
      width: 100%;
      max-width: 720px;
      margin-top: 14px;
      background: #0e0e1c;
      border: 2px solid #222;
      padding: 16px;
      min-height: 140px;
    }

    .panel h2 {
      color: #ffe600;
      font-size: 1.4rem;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .panel .ptype {
      color: #888;
      font-size: 0.75rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .panel .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px 16px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .panel .stats .k { color: #888; letter-spacing: 1px; }
    .panel .stats .v { color: #fff; }

    .panel .fact {
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.5;
      border-left: 3px solid #ffe600;
      padding-left: 10px;
      margin-top: 10px;
    }

    .placeholder {
      color: #666;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-align: center;
      padding: 20px;
    }

    .back-link {
      margin-top: 28px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: #1a1a2e;
      border: 2px solid #ffe600;
      color: #ffe600;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      letter-spacing: 1px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.1s;
    }

    #tooltip.show { opacity: 1; }
  </style>
</head>
<body>

  <h1>&#128640; Solar System</h1>
  <p class="subtitle">Drag to spin the view in 3D &middot; scroll to zoom &middot; click a planet to learn about it &middot; launch comets &middot; quiz yourself!</p>

  <div id="questionBar"></div>

  <canvas id="gameCanvas" width="720" height="500"></canvas>

  <div class="controls">
    <button id="pauseBtn">PAUSE</button>
    <button data-speed="0.5">0.5×</button>
    <button data-speed="1" class="active">1×</button>
    <button data-speed="5">5×</button>
    <button data-speed="20">20×</button>
    <button id="viewBtn">RESET VIEW</button>
    <button id="scaleBtn">SHOW REAL DISTANCES</button>
    <button id="labelBtn">SHOW NAMES</button>
    <button id="compareBtn">SIZE COMPARE</button>
    <button id="cometBtn">LAUNCH COMET</button>
    <button id="quizBtn">QUIZ ME</button>
  </div>

  <div class="panel" id="panel">
    <div class="placeholder">Click a planet to see its info, or hit <strong style="color:#ffe600">QUIZ ME</strong> to test yourself.</div>
  </div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

  <div id="tooltip"></div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const tooltip = document.getElementById('tooltip');
  const panel = document.getElementById('panel');
  const questionBar = document.getElementById('questionBar');
  const pauseBtn = document.getElementById('pauseBtn');
  const viewBtn = document.getElementById('viewBtn');
  const scaleBtn = document.getElementById('scaleBtn');
  const compareBtn = document.getElementById('compareBtn');
  const cometBtn = document.getElementById('cometBtn');
  const quizBtn = document.getElementById('quizBtn');

  const QUIZ_BEST_KEY = 'solarSystem.quizBest';

  // Real-ish data; orbit radius & display radius are tuned for visibility.
  // periodDays = real Earth days for one orbit.
  // orbitAU = real semi-major axis (used in real-scale mode).
  // compressedR = world units in compressed mode.
  // inclDeg = real orbital inclination vs. the ecliptic (gives true 3D orbits;
  //           look how tilted Pluto's path is when you spin the view!).
  const PLANETS = [
    {
      name: 'Mercury', type: 'Terrestrial planet',
      color: '#a89074', accent: '#7a6452',
      r: 4, compressedR: 60, orbitAU: 0.39, periodDays: 88, inclDeg: 7.0,
      diameterKm: 4879, gravityG: 0.38, moons: 0, dayHours: 4222.6,
      fact: 'Mercury is the smallest planet and the closest to the Sun. Days are longer than years here — one Mercury day takes about 176 Earth days, but a year is just 88!'
    },
    {
      name: 'Venus', type: 'Terrestrial planet',
      color: '#e6c074', accent: '#a88a40',
      r: 7, compressedR: 90, orbitAU: 0.72, periodDays: 225, inclDeg: 3.4,
      diameterKm: 12104, gravityG: 0.91, moons: 0, dayHours: 2802,
      fact: 'Venus is the hottest planet (about 465°C / 870°F) because of a thick CO₂ atmosphere — even though Mercury is closer to the Sun. It also spins backward!'
    },
    {
      name: 'Earth', type: 'Our home planet',
      color: '#5aa0e6', accent: '#3a6da0',
      r: 7, compressedR: 125, orbitAU: 1.00, periodDays: 365, inclDeg: 0,
      diameterKm: 12742, gravityG: 1.00, moons: 1, dayHours: 24,
      fact: "Earth is the only place we've ever found life. About 71% of its surface is covered in liquid water, and its magnetic field protects us from harmful solar radiation.",
      hasMoon: true
    },
    {
      name: 'Mars', type: 'Terrestrial planet',
      color: '#d76b3a', accent: '#8a3a1a',
      r: 5, compressedR: 160, orbitAU: 1.52, periodDays: 687, inclDeg: 1.9,
      diameterKm: 6779, gravityG: 0.38, moons: 2, dayHours: 24.6,
      fact: 'Mars has the largest volcano in the solar system — Olympus Mons — about 22 km tall, almost 3× higher than Mount Everest. Its red color comes from rusty iron in the soil.'
    },
    {
      name: 'Jupiter', type: 'Gas giant',
      color: '#d4a06a', accent: '#8a6038',
      r: 22, compressedR: 220, orbitAU: 5.20, periodDays: 4333, inclDeg: 1.3,
      diameterKm: 139820, gravityG: 2.53, moons: 95, dayHours: 9.9,
      fact: 'Jupiter is so big that more than 1,300 Earths could fit inside it. The Great Red Spot is a giant storm that has been raging for at least 400 years.',
      bands: true
    },
    {
      name: 'Saturn', type: 'Gas giant',
      color: '#e6d39a', accent: '#a8945a',
      r: 18, compressedR: 280, orbitAU: 9.58, periodDays: 10759, inclDeg: 2.5,
      diameterKm: 116460, gravityG: 1.07, moons: 146, dayHours: 10.7,
      fact: "Saturn's rings are made of billions of chunks of ice and rock, some as small as dust grains and others as big as a house. Saturn is so light it would float in water!",
      rings: true
    },
    {
      name: 'Uranus', type: 'Ice giant',
      color: '#9adfe6', accent: '#5a96a0',
      r: 12, compressedR: 330, orbitAU: 19.22, periodDays: 30687, inclDeg: 0.8,
      diameterKm: 50724, gravityG: 0.89, moons: 27, dayHours: 17.2,
      fact: 'Uranus is tipped on its side! It rotates almost completely sideways compared to other planets, so its poles take turns facing the Sun for 42 years at a time.',
      thinRings: true
    },
    {
      name: 'Neptune', type: 'Ice giant',
      color: '#3a6dd0', accent: '#1a3a8a',
      r: 12, compressedR: 380, orbitAU: 30.05, periodDays: 60190, inclDeg: 1.8,
      diameterKm: 49244, gravityG: 1.14, moons: 14, dayHours: 16.1,
      fact: 'Neptune has the fastest winds in the solar system — over 2,000 km/h, faster than the speed of sound on Earth. It was the first planet found by math before being seen.'
    },
    {
      name: 'Pluto', type: 'Dwarf planet',
      color: '#d9c2a7', accent: '#9a7f63',
      r: 3, compressedR: 412, orbitAU: 39.5, periodDays: 90560, inclDeg: 17.2,
      diameterKm: 2376, gravityG: 0.06, moons: 5, dayHours: 153.3,
      dwarf: true,
      fact: 'Pluto was counted as the 9th planet until 2006, when it was reclassified as a dwarf planet. It has a giant heart-shaped nitrogen glacier, and its biggest moon Charon is half its size!'
    }
  ];

  const SUN = {
    name: 'Sun', type: 'Yellow dwarf star',
    color: '#ffe066', accent: '#ff8a00',
    r: 26,
    diameterKm: 1391000, gravityG: 28, moons: 0, ageBy: 4.6,
    fact: "The Sun is a star — a giant ball of mostly hydrogen and helium. It contains 99.86% of all the mass in the solar system, and every second it converts about 600 million tonnes of hydrogen into helium."
  };

  // Extra educational data keyed by planet name (temperature, composition,
  // and orbital speed in km/s — note how the inner planets race around the
  // Sun far faster than the outer ones, a real consequence of gravity).
  const EXTRA = {
    Mercury: { tempC: '167°C avg (430° day / −180° night)', madeOf: 'Rock & metal core',     orbitKmS: 47.4 },
    Venus:   { tempC: '465°C — the hottest planet',         madeOf: 'Rock, thick CO₂ air',   orbitKmS: 35.0 },
    Earth:   { tempC: '15°C average',                       madeOf: 'Rock, water & air',     orbitKmS: 29.8 },
    Mars:    { tempC: '−65°C average',                      madeOf: 'Rock & rusty iron dust',orbitKmS: 24.1 },
    Jupiter: { tempC: '−110°C at the cloud tops',           madeOf: 'Hydrogen & helium gas', orbitKmS: 13.1 },
    Saturn:  { tempC: '−140°C at the cloud tops',           madeOf: 'Hydrogen & helium gas', orbitKmS: 9.7 },
    Uranus:  { tempC: '−195°C',                             madeOf: 'Icy water, methane, ammonia', orbitKmS: 6.8 },
    Neptune: { tempC: '−200°C',                             madeOf: 'Icy water, methane, ammonia', orbitKmS: 5.4 },
    Pluto:   { tempC: '−230°C',                             madeOf: 'Nitrogen ice & rock',   orbitKmS: 4.7 },
  };
  const KID_KG = 30; // a typical 10-year-old, for the "you'd weigh" stat

  // State
  let simDays = 0;
  let speed = 1;          // multiplier
  let timePerSec = 30;    // sim days per real second at speed=1
  let paused = false;
  let realScale = false;
  let selected = null;
  let hoverIndex = -1;
  let hoverSun = false;
  let stars = [];
  let quiz = null;        // { target: planet, score, best }
  let quizFlash = 0;      // 0=none, +ve=correct, -ve=wrong (counts down)
  let mode = 'orbit';     // 'orbit' or 'compare'
  let showLabels = false;

  // ---- 3D camera ----
  // The solar system lives in 3D world space: the Sun at the origin, planets
  // orbiting (mostly) in the XZ plane, +Y pointing "up" out of the ecliptic.
  // The camera orbits the Sun on a sphere: yaw spins around, pitch tilts
  // between near-edge-on and top-down, dist zooms.
  const DEFAULT_CAM = { yaw: 0, pitch: 0.58, dist: 1150 };
  let cam = { ...DEFAULT_CAM };
  const FOCAL = 900;
  const MIN_PITCH = 0.12, MAX_PITCH = 1.5;
  const MIN_DIST = 400, MAX_DIST = 3000;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // World point -> screen point with perspective. Returns the screen x/y,
  // the perspective scale s (1 = "actual size" at the Sun's distance when
  // fully zoomed to default), and depth from the camera (for sorting).
  function project(wx, wy, wz) {
    const cyaw = Math.cos(cam.yaw), syaw = Math.sin(cam.yaw);
    const x1 = wx * cyaw - wz * syaw;
    const z1 = wx * syaw + wz * cyaw;
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const y2 = wy * cp - z1 * sp;
    const z2 = wy * sp + z1 * cp;
    const depth = cam.dist - z2;
    const s = FOCAL / Math.max(60, depth);
    return { x: cx + x1 * s, y: cy - y2 * s, s, depth };
  }

  // Screen point -> the point on the ecliptic plane (y=0) under the cursor,
  // by casting a ray from the camera through the pixel. Used to aim comets.
  function screenToPlane(sx, sy) {
    const cyaw = Math.cos(cam.yaw), syaw = Math.sin(cam.yaw);
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    // Camera position in world space
    const camY = cam.dist * sp;
    const ground = cam.dist * cp;
    const camX = ground * syaw;
    const camZ = ground * cyaw;
    // Ray direction: view space -> world space (inverse camera rotation)
    const vx = (sx - cx) / FOCAL, vy = -(sy - cy) / FOCAL, vz = -1;
    const dy = vy * cp + vz * sp;
    const z1 = -vy * sp + vz * cp;
    const dx = vx * cyaw + z1 * syaw;
    const dz = -vx * syaw + z1 * cyaw;
    if (dy >= -1e-6) return null; // looking above the plane
    const t = -camY / dy;
    const wx = camX + dx * t, wz = camZ + dz * t;
    if (Math.abs(wx) > 4000 || Math.abs(wz) > 4000) return null;
    return { x: wx, z: wz };
  }

  // ---- Comet physics sandbox ----
  let cometMode = false;
  let comets = [];        // { x, z, vx, vz, trail: [{x,z}] } — in world space
  let aiming = null;      // { x0, z0, x1, z1 } on the ecliptic plane
  const GM = 950;         // Sun's gravitational parameter, tuned for the scene
  let sunFlash = 0;       // brief flash when a comet falls into the Sun
  let impacts = [];       // expanding rings where a comet hit a planet

  // Per-frame screen positions for hit-testing, populated by the renderer.
  // Each entry: { x, y, r } (r = on-screen apparent radius).
  let screenPos = [];
  let sunScreenPos = { x: cx, y: cy, r: SUN.r };
  let sunScr = { x: cx, y: cy, s: 1, depth: DEFAULT_CAM.dist };

  const MAX_COMPRESSED = Math.max(...PLANETS.map(p => p.compressedR));
  const ORBIT_SCALE = (W / 2 - 14) / MAX_COMPRESSED;
  const MAX_AU = 40; // real-scale mode maps 0..40 AU (Pluto included)

  const STAR_TINTS = ['255,255,255', '255,255,255', '205,222,255', '255,232,205'];
  for (let i = 0; i < 230; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      brightness: Math.random() * 0.6 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      size: Math.random() < 0.12 ? 2 : 1,
      tint: STAR_TINTS[Math.floor(Math.random() * STAR_TINTS.length)],
    });
  }
  let shootingStar = null;

  // ---- Coordinates ----
  function orbitRadius(p) {
    if (realScale) {
      const maxR = W / 2 - 14;
      return 30 + (p.orbitAU / MAX_AU) * (maxR - 30);
    }
    return p.compressedR * ORBIT_SCALE;
  }

  // 3D world position of a planet on its (inclined) orbit.
  function planetPos3D(p, i) {
    const r = orbitRadius(p);
    // give each planet a phase offset so they don't all start aligned
    const phase = i * 0.7;
    const angle = phase + (simDays / p.periodDays) * Math.PI * 2;
    const incl = (p.inclDeg || 0) * Math.PI / 180;
    return {
      wx: Math.cos(angle) * r,
      wy: Math.sin(angle) * r * Math.sin(incl),
      wz: Math.sin(angle) * r * Math.cos(incl),
      angle, r
    };
  }

  // ---- Drawing ----
  function drawStars(t) {
    for (const s of stars) {
      const b = s.brightness * (0.7 + 0.3 * Math.sin(t * 0.001 + s.twinkle));
      ctx.fillStyle = `rgba(${s.tint},${b})`;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    drawShootingStar();
  }

  function drawShootingStar() {
    if (!shootingStar && Math.random() < 0.004) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      shootingStar = {
        x: Math.random() * W, y: Math.random() * H * 0.35,
        vx: (5 + Math.random() * 4) * dir, vy: 2 + Math.random() * 2, life: 0,
      };
    }
    if (!shootingStar) return;
    const s = shootingStar;
    s.x += s.vx; s.y += s.vy; s.life++;
    const a = Math.max(0, 1 - s.life / 55);
    const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 7, s.y - s.vy * 7);
    grad.addColorStop(0, `rgba(255,255,255,${0.85 * a})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 7, s.y - s.vy * 7);
    ctx.stroke();
    if (s.life > 55 || s.x < -60 || s.x > W + 60 || s.y > H + 60) shootingStar = null;
  }

  function drawSun(t, scr) {
    const x = scr.x, y = scr.y;
    const R = SUN.r * scr.s;

    // Glow (gently breathing)
    const pulse = 1 + 0.05 * Math.sin(t * 0.0012);
    const glow = ctx.createRadialGradient(x, y, R * 0.5, x, y, R * 3 * pulse);
    glow.addColorStop(0, 'rgba(255,200,40,0.55)');
    glow.addColorStop(1, 'rgba(255,200,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, R * 3 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Slowly rotating corona rays
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 0.00006);
    ctx.fillStyle = 'rgba(255,205,60,0.07)';
    for (let i = 0; i < 12; i++) {
      const a = i * (Math.PI * 2 / 12);
      const len = R * (2.0 + 0.4 * Math.sin(t * 0.001 + i * 1.7));
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.1) * R * 0.9, Math.sin(a - 0.1) * R * 0.9);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.lineTo(Math.cos(a + 0.1) * R * 0.9, Math.sin(a + 0.1) * R * 0.9);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // Body
    ctx.fillStyle = SUN.color;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fill();

    // Sun spots / surface noise
    ctx.fillStyle = SUN.accent;
    for (let i = 0; i < 4; i++) {
      const a = i * 1.7 + t * 0.0003;
      const sx = x + Math.cos(a) * R * 0.55;
      const sy = y + Math.sin(a) * R * 0.45;
      ctx.beginPath();
      ctx.arc(sx, sy, (3 + Math.sin(t * 0.002 + i)) * scr.s, 0, Math.PI * 2);
      ctx.fill();
    }

    if (hoverSun) {
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, R + 5, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (sunFlash > 0) {
      ctx.fillStyle = `rgba(255,240,180,${sunFlash / 24})`;
      ctx.beginPath();
      ctx.arc(x, y, R + 6 + (12 - sunFlash) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawAsteroidBelt() {
    // Between Mars and Jupiter
    const r1 = realScale ? orbitRadius({ orbitAU: 2.2 }) : (PLANETS[3].compressedR + 18) * ORBIT_SCALE;
    const r2 = realScale ? orbitRadius({ orbitAU: 3.2 }) : (PLANETS[3].compressedR + 30) * ORBIT_SCALE;
    ctx.fillStyle = 'rgba(170,170,170,0.45)';
    // Deterministic dots so they don't shimmer; small Y jitter gives the belt
    // a little real thickness in 3D.
    for (let i = 0; i < 220; i++) {
      const a = (i * 137.5 * Math.PI / 180) + simDays * 0.0008;
      const r = r1 + ((i * 73) % 1000) / 1000 * (r2 - r1);
      const yj = ((((i * 37) % 100) - 50) / 50) * 3;
      const pt = project(Math.cos(a) * r, yj, Math.sin(a) * r);
      const sz = Math.max(1, pt.s);
      ctx.fillRect(pt.x, pt.y, sz, sz);
    }
  }

  function drawOrbit(p, highlight) {
    const r = orbitRadius(p);
    const incl = (p.inclDeg || 0) * Math.PI / 180;
    ctx.strokeStyle = highlight ? '#ffe60055' : (p.dwarf ? '#ffffff0a' : '#ffffff12');
    ctx.lineWidth = 1;
    if (p.dwarf) ctx.setLineDash([3, 5]);
    ctx.beginPath();
    const STEPS = 90;
    for (let k = 0; k <= STEPS; k++) {
      const a = (k / STEPS) * Math.PI * 2;
      const pt = project(Math.cos(a) * r, Math.sin(a) * r * Math.sin(incl), Math.sin(a) * r * Math.cos(incl));
      if (k === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Saturn-style rings split into a far half (behind the planet) and a
  // near half (in front), with a Cassini-division gap between bands.
  // squash follows the camera pitch in orbit view so the rings open up
  // as you fly over the top of the system.
  function drawSaturnRings(x, y, r, half, squash = 0.35) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.4);
    ctx.scale(1, squash);
    const start = half === 'front' ? 0 : Math.PI;
    const end = half === 'front' ? Math.PI : Math.PI * 2;
    const bands = [
      [1.35, r * 0.42, 'rgba(196,180,130,0.55)'],
      [1.78, r * 0.30, 'rgba(226,212,164,0.8)'],
      [2.18, r * 0.16, 'rgba(170,155,110,0.45)'],
    ];
    for (const [mul, wd, col] of bands) {
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(1.5, wd);
      ctx.beginPath();
      ctx.arc(0, 0, r * mul, start, end);
      ctx.stroke();
    }
    ctx.restore();
  }

  function ringSquash() {
    return clamp(0.18 + Math.sin(cam.pitch) * 0.45, 0.15, 0.75);
  }

  function drawPlanet(p, i, t, scr, w) {
    const isHover = hoverIndex === i;
    const isSel = selected === p;
    const pr = p.r * scr.s;

    // Saturn rings, far half (drawn behind the body)
    if (p.rings) drawSaturnRings(scr.x, scr.y, pr, 'back', ringSquash());

    // Body
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(scr.x, scr.y, pr, 0, Math.PI * 2);
    ctx.fill();

    // Shading (sun-side highlight)
    const lightAng = Math.atan2(sunScr.y - scr.y, sunScr.x - scr.x);
    const lx = scr.x + Math.cos(lightAng) * pr * 0.35;
    const ly = scr.y + Math.sin(lightAng) * pr * 0.35;
    const grad = ctx.createRadialGradient(lx, ly, 0, scr.x, scr.y, pr);
    grad.addColorStop(0, 'rgba(255,255,255,0.25)');
    grad.addColorStop(0.6, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(scr.x, scr.y, pr, 0, Math.PI * 2);
    ctx.fill();

    // Jupiter bands
    if (p.bands) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, pr, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = p.accent;
      for (let k = -2; k <= 2; k++) {
        ctx.fillRect(scr.x - pr, scr.y + k * 5 * scr.s - 1, pr * 2, Math.max(1.5, 2 * scr.s));
      }
      // Great red spot
      ctx.fillStyle = '#c44a3a';
      ctx.beginPath();
      ctx.ellipse(scr.x + pr * 0.3, scr.y + pr * 0.2, 4 * scr.s, 2 * scr.s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Saturn rings, near half (in front of the body)
    if (p.rings) drawSaturnRings(scr.x, scr.y, pr, 'front', ringSquash());

    // Uranus has faint, nearly-vertical rings (it spins on its side)
    if (p.thinRings) {
      ctx.save();
      ctx.translate(scr.x, scr.y);
      ctx.rotate(1.35);
      ctx.scale(1, 0.3);
      ctx.strokeStyle = 'rgba(160,210,220,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, pr * 1.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Earth's moon (orbits in 3D around the planet)
    if (p.hasMoon) {
      const ma = simDays * 0.22 + i;
      const mr = p.r + 9;
      const mScr = project(w.wx + Math.cos(ma) * mr, w.wy, w.wz + Math.sin(ma) * mr);
      ctx.fillStyle = '#bbbbbb';
      ctx.beginPath();
      ctx.arc(mScr.x, mScr.y, 2.2 * mScr.s, 0, Math.PI * 2);
      ctx.fill();
    }

    // Name label
    if (showLabels) {
      ctx.fillStyle = 'rgba(220,220,220,0.75)';
      ctx.font = '9px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(p.name.toUpperCase(), scr.x, scr.y + pr + 13);
    }

    // Highlight ring
    if (isHover || isSel) {
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, pr + 5, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (quizFlash !== 0 && quiz && quiz.targetIndex === i) {
      const c = quizFlash > 0 ? '#6bffd1' : '#ff6b6b';
      ctx.strokeStyle = c;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, pr + 8 + (Math.abs(quizFlash) % 10), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function render(t) {
    ctx.fillStyle = '#04040c';
    ctx.fillRect(0, 0, W, H);
    drawStars(t);

    if (mode === 'compare') {
      renderCompare(t);
    } else {
      // Orbit paths
      for (let i = 0; i < PLANETS.length; i++) {
        drawOrbit(PLANETS[i], hoverIndex === i || selected === PLANETS[i]);
      }
      drawAsteroidBelt();

      sunScr = project(0, 0, 0);

      // Project every body, then paint far-to-near so planets correctly
      // pass in front of / behind the Sun and each other in 3D.
      const bodies = PLANETS.map((p, i) => {
        const w = planetPos3D(p, i);
        return { p, i, w, scr: project(w.wx, w.wy, w.wz) };
      });
      const drawList = [...bodies, { sun: true, scr: sunScr }];
      drawList.sort((a, b) => b.scr.depth - a.scr.depth);
      for (const b of drawList) {
        if (b.sun) drawSun(t, sunScr);
        else drawPlanet(b.p, b.i, t, b.scr, b.w);
      }

      drawComets();
      drawImpacts();

      // Cache screen positions for hit-testing
      sunScreenPos = { x: sunScr.x, y: sunScr.y, r: SUN.r * sunScr.s };
      screenPos = [];
      for (const b of bodies) screenPos[b.i] = { x: b.scr.x, y: b.scr.y, r: b.p.r * b.scr.s };

      // Control hint
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '10px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText('DRAG: SPIN VIEW · SCROLL/PINCH: ZOOM', 10, H - 10);
    }

    if (quizFlash > 0) quizFlash--;
    else if (quizFlash < 0) quizFlash++;
  }

  function renderCompare(t) {
    // Pick a scale where Jupiter fits comfortably.
    // Jupiter diameter is ~140000 km; aim for ~140 px diameter (radius 70).
    const KM_PER_PX = 1000;
    const radii = PLANETS.map(p => p.diameterKm / 2 / KM_PER_PX);
    const sunDiameterPx = SUN.diameterKm / KM_PER_PX;

    // Lay planets out left-to-right in solar order
    const gap = 24;
    const totalPlanetsWidth = radii.reduce((a, b) => a + b * 2, 0) + gap * (PLANETS.length - 1);
    const sunSliceWidth = 110; // visible portion of the Sun's curve on the left
    const startX = sunSliceWidth + 30;
    const planetsTotalEnd = startX + totalPlanetsWidth;
    // If overflowing, scale everything down
    const overflow = Math.max(0, planetsTotalEnd - (W - 16));
    const scale = overflow > 0 ? (W - 16 - sunSliceWidth - 30) / totalPlanetsWidth : 1;
    const scaledRadii = radii.map(r => r * scale);
    const scaledGap = gap * scale;

    // ----- Sun arc on the left -----
    const sunR = (sunDiameterPx / 2) * scale;
    const sunCx = -sunR + sunSliceWidth; // visible arc = sunSliceWidth at the equator
    const sunCy = H / 2;
    // Sun glow
    const sg = ctx.createRadialGradient(sunCx, sunCy, sunR * 0.7, sunCx, sunCy, sunR * 1.05);
    sg.addColorStop(0, 'rgba(255,200,40,0)');
    sg.addColorStop(0.85, 'rgba(255,200,40,0.18)');
    sg.addColorStop(1, 'rgba(255,200,40,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sunCx, sunCy, sunR * 1.05, 0, Math.PI * 2);
    ctx.fill();
    // Sun body
    ctx.fillStyle = SUN.color;
    ctx.beginPath();
    ctx.arc(sunCx, sunCy, sunR, 0, Math.PI * 2);
    ctx.fill();
    // surface flicker
    ctx.fillStyle = SUN.accent;
    for (let i = 0; i < 6; i++) {
      const a = i * 1.2 + t * 0.0004;
      ctx.beginPath();
      ctx.arc(sunCx + Math.cos(a) * sunR * 0.9, sunCy + Math.sin(a) * sunR * 0.7,
              3 + Math.sin(t * 0.002 + i) * 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    // Sun label (vertical along its visible edge)
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('SUN', 12, H / 2 - 4);
    ctx.fillStyle = '#888';
    ctx.font = '10px Courier New';
    ctx.fillText('only the edge', 12, H / 2 + 10);
    ctx.fillText('fits!', 12, H / 2 + 22);
    if (hoverSun) {
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sunCx, sunCy, sunR + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    sunScreenPos = { x: sunCx, y: sunCy, r: sunR };

    // ----- Planets line -----
    const baselineY = H / 2 + 30;
    let cursor = startX;
    screenPos = [];
    for (let i = 0; i < PLANETS.length; i++) {
      const p = PLANETS[i];
      const r = scaledRadii[i];
      const x = cursor + r;
      const y = baselineY;
      screenPos.push({ x, y, r });

      // Saturn rings, far half (drawn first, behind body)
      if (p.rings) drawSaturnRings(x, y, r, 'back');

      // Body
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      // Light shading
      const lg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
      lg.addColorStop(0, 'rgba(255,255,255,0.25)');
      lg.addColorStop(0.6, 'rgba(255,255,255,0)');
      lg.addColorStop(1, 'rgba(0,0,0,0.45)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Jupiter bands
      if (p.bands && r > 14) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = p.accent;
        for (let k = -3; k <= 3; k++) {
          ctx.fillRect(x - r, y + k * (r * 0.18) - 1, r * 2, Math.max(2, r * 0.06));
        }
        ctx.fillStyle = '#c44a3a';
        ctx.beginPath();
        ctx.ellipse(x + r * 0.3, y + r * 0.2, r * 0.16, r * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Saturn rings, near half (in front)
      if (p.rings) drawSaturnRings(x, y, r, 'front');

      // Highlight ring
      if (hoverIndex === i || selected === p) {
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, r + 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (quizFlash !== 0 && quiz && quiz.targetIndex === i) {
        const c = quizFlash > 0 ? '#6bffd1' : '#ff6b6b';
        ctx.strokeStyle = c;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, r + 6 + (Math.abs(quizFlash) % 10), 0, Math.PI * 2);
        ctx.stroke();
      }

      // Name label below (staggered in two rows so neighbours don't overlap)
      const labelY = baselineY + Math.max(r, 12) + 16 + (i % 2) * 28;
      ctx.fillStyle = '#ccc';
      ctx.font = 'bold 11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(p.name.toUpperCase(), x, labelY);
      // Diameter label
      ctx.fillStyle = '#666';
      ctx.font = '10px Courier New';
      ctx.fillText(formatNum(p.diameterKm) + ' km', x, labelY + 14);

      cursor += r * 2 + scaledGap;
    }

    // ----- Header text -----
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PLANETS AT TRUE RELATIVE SIZE', W / 2, 28);
    ctx.fillStyle = '#888';
    ctx.font = '11px Courier New';
    ctx.fillText('Jupiter is ~11× wider than Earth · the Sun is ~109× wider', W / 2, 46);

    // "How many Earths fit across?" callouts on a couple of bodies
    const earthDiam = 12742;
    const callout = (i, text) => {
      const sp = screenPos[i];
      ctx.fillStyle = '#ffe60099';
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(text, sp.x, sp.y - sp.r - 8);
    };
    const earthsAcross = (km) => Math.round(km / earthDiam);
    callout(4, `${earthsAcross(PLANETS[4].diameterKm)} Earths wide`); // Jupiter
    callout(5, `${earthsAcross(PLANETS[5].diameterKm)} Earths wide`); // Saturn
  }

  // ---- Loop ----
  let lastTime = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = lastTime ? Math.min(100, now - lastTime) : 16;
    lastTime = now;
    if (!paused) {
      simDays += (dt / 1000) * timePerSec * speed;
      if (comets.length) stepComets();
    }
    if (sunFlash > 0) sunFlash--;
    render(now);
  }

  // Newtonian gravity toward the Sun, simulated in world space on the
  // ecliptic plane. Uses small sub-steps for a stable inverse-square
  // integration, so comets trace real orbits, slingshots, and escape
  // trajectories — and they stay correct as you spin the camera.
  function stepComets() {
    const SUBSTEPS = 4;
    const h = 1 / SUBSTEPS;
    const positions = PLANETS.map((p, i) => planetPos3D(p, i));
    const survivors = [];
    for (const c of comets) {
      let alive = true;
      for (let s = 0; s < SUBSTEPS; s++) {
        const r2 = c.x * c.x + c.z * c.z;
        const r = Math.sqrt(r2);
        if (r < SUN.r) { alive = false; sunFlash = 12; break; }   // fell into the Sun
        const a = GM / r2;                 // acceleration magnitude (inverse square)
        c.vx += a * (-c.x / r) * h;
        c.vz += a * (-c.z / r) * h;
        c.x += c.vx * h;
        c.z += c.vz * h;
      }
      if (!alive) continue;
      // Splat on any planet in the way (full 3D distance — inclined planets
      // can dodge above or below a comet!)
      for (let i = 0; i < PLANETS.length; i++) {
        const w = positions[i];
        const ddx = c.x - w.wx, ddy = -w.wy, ddz = c.z - w.wz;
        const hitR = PLANETS[i].r + 3;
        if (ddx * ddx + ddy * ddy + ddz * ddz < hitR * hitR) {
          alive = false;
          impacts.push({ wx: w.wx, wy: w.wy, wz: w.wz, r: PLANETS[i].r, life: 0 });
          break;
        }
      }
      if (!alive) continue;
      // Drop comets that fly far away
      if (Math.abs(c.x) > 2600 || Math.abs(c.z) > 2600) continue;
      c.trail.push({ x: c.x, z: c.z });
      if (c.trail.length > 80) c.trail.shift();
      survivors.push(c);
    }
    comets = survivors;
  }

  function drawImpacts() {
    impacts = impacts.filter(im => im.life < 20);
    for (const im of impacts) {
      im.life++;
      const k = im.life / 20;
      const scr = project(im.wx, im.wy, im.wz);
      ctx.strokeStyle = `rgba(255,210,120,${1 - k})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, im.r * scr.s + 4 + k * 16, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawComets() {
    // Trails (projected from world space each frame, so they bend correctly
    // when you rotate the view)
    for (const c of comets) {
      if (c.trail.length > 1) {
        let prev = project(c.trail[0].x, 0, c.trail[0].z);
        for (let i = 1; i < c.trail.length; i++) {
          const pt = project(c.trail[i].x, 0, c.trail[i].z);
          const a = i / c.trail.length;
          ctx.strokeStyle = `rgba(140,200,255,${a * 0.5})`;
          ctx.lineWidth = a * 2;
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(pt.x, pt.y);
          ctx.stroke();
          prev = pt;
        }
      }
    }
    // Heads + sun-pointing tails
    for (const c of comets) {
      const head = project(c.x, 0, c.z);
      const d = Math.hypot(c.x, c.z) || 1;
      const tailLen = 18 + 1200 / d; // longer tail when closer to the Sun
      const tip = project(c.x + (c.x / d) * tailLen, 0, c.z + (c.z / d) * tailLen);
      const tg = ctx.createLinearGradient(head.x, head.y, tip.x, tip.y);
      tg.addColorStop(0, 'rgba(160,220,255,0.8)');
      tg.addColorStop(1, 'rgba(160,220,255,0)');
      ctx.strokeStyle = tg;
      ctx.lineWidth = Math.max(1.5, 3 * head.s);
      ctx.beginPath();
      ctx.moveTo(head.x, head.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.stroke();
      // Nucleus
      ctx.fillStyle = '#dff1ff';
      ctx.beginPath();
      ctx.arc(head.x, head.y, Math.max(1.5, 3 * head.s), 0, Math.PI * 2);
      ctx.fill();
    }
    // Aiming arrow while dragging (lives on the ecliptic plane)
    if (aiming) {
      const a0 = project(aiming.x0, 0, aiming.z0);
      const a1 = project(aiming.x1, 0, aiming.z1);
      ctx.strokeStyle = '#6bd1ff';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(a0.x, a0.y);
      ctx.lineTo(a1.x, a1.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Launch point
      ctx.fillStyle = '#dff1ff';
      ctx.beginPath();
      ctx.arc(a0.x, a0.y, 4, 0, Math.PI * 2);
      ctx.fill();
      // Arrowhead
      const ang = Math.atan2(a1.y - a0.y, a1.x - a0.x);
      ctx.fillStyle = '#6bd1ff';
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y);
      ctx.lineTo(a1.x - 8 * Math.cos(ang - 0.4), a1.y - 8 * Math.sin(ang - 0.4));
      ctx.lineTo(a1.x - 8 * Math.cos(ang + 0.4), a1.y - 8 * Math.sin(ang + 0.4));
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- Interaction ----
  function getPlanetAt(mx, my) {
    // Sun (use cached screen position so it works in compare mode too)
    const sdx = mx - sunScreenPos.x, sdy = my - sunScreenPos.y;
    const sR = sunScreenPos.r + 4;
    if (sdx * sdx + sdy * sdy <= sR * sR) {
      return { type: 'sun' };
    }
    for (let i = 0; i < PLANETS.length; i++) {
      const sp = screenPos[i];
      if (!sp) continue;
      const dx = mx - sp.x, dy = my - sp.y;
      const hit = Math.max(sp.r + 5, 8); // generous hit area for tiny Mercury/Mars
      if (dx * dx + dy * dy <= hit * hit) {
        return { type: 'planet', index: i, planet: PLANETS[i], pos: sp };
      }
    }
    return null;
  }

  function selectBody(body) {
    if (!body) {
      selected = null;
      panel.innerHTML = '<div class="placeholder">Click a planet to see its info.</div>';
      return;
    }
    if (body.type === 'sun') {
      selected = SUN;
      renderPanel(SUN, true);
    } else {
      selected = body.planet;
      renderPanel(body.planet, false);
    }
  }

  function renderPanel(p, isSun) {
    let stats;
    if (isSun) {
      stats = [
        ['DIAMETER',     formatNum(p.diameterKm) + ' km (~109 Earths)'],
        ['SURFACE TEMP', '~5,500°C (15,000,000°C core)'],
        ['MADE OF',      'Hydrogen (73%) & helium (25%)'],
        ['GRAVITY',      p.gravityG + '× Earth'],
        ['YOU’D WEIGH', `${Math.round(KID_KG * p.gravityG)} kg (from ${KID_KG} kg)`],
        ['AGE',          p.ageBy + ' billion years'],
      ];
    } else {
      const ex = EXTRA[p.name] || {};
      const yearText = p.periodDays < 1000 ? `${p.periodDays} Earth days`
                                           : `${(p.periodDays / 365).toFixed(1)} Earth years`;
      const dayText = p.dayHours < 100 ? `${p.dayHours} hrs`
                                       : `${(p.dayHours / 24).toFixed(0)} Earth days`;
      const weighKg = (KID_KG * p.gravityG).toFixed(1);
      const lightMin = p.orbitAU * 8.317;
      stats = [
        ['DISTANCE FROM SUN', `${p.orbitAU} AU (${formatNum(Math.round(p.orbitAU * 149.6))} mil km)`],
        ['SUNLIGHT TAKES',    `${lightMin < 10 ? lightMin.toFixed(1) : Math.round(lightMin)} min to get there`],
        ['YEAR LENGTH',       yearText],
        ['DAY LENGTH',        dayText],
        ['DIAMETER',          formatNum(p.diameterKm) + ' km'],
        ['TEMPERATURE',       ex.tempC || '—'],
        ['MADE OF',           ex.madeOf || '—'],
        ['ORBITAL SPEED',     ex.orbitKmS ? `${ex.orbitKmS} km/s around the Sun` : '—'],
        ['ORBIT TILT',        `${p.inclDeg}° vs. Earth's orbit`],
        ['GRAVITY',           p.gravityG + '× Earth'],
        ['YOU’D WEIGH',  `${weighKg} kg (from ${KID_KG} kg)`],
        ['MOONS',             p.moons],
      ];
    }
    panel.innerHTML = `
      <h2>${p.name}</h2>
      <div class="ptype">${p.type.toUpperCase()}</div>
      <div class="stats">
        ${stats.map(s => `<div><span class="k">${s[0]}:</span> <span class="v">${s[1]}</span></div>`).join('')}
      </div>
      <div class="fact">${p.fact}</div>
    `;
  }

  function formatNum(n) {
    return n.toLocaleString('en-US');
  }

  function canvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height),
    };
  }

  function launchComet(aim) {
    // Drag length sets speed; direction is the throw direction.
    const VEL_SCALE = 0.05;
    comets.push({
      x: aim.x0, z: aim.z0,
      vx: (aim.x1 - aim.x0) * VEL_SCALE,
      vz: (aim.z1 - aim.z0) * VEL_SCALE,
      trail: [],
    });
    if (comets.length > 12) comets.shift(); // keep it light
  }

  // ---- Mouse: rotate the camera, aim comets, select planets ----
  let viewDrag = null;       // { sx, sy, yaw0, pitch0, moved }
  let suppressClick = false; // swallow the click that ends a view-drag

  canvas.addEventListener('mousedown', e => {
    if (mode !== 'orbit') return;
    const { x, y } = canvasCoords(e.clientX, e.clientY);
    if (cometMode) {
      const w = screenToPlane(x, y);
      if (w) aiming = { x0: w.x, z0: w.z, x1: w.x, z1: w.z };
    } else {
      viewDrag = { sx: x, sy: y, yaw0: cam.yaw, pitch0: cam.pitch, moved: false };
    }
  });

  window.addEventListener('mouseup', e => {
    if (aiming) {
      const { x, y } = canvasCoords(e.clientX, e.clientY);
      const w = screenToPlane(x, y);
      if (w) { aiming.x1 = w.x; aiming.z1 = w.z; }
      if (Math.hypot(aiming.x1 - aiming.x0, aiming.z1 - aiming.z0) > 6) {
        launchComet(aiming);
      }
      aiming = null;
    }
    if (viewDrag) {
      if (viewDrag.moved) suppressClick = true;
      viewDrag = null;
      canvas.style.cursor = cometMode ? 'crosshair' : 'grab';
    }
  });

  canvas.addEventListener('mousemove', e => {
    const { x: mx, y: my } = canvasCoords(e.clientX, e.clientY);
    if (aiming) {
      const w = screenToPlane(mx, my);
      if (w) { aiming.x1 = w.x; aiming.z1 = w.z; }
      return;
    }
    if (viewDrag) {
      const dx = mx - viewDrag.sx, dy = my - viewDrag.sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) viewDrag.moved = true;
      cam.yaw = viewDrag.yaw0 + dx * 0.006;
      cam.pitch = clamp(viewDrag.pitch0 + dy * 0.006, MIN_PITCH, MAX_PITCH);
      hideTip();
      canvas.style.cursor = 'grabbing';
      return;
    }
    const hit = getPlanetAt(mx, my);
    hoverIndex = -1;
    hoverSun = false;
    if (hit) {
      if (hit.type === 'sun') {
        hoverSun = true;
        showTip('Sun', e.clientX, e.clientY);
      } else {
        hoverIndex = hit.index;
        showTip(hit.planet.name, e.clientX, e.clientY);
      }
      canvas.style.cursor = 'pointer';
    } else {
      hideTip();
      canvas.style.cursor = cometMode ? 'crosshair' : (mode === 'orbit' ? 'grab' : 'default');
    }
  });

  canvas.addEventListener('mouseleave', () => {
    hoverIndex = -1;
    hoverSun = false;
    hideTip();
  });

  canvas.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    if (cometMode) return; // canvas is for launching comets in this mode
    const { x: mx, y: my } = canvasCoords(e.clientX, e.clientY);
    const hit = getPlanetAt(mx, my);

    if (quiz && hit && hit.type === 'planet') {
      handleQuizAnswer(hit.index);
      // also show the info for the selected planet
      selectBody(hit);
      return;
    }
    if (hit) selectBody(hit);
  });

  canvas.addEventListener('wheel', e => {
    if (mode !== 'orbit') return;
    e.preventDefault();
    cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), MIN_DIST, MAX_DIST);
  }, { passive: false });

  // ---- Touch: one finger rotates (or aims comets), pinch zooms, tap selects ----
  let touchState = null;

  function touchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.hypot(dx, dy) || 1;
  }

  canvas.addEventListener('touchstart', e => {
    if (mode !== 'orbit') return;
    e.preventDefault();
    if (e.touches.length >= 2) {
      aiming = null;
      touchState = { kind: 'pinch', d0: touchDist(e), dist0: cam.dist };
      return;
    }
    const t0 = e.touches[0];
    const { x, y } = canvasCoords(t0.clientX, t0.clientY);
    if (cometMode) {
      const w = screenToPlane(x, y);
      if (w) {
        aiming = { x0: w.x, z0: w.z, x1: w.x, z1: w.z };
        touchState = { kind: 'aim' };
      }
    } else {
      touchState = { kind: 'rotate', sx: x, sy: y, yaw0: cam.yaw, pitch0: cam.pitch, moved: false };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (!touchState) return;
    e.preventDefault();
    if (touchState.kind === 'pinch' && e.touches.length >= 2) {
      cam.dist = clamp(touchState.dist0 * (touchState.d0 / touchDist(e)), MIN_DIST, MAX_DIST);
      return;
    }
    const t0 = e.touches[0];
    if (!t0) return;
    const { x, y } = canvasCoords(t0.clientX, t0.clientY);
    if (touchState.kind === 'aim' && aiming) {
      const w = screenToPlane(x, y);
      if (w) { aiming.x1 = w.x; aiming.z1 = w.z; }
    } else if (touchState.kind === 'rotate') {
      const dx = x - touchState.sx, dy = y - touchState.sy;
      if (Math.abs(dx) + Math.abs(dy) > 6) touchState.moved = true;
      cam.yaw = touchState.yaw0 + dx * 0.006;
      cam.pitch = clamp(touchState.pitch0 + dy * 0.006, MIN_PITCH, MAX_PITCH);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (!touchState) return;
    e.preventDefault();
    if (touchState.kind === 'aim' && aiming) {
      if (Math.hypot(aiming.x1 - aiming.x0, aiming.z1 - aiming.z0) > 6) {
        launchComet(aiming);
      }
      aiming = null;
    } else if (touchState.kind === 'rotate' && !touchState.moved) {
      // A tap: treat it like a click (select / answer quiz)
      const hit = getPlanetAt(touchState.sx, touchState.sy);
      if (quiz && hit && hit.type === 'planet') {
        handleQuizAnswer(hit.index);
        selectBody(hit);
      } else if (hit) {
        selectBody(hit);
      }
    }
    touchState = null;
  }, { passive: false });

  function showTip(text, x, y) {
    tooltip.textContent = text;
    tooltip.style.left = (x + 14) + 'px';
    tooltip.style.top  = (y + 14) + 'px';
    tooltip.classList.add('show');
  }
  function hideTip() { tooltip.classList.remove('show'); }

  // ---- Controls ----
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'PLAY' : 'PAUSE';
    pauseBtn.classList.toggle('active', paused);
  });

  document.querySelectorAll('button[data-speed]').forEach(b => {
    b.addEventListener('click', () => {
      speed = parseFloat(b.dataset.speed);
      document.querySelectorAll('button[data-speed]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  viewBtn.addEventListener('click', () => {
    cam = { ...DEFAULT_CAM };
  });

  scaleBtn.addEventListener('click', () => {
    realScale = !realScale;
    scaleBtn.textContent = realScale ? 'SHOW COMPRESSED' : 'SHOW REAL DISTANCES';
    scaleBtn.classList.toggle('active', realScale);
  });

  const labelBtn = document.getElementById('labelBtn');
  labelBtn.addEventListener('click', () => {
    showLabels = !showLabels;
    labelBtn.textContent = showLabels ? 'HIDE NAMES' : 'SHOW NAMES';
    labelBtn.classList.toggle('active', showLabels);
  });

  compareBtn.addEventListener('click', () => {
    mode = mode === 'compare' ? 'orbit' : 'compare';
    compareBtn.textContent = mode === 'compare' ? 'BACK TO ORBITS' : 'SIZE COMPARE';
    compareBtn.classList.toggle('active', mode === 'compare');
    // Hide controls that only make sense in orbit view
    scaleBtn.style.display = mode === 'compare' ? 'none' : '';
    viewBtn.style.display = mode === 'compare' ? 'none' : '';
    canvas.style.cursor = mode === 'compare' ? 'default' : 'grab';
    if (mode === 'compare' && cometMode) stopComet(); // comets only make sense in orbit view
  });

  function startComet() {
    if (quiz) stopQuiz();
    cometMode = true;
    canvas.style.cursor = 'crosshair';
    cometBtn.textContent = 'STOP COMETS';
    cometBtn.classList.add('active');
    questionBar.className = 'show';
    questionBar.textContent = 'Drag and release to fling a comet — the Sun\'s gravity does the rest! (Stop comets to spin the view again.)';
  }

  function stopComet() {
    cometMode = false;
    comets = [];
    aiming = null;
    canvas.style.cursor = 'grab';
    cometBtn.textContent = 'LAUNCH COMET';
    cometBtn.classList.remove('active');
    questionBar.classList.remove('show');
    questionBar.textContent = '';
  }

  cometBtn.addEventListener('click', () => {
    if (cometMode) stopComet();
    else startComet();
  });

  // ---- Quiz ----
  const QUIZ_QUESTIONS = [
    { test: p => p.name === 'Jupiter',  q: 'Click the largest planet in the solar system' },
    { test: p => p.name === 'Mercury',  q: 'Click the planet closest to the Sun' },
    { test: p => p.name === 'Saturn',   q: 'Click the planet famous for its rings' },
    { test: p => p.name === 'Mars',     q: 'Click the Red Planet' },
    { test: p => p.name === 'Venus',    q: 'Click the hottest planet' },
    { test: p => p.name === 'Earth',    q: 'Click the only planet known to have life' },
    { test: p => p.name === 'Neptune',  q: 'Click the farthest true planet from the Sun (dwarf planets don\'t count!)' },
    { test: p => p.name === 'Uranus',   q: 'Click the planet that is tipped on its side' },
    { test: p => p.name === 'Mercury',  q: 'Click the smallest true planet (dwarf planets don\'t count!)' },
    { test: p => p.name === 'Jupiter',  q: 'Click the planet with the Great Red Spot' },
    { test: p => p.moons === 1,         q: 'Click the planet with exactly one moon' },
    { test: p => p.name === 'Mars',     q: 'Click the planet with Olympus Mons (the biggest volcano)' },
    { test: p => p.name === 'Pluto',    q: 'Click the dwarf planet that used to be planet #9' },
    { test: p => p.name === 'Saturn',   q: 'Click the planet with the most moons (146!)' },
    { test: p => p.name === 'Neptune',  q: 'Click the windiest planet' },
    { test: p => p.name === 'Saturn',   q: 'Click the planet so light it would float in water' },
    { test: p => p.name === 'Venus',    q: 'Click the planet that spins backward' },
    { test: p => p.name === 'Pluto',    q: 'Click the body with the most tilted orbit (spin the view to see it!)' },
  ];

  function startQuiz() {
    if (cometMode) stopComet();
    quiz = {
      score: 0,
      best: parseInt(localStorage.getItem(QUIZ_BEST_KEY) || '0', 10),
      asked: [],
    };
    nextQuestion();
    quizBtn.textContent = 'STOP QUIZ';
    quizBtn.classList.add('active');
  }

  function stopQuiz() {
    quiz = null;
    questionBar.classList.remove('show', 'right', 'wrong');
    questionBar.textContent = '';
    quizBtn.textContent = 'QUIZ ME';
    quizBtn.classList.remove('active');
  }

  function nextQuestion() {
    // Pick a question we haven't just asked
    let pool = QUIZ_QUESTIONS.filter(q => !quiz.asked.slice(-4).includes(q));
    if (pool.length === 0) pool = QUIZ_QUESTIONS;
    const q = pool[Math.floor(Math.random() * pool.length)];
    quiz.asked.push(q);
    quiz.current = q;
    quiz.targetIndex = PLANETS.findIndex(p => q.test(p));
    questionBar.className = 'show';
    questionBar.textContent = `${q.q}  —  Score: ${quiz.score}  Best: ${quiz.best}`;
  }

  function handleQuizAnswer(planetIndex) {
    if (!quiz) return;
    const correct = quiz.current.test(PLANETS[planetIndex]);
    if (correct) {
      quiz.score++;
      if (quiz.score > quiz.best) {
        quiz.best = quiz.score;
        localStorage.setItem(QUIZ_BEST_KEY, quiz.best);
      }
      quizFlash = 30;
      questionBar.className = 'show right';
      questionBar.textContent = `✓ Correct!  Score: ${quiz.score}  Best: ${quiz.best}`;
      setTimeout(nextQuestion, 1100);
    } else {
      quizFlash = -30;
      questionBar.className = 'show wrong';
      const correctName = PLANETS[quiz.targetIndex].name;
      questionBar.textContent = `✗ Nope — that was ${PLANETS[planetIndex].name}. Answer: ${correctName}.  Score reset.`;
      quiz.score = 0;
      setTimeout(nextQuestion, 1800);
    }
  }

  quizBtn.addEventListener('click', () => {
    if (quiz) stopQuiz();
    else startQuiz();
  });

  requestAnimationFrame(loop);
</script>
</body>
</html>
