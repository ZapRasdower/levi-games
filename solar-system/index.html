<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Explorer - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #04040c;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    /* The sim fills the whole screen; all chrome floats above it. */
    #gameCanvas {
      position: fixed;
      inset: 0;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 10px 16px 26px;
      pointer-events: none;
      background: linear-gradient(rgba(4,4,12,0.9), rgba(4,4,12,0));
    }

    h1 {
      font-size: 1.15rem;
      color: #ffe600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255,230,0,0.35);
    }

    .subtitle { color: #8a93b0; font-size: 0.72rem; letter-spacing: 1px; }
    @media (max-width: 760px) { .subtitle { display: none; } }

    .back-link {
      position: fixed;
      top: 12px; right: 14px;
      z-index: 6;
      color: #667;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 2px;
    }
    .back-link:hover { color: #ffe600; }

    #questionBar {
      position: fixed;
      top: 44px; left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      max-width: min(720px, 92vw);
      padding: 8px 14px;
      background: rgba(26,26,46,0.92);
      border: 2px solid #ffe60055;
      border-radius: 8px;
      color: #ffe600;
      font-size: 0.9rem;
      letter-spacing: 1px;
      text-align: center;
      display: none;
      backdrop-filter: blur(4px);
    }

    #questionBar.show { display: block; }
    #questionBar.right { border-color: #6bffd1; color: #6bffd1; }
    #questionBar.wrong { border-color: #ff6b6b; color: #ff6b6b; }

    /* Bottom toolbar: grouped controls over the sim */
    #toolbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 9; /* above the info drawer so controls always stay clickable */
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
      padding: 26px 10px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(rgba(4,4,12,0), rgba(4,4,12,0.92) 55%);
      pointer-events: none;
    }

    .tgroup {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      background: rgba(14,14,28,0.78);
      border: 1px solid #23233a;
      border-radius: 10px;
      padding: 5px 6px;
      pointer-events: auto;
      backdrop-filter: blur(5px);
    }

    button {
      background: #16162c;
      color: #ffe600;
      border: 1px solid #33334d;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: border-color 0.12s, box-shadow 0.12s;
    }

    button:hover { border-color: #ffe600; box-shadow: 0 0 10px rgba(255,230,0,0.25); }
    button.active { background: #2a2a4a; border-color: #ffe600; box-shadow: 0 0 10px rgba(255,230,0,0.3); }

    .sliderWrap {
      display: none;
      align-items: center;
      gap: 6px;
      color: #8ac6ff;
      font-size: 0.7rem;
      letter-spacing: 1px;
      padding: 0 4px;
    }
    .sliderWrap.show { display: flex; }
    input[type=range] { width: 110px; accent-color: #ffe600; cursor: pointer; }

    /* Info drawer: slides in from the right (bottom sheet on phones) */
    #panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 350px;
      max-width: 90vw;
      z-index: 8;
      background: rgba(10,10,24,0.95);
      border-left: 2px solid #2a2a44;
      padding: 20px 18px 26px;
      overflow-y: auto;
      transform: translateX(105%);
      transition: transform 0.25s ease;
      backdrop-filter: blur(8px);
    }
    #panel.open { transform: none; box-shadow: -12px 0 40px rgba(0,0,0,0.55); }

    @media (max-width: 760px) {
      #panel {
        top: auto; left: 0; right: 0; bottom: 0;
        width: auto; max-width: none;
        max-height: 54vh;
        border-left: none;
        border-top: 2px solid #2a2a44;
        border-radius: 14px 14px 0 0;
        transform: translateY(108%);
        z-index: 10; /* the bottom sheet covers the toolbar; close it to get controls back */
      }
    }

    #panelClose {
      position: absolute;
      top: 10px; right: 10px;
      padding: 4px 9px;
      color: #aaa;
    }

    #panel h2 {
      color: #ffe600;
      font-size: 1.35rem;
      letter-spacing: 2px;
      margin-bottom: 4px;
      padding-right: 34px;
    }

    #panel .ptype {
      color: #888;
      font-size: 0.72rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    #panel .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      margin-bottom: 10px;
      font-size: 0.84rem;
    }
    @media (max-width: 760px) {
      #panel .stats { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    }

    #panel .stats .k { color: #888; letter-spacing: 1px; }
    #panel .stats .v { color: #fff; }

    #panel .fact {
      color: #ccc;
      font-size: 0.88rem;
      line-height: 1.5;
      border-left: 3px solid #ffe600;
      padding-left: 10px;
      margin-top: 10px;
    }

    #panel .panelBtns { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }

    #muteBtn {
      position: fixed;
      top: 6px; right: 104px;
      z-index: 6;
      padding: 3px 8px;
      font-size: 0.85rem;
      line-height: 1;
    }
    @media (max-width: 760px) {
      #muteBtn { right: 110px; top: 8px; }
      #questionBar { font-size: 0.78rem; padding: 6px 10px; }
      #questionBar .mline { font-size: 0.66rem; }
    }

    #questionBar.mission { border-color: #6bd1ff; color: #dff1ff; }
    #questionBar .mline { display: block; font-size: 0.72rem; color: #8ac6ff; margin-top: 3px; letter-spacing: 0; }

    .mission {
      border: 1px solid #2a2a44;
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 7px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      background: rgba(255,255,255,0.02);
    }
    .mission:hover { border-color: #6bd1ff88; background: rgba(107,209,255,0.06); }
    .mission.current { border-color: #6bd1ff; background: rgba(107,209,255,0.1); }
    .mission .mname { color: #dff1ff; font-size: 0.82rem; letter-spacing: 1px; display: flex; justify-content: space-between; }
    .mission .mname .stars { color: #ffe600; letter-spacing: 0; }
    .mission .mname .stars.none { color: #444; }
    .mission .mbrief { color: #99a; font-size: 0.74rem; margin-top: 4px; line-height: 1.4; }
    .mission .mtip { color: #6bd1ff; font-size: 0.72rem; margin-top: 6px; line-height: 1.4; border-left: 2px solid #6bd1ff55; padding-left: 8px; display: none; }
    .mission.current .mtip { display: block; }
    .mission .mcap { color: #ff9f6b; font-size: 0.68rem; margin-top: 4px; letter-spacing: 1px; }
    #panel .mhead { color: #6bd1ff; font-size: 0.72rem; letter-spacing: 2px; margin: 4px 0 10px; }
    #panel .mtotal { color: #888; font-size: 0.72rem; margin-top: 10px; text-align: center; letter-spacing: 1px; }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: #1a1a2e;
      border: 2px solid #ffe600;
      border-radius: 6px;
      color: #ffe600;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      letter-spacing: 1px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.1s;
    }

    #tooltip.show { opacity: 1; }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <h1>&#128640; Solar System</h1>
    <span class="subtitle">drag to spin in 3D &middot; scroll to zoom &middot; click a planet to learn &middot; fly missions &middot; launch comets &middot; quiz yourself</span>
  </div>
  <a class="back-link" href="../index.html">&larr; all games</a>
  <button id="muteBtn" title="toggle sound (S)">&#128266;</button>

  <div id="questionBar"></div>

  <div id="toolbar">
    <div class="tgroup">
      <button id="pauseBtn" title="pause / play">&#9208;</button>
      <button data-speed="0.5">0.5&times;</button>
      <button data-speed="1" class="active">1&times;</button>
      <button data-speed="5">5&times;</button>
      <button data-speed="20">20&times;</button>
    </div>
    <div class="tgroup orbitOnly">
      <button id="viewBtn">RESET VIEW</button>
      <button id="scaleBtn">REAL DISTANCES</button>
      <button id="labelBtn">NAMES</button>
      <button id="trailBtn">TRAILS</button>
    </div>
    <div class="tgroup orbitOnly">
      <button id="cometBtn">&#9732; COMETS</button>
      <span class="sliderWrap" id="gravWrap">SUN GRAVITY
        <input type="range" id="gravSlider" min="25" max="400" value="100">
        <span id="gravVal">1.0&times;</span>
      </span>
    </div>
    <div class="tgroup">
      <button id="compareBtn">SIZES</button>
      <button id="gravityBtn">GRAVITY LAB</button>
      <button id="graphBtn">SPEED GRAPH</button>
      <button id="missionBtn">&#128640; MISSIONS</button>
      <button id="quizBtn">QUIZ ME</button>
      <span class="sliderWrap" id="weightWrap">YOUR MASS
        <input type="range" id="weightSlider" min="20" max="100" value="30">
        <span id="weightVal">30 kg</span>
      </span>
    </div>
  </div>

  <div id="panel">
    <button id="panelClose">&#10005;</button>
    <div id="panelBody"></div>
  </div>

  <div id="tooltip"></div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 720, H = 500, cx = 360, cy = 250; // updated by resizeCanvas()
  const tooltip = document.getElementById('tooltip');
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panelBody');
  const panelClose = document.getElementById('panelClose');
  const questionBar = document.getElementById('questionBar');
  const pauseBtn = document.getElementById('pauseBtn');
  const viewBtn = document.getElementById('viewBtn');
  const scaleBtn = document.getElementById('scaleBtn');
  const compareBtn = document.getElementById('compareBtn');
  const cometBtn = document.getElementById('cometBtn');
  const quizBtn = document.getElementById('quizBtn');
  const gravityBtn = document.getElementById('gravityBtn');
  const graphBtn = document.getElementById('graphBtn');
  const trailBtn = document.getElementById('trailBtn');
  const gravWrap = document.getElementById('gravWrap');
  const gravSlider = document.getElementById('gravSlider');
  const gravVal = document.getElementById('gravVal');
  const weightWrap = document.getElementById('weightWrap');
  const weightSlider = document.getElementById('weightSlider');
  const weightVal = document.getElementById('weightVal');

  const QUIZ_BEST_KEY = 'solarSystem.quizBest';
  const MISSIONS_KEY = 'solarSystem.missions';
  const MUTE_KEY = 'solarSystem.muted';

  // ---- Sound (tiny WebAudio synth — same helper as the other games) ----
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  let audio = null;
  function ac() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  function beep(freq, dur, type = 'sine', vol = 0.06, slide = 0) {
    if (muted) return;
    try {
      const a = ac();
      const o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    } catch (e) { /* audio blocked — stay silent */ }
  }
  const sfx = {
    click()   { beep(900, 0.04, 'triangle', 0.03); },
    select()  { beep(660, 0.06, 'triangle', 0.04); setTimeout(() => beep(990, 0.07, 'triangle', 0.035), 50); },
    launch()  { beep(240, 0.35, 'sawtooth', 0.05, 700); },
    impact()  { beep(120, 0.22, 'square', 0.06, -80); },
    sun()     { beep(600, 0.4, 'sawtooth', 0.05, -520); },
    lost()    { beep(300, 0.3, 'sine', 0.04, -200); },
    right()   { beep(784, 0.1, 'triangle', 0.05); setTimeout(() => beep(1046, 0.14, 'triangle', 0.05), 90); },
    wrong()   { beep(220, 0.25, 'square', 0.045, -90); },
    win()     { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.06), i * 110)); },
    best()    { beep(660, 0.1); setTimeout(() => beep(880, 0.12), 90); setTimeout(() => beep(1108, 0.18), 200); },
  };
  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    refreshMute(); muteBtn.blur();
  });
  refreshMute();

  // Real-ish data; orbit radius & display radius are tuned for visibility.
  // periodDays = real Earth days for one orbit.
  // orbitAU = real semi-major axis (used in real-scale mode).
  // compressedR = world units in compressed mode.
  // inclDeg = real orbital inclination vs. the ecliptic (gives true 3D orbits;
  //           look how tilted Pluto's path is when you spin the view!).
  const PLANETS = [
    {
      name: 'Mercury', type: 'Terrestrial planet',
      color: '#a89074', accent: '#7a6452',
      r: 4, compressedR: 60, orbitAU: 0.39, periodDays: 88, inclDeg: 7.0,
      diameterKm: 4879, gravityG: 0.38, moons: 0, dayHours: 4222.6,
      fact: 'Mercury is the smallest planet and the closest to the Sun. Days are longer than years here — one Mercury day takes about 176 Earth days, but a year is just 88!'
    },
    {
      name: 'Venus', type: 'Terrestrial planet',
      color: '#e6c074', accent: '#a88a40',
      r: 7, compressedR: 90, orbitAU: 0.72, periodDays: 225, inclDeg: 3.4,
      diameterKm: 12104, gravityG: 0.91, moons: 0, dayHours: 2802,
      fact: 'Venus is the hottest planet (about 465°C / 870°F) because of a thick CO₂ atmosphere — even though Mercury is closer to the Sun. It also spins backward!'
    },
    {
      name: 'Earth', type: 'Our home planet',
      color: '#5aa0e6', accent: '#3a6da0',
      r: 7, compressedR: 125, orbitAU: 1.00, periodDays: 365, inclDeg: 0,
      diameterKm: 12742, gravityG: 1.00, moons: 1, dayHours: 24,
      fact: "Earth is the only place we've ever found life. About 71% of its surface is covered in liquid water, and its magnetic field protects us from harmful solar radiation.",
      sats: [{ d: 9, r: 2.2, spd: 0.22, col: '#bbbbbb' }]  // the Moon
    },
    {
      name: 'Mars', type: 'Terrestrial planet',
      color: '#d76b3a', accent: '#8a3a1a',
      r: 5, compressedR: 160, orbitAU: 1.52, periodDays: 687, inclDeg: 1.9,
      diameterKm: 6779, gravityG: 0.38, moons: 2, dayHours: 24.6,
      fact: 'Mars has the largest volcano in the solar system — Olympus Mons — about 22 km tall, almost 3× higher than Mount Everest. Its red color comes from rusty iron in the soil.',
      sats: [{ d: 5, r: 1, spd: 0.9, col: '#a08878' }, { d: 8, r: 0.8, spd: 0.45, col: '#a08878' }]  // Phobos & Deimos
    },
    {
      name: 'Jupiter', type: 'Gas giant',
      color: '#d4a06a', accent: '#8a6038',
      r: 22, compressedR: 220, orbitAU: 5.20, periodDays: 4333, inclDeg: 1.3,
      diameterKm: 139820, gravityG: 2.53, moons: 95, dayHours: 9.9,
      fact: 'Jupiter is so big that more than 1,300 Earths could fit inside it. The Great Red Spot is a giant storm that has been raging for at least 400 years.',
      bands: true,
      // The four Galilean moons — Io, Europa, Ganymede, Callisto
      sats: [{ d: 6, r: 1.3, spd: 0.6, col: '#e8d890' }, { d: 9, r: 1.1, spd: 0.4, col: '#d8d8d0' },
             { d: 12.5, r: 1.7, spd: 0.28, col: '#b0a890' }, { d: 16.5, r: 1.5, spd: 0.18, col: '#807060' }]
    },
    {
      name: 'Saturn', type: 'Gas giant',
      color: '#e6d39a', accent: '#a8945a',
      r: 18, compressedR: 280, orbitAU: 9.58, periodDays: 10759, inclDeg: 2.5,
      diameterKm: 116460, gravityG: 1.07, moons: 146, dayHours: 10.7,
      fact: "Saturn's rings are made of billions of chunks of ice and rock, some as small as dust grains and others as big as a house. Saturn is so light it would float in water!",
      rings: true,
      sats: [{ d: 26, r: 1.6, spd: 0.14, col: '#d8b070' }]  // Titan, beyond the rings
    },
    {
      name: 'Uranus', type: 'Ice giant',
      color: '#9adfe6', accent: '#5a96a0',
      r: 12, compressedR: 330, orbitAU: 19.22, periodDays: 30687, inclDeg: 0.8,
      diameterKm: 50724, gravityG: 0.89, moons: 27, dayHours: 17.2,
      fact: 'Uranus is tipped on its side! It rotates almost completely sideways compared to other planets, so its poles take turns facing the Sun for 42 years at a time.',
      thinRings: true
    },
    {
      name: 'Neptune', type: 'Ice giant',
      color: '#3a6dd0', accent: '#1a3a8a',
      r: 12, compressedR: 380, orbitAU: 30.05, periodDays: 60190, inclDeg: 1.8,
      diameterKm: 49244, gravityG: 1.14, moons: 14, dayHours: 16.1,
      fact: 'Neptune has the fastest winds in the solar system — over 2,000 km/h, faster than the speed of sound on Earth. It was the first planet found by math before being seen.'
    },
    {
      name: 'Pluto', type: 'Dwarf planet',
      color: '#d9c2a7', accent: '#9a7f63',
      r: 3, compressedR: 412, orbitAU: 39.5, periodDays: 90560, inclDeg: 17.2,
      diameterKm: 2376, gravityG: 0.06, moons: 5, dayHours: 153.3,
      dwarf: true,
      fact: 'Pluto was counted as the 9th planet until 2006, when it was reclassified as a dwarf planet. It has a giant heart-shaped nitrogen glacier, and its biggest moon Charon is half its size!'
    }
  ];

  const SUN = {
    name: 'Sun', type: 'Yellow dwarf star',
    color: '#ffe066', accent: '#ff8a00',
    r: 26,
    diameterKm: 1391000, gravityG: 28, moons: 0, ageBy: 4.6,
    fact: "The Sun is a star — a giant ball of mostly hydrogen and helium. It contains 99.86% of all the mass in the solar system, and every second it converts about 600 million tonnes of hydrogen into helium."
  };

  // Extra educational data keyed by planet name (temperature, composition,
  // and orbital speed in km/s — note how the inner planets race around the
  // Sun far faster than the outer ones, a real consequence of gravity).
  const EXTRA = {
    Mercury: { tempC: '167°C avg (430° day / −180° night)', madeOf: 'Rock & metal core',     orbitKmS: 47.4 },
    Venus:   { tempC: '465°C — the hottest planet',         madeOf: 'Rock, thick CO₂ air',   orbitKmS: 35.0 },
    Earth:   { tempC: '15°C average',                       madeOf: 'Rock, water & air',     orbitKmS: 29.8 },
    Mars:    { tempC: '−65°C average',                      madeOf: 'Rock & rusty iron dust',orbitKmS: 24.1 },
    Jupiter: { tempC: '−110°C at the cloud tops',           madeOf: 'Hydrogen & helium gas', orbitKmS: 13.1 },
    Saturn:  { tempC: '−140°C at the cloud tops',           madeOf: 'Hydrogen & helium gas', orbitKmS: 9.7 },
    Uranus:  { tempC: '−195°C',                             madeOf: 'Icy water, methane, ammonia', orbitKmS: 6.8 },
    Neptune: { tempC: '−200°C',                             madeOf: 'Icy water, methane, ammonia', orbitKmS: 5.4 },
    Pluto:   { tempC: '−230°C',                             madeOf: 'Nitrogen ice & rock',   orbitKmS: 4.7 },
  };
  let userKg = 30; // adjustable with the YOUR MASS slider (Gravity Lab)

  // Subtle atmosphere glows, keyed by planet name.
  const ATMO = {
    Venus:   'rgba(235,195,120,',
    Earth:   'rgba(90,170,255,',
    Mars:    'rgba(255,150,100,',
    Uranus:  'rgba(150,225,235,',
    Neptune: 'rgba(100,140,230,',
  };

  // State
  let simDays = 0;
  let speed = 1;          // multiplier
  let timePerSec = 30;    // sim days per real second at speed=1
  let paused = false;
  let realScale = false;
  let selected = null;
  let hoverIndex = -1;
  let hoverSun = false;
  let stars = [];
  let quiz = null;        // { target: planet, score, best }
  let quizFlash = 0;      // 0=none, +ve=correct, -ve=wrong (counts down)
  let mode = 'orbit';     // 'orbit' | 'compare' | 'gravity' | 'graph'
  let showLabels = false;
  let showTrails = false;
  let planetTrails = PLANETS.map(() => []);
  let gravMult = 1;       // Sun gravity multiplier for the comet sandbox
  let frameNo = 0;

  // ---- 3D camera ----
  // The solar system lives in 3D world space: the Sun at the origin, planets
  // orbiting (mostly) in the XZ plane, +Y pointing "up" out of the ecliptic.
  // The camera orbits the Sun on a sphere: yaw spins around, pitch tilts
  // between near-edge-on and top-down, dist zooms.
  const DEFAULT_CAM = { yaw: 0, pitch: 0.58, dist: 1150 };
  let cam = { ...DEFAULT_CAM };
  let FOCAL = 900; // scales with the window so the system fills the screen
  const MIN_PITCH = 0.12, MAX_PITCH = 1.5;
  const MIN_DIST = 400, MAX_DIST = 3000;

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  // Follow-cam: when following a planet, the whole world is shifted so the
  // planet sits at the origin — the camera math never has to change.
  let followIndex = -1;
  let fo = { wx: 0, wy: 0, wz: 0 };

  // World point -> screen point with perspective. Returns the screen x/y,
  // the perspective scale s (1 = "actual size" at the Sun's distance when
  // fully zoomed to default), and depth from the camera (for sorting).
  function project(wx, wy, wz) {
    wx -= fo.wx; wy -= fo.wy; wz -= fo.wz;
    const cyaw = Math.cos(cam.yaw), syaw = Math.sin(cam.yaw);
    const x1 = wx * cyaw - wz * syaw;
    const z1 = wx * syaw + wz * cyaw;
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const y2 = wy * cp - z1 * sp;
    const z2 = wy * sp + z1 * cp;
    const depth = cam.dist - z2;
    const s = FOCAL / Math.max(60, depth);
    return { x: cx + x1 * s, y: cy - y2 * s, s, depth };
  }

  // Screen point -> the point on the ecliptic plane (y=0) under the cursor,
  // by casting a ray from the camera through the pixel. Used to aim comets.
  function screenToPlane(sx, sy) {
    const cyaw = Math.cos(cam.yaw), syaw = Math.sin(cam.yaw);
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    // Camera position in world space
    const camY = cam.dist * sp;
    const ground = cam.dist * cp;
    const camX = ground * syaw;
    const camZ = ground * cyaw;
    // Ray direction: view space -> world space (inverse camera rotation)
    const vx = (sx - cx) / FOCAL, vy = -(sy - cy) / FOCAL, vz = -1;
    const dy = vy * cp + vz * sp;
    const z1 = -vy * sp + vz * cp;
    const dx = vx * cyaw + z1 * syaw;
    const dz = -vx * syaw + z1 * cyaw;
    if (dy >= -1e-6) return null; // looking above the plane
    const t = -camY / dy;
    const wx = camX + dx * t, wz = camZ + dz * t;
    if (Math.abs(wx) > 4000 || Math.abs(wz) > 4000) return null;
    // The camera math is follow-relative, so convert back to true world space.
    return { x: wx + fo.wx, z: wz + fo.wz };
  }

  // ---- Comet physics sandbox ----
  let cometMode = false;
  let comets = [];        // { x, z, vx, vz, trail: [{x,z}] } — in world space
  let aiming = null;      // { x0, z0, x1, z1 } on the ecliptic plane
  const GM = 950;         // Sun's gravitational parameter, tuned for the scene
  let sunFlash = 0;       // brief flash when a comet falls into the Sun

  // Calibration: with GM=950 and Earth's orbit radius (125 world units), a
  // circular orbit velocity is sqrt(950/125) ≈ 2.76 units/frame. At 60fps
  // that's ~166 units/sec, and Earth's real orbital speed is 29.8 km/s, so
  // each unit-per-second is about 0.18 km/s. This calibration also gives
  // realistic readouts at other radii (Mercury ~47, asteroid belt ~20).
  const KM_PER_UNIT_PER_SEC = 0.18;
  const COMET_FPS = 60;
  function speedKmS(vx, vz) {
    return Math.hypot(vx, vz) * COMET_FPS * KM_PER_UNIT_PER_SEC;
  }
  let impacts = [];       // expanding rings where a comet hit a planet

  // Per-frame screen positions for hit-testing, populated by the renderer.
  // Each entry: { x, y, r } (r = on-screen apparent radius).
  let screenPos = [];
  let sunScreenPos = { x: cx, y: cy, r: SUN.r };
  let sunScr = { x: cx, y: cy, s: 1, depth: DEFAULT_CAM.dist };

  // World-space scale is fixed (referenced to the original 720px layout) so
  // physics and camera distances stay identical on every screen size — the
  // projection's FOCAL length is what adapts to the window instead.
  const MAX_COMPRESSED = Math.max(...PLANETS.map(p => p.compressedR));
  const WORLD_SCALE = (720 / 2 - 14) / MAX_COMPRESSED;
  const REAL_MAX_R = 346; // world-units radius that Pluto's real-scale orbit maps to
  const MAX_AU = 40; // real-scale mode maps 0..40 AU (Pluto included)

  const STAR_TINTS = ['255,255,255', '255,255,255', '205,222,255', '255,232,205'];
  function makeStars() {
    stars = [];
    const count = Math.min(700, Math.floor(W * H / 2400) + 140);
    for (let i = 0; i < count; i++) {
      // Two depth layers; the far layer drifts slower for parallax.
      const layer = Math.random() < 0.55 ? 0.4 : 1;
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        brightness: (Math.random() * 0.6 + 0.2) * (layer === 1 ? 1 : 0.7),
        twinkle: Math.random() * Math.PI * 2,
        size: Math.random() < (layer === 1 ? 0.14 : 0.05) ? 2 : 1,
        tint: STAR_TINTS[Math.floor(Math.random() * STAR_TINTS.length)],
        layer,
      });
    }
  }
  let shootingStar = null;

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    FOCAL = 900 * clamp(Math.min(W, H) / 520, 0.85, 2.4);
    makeStars();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ---- Coordinates ----
  function orbitRadius(p) {
    if (realScale) {
      return 30 + (p.orbitAU / MAX_AU) * (REAL_MAX_R - 30);
    }
    return p.compressedR * WORLD_SCALE;
  }

  // 3D world position of a planet on its (inclined) orbit.
  function planetPos3D(p, i) {
    const r = orbitRadius(p);
    // give each planet a phase offset so they don't all start aligned
    const phase = i * 0.7;
    const angle = phase + (simDays / p.periodDays) * Math.PI * 2;
    const incl = (p.inclDeg || 0) * Math.PI / 180;
    return {
      wx: Math.cos(angle) * r,
      wy: Math.sin(angle) * r * Math.sin(incl),
      wz: Math.sin(angle) * r * Math.cos(incl),
      angle, r
    };
  }

  // ---- Drawing ----
  function drawStars(t) {
    // Faint milky-way band across the sky
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.5);
    const diag = Math.hypot(W, H);
    const mg = ctx.createLinearGradient(0, -H * 0.20, 0, H * 0.20);
    mg.addColorStop(0, 'rgba(170,180,255,0)');
    mg.addColorStop(0.5, 'rgba(190,200,255,0.05)');
    mg.addColorStop(1, 'rgba(170,180,255,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(-diag, -H * 0.20, diag * 2, H * 0.40);
    ctx.restore();
    // Two star layers, drifting at different rates as the camera spins (parallax)
    for (const s of stars) {
      const b = s.brightness * (0.7 + 0.3 * Math.sin(t * 0.001 + s.twinkle));
      const px = ((s.x - cam.yaw * 90 * s.layer) % W + W) % W;
      const py = ((s.y + cam.pitch * 50 * s.layer) % H + H) % H;
      ctx.fillStyle = `rgba(${s.tint},${b})`;
      ctx.fillRect(px, py, s.size, s.size);
    }
    drawShootingStar();
  }

  function drawShootingStar() {
    if (!shootingStar && Math.random() < 0.004) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      shootingStar = {
        x: Math.random() * W, y: Math.random() * H * 0.35,
        vx: (5 + Math.random() * 4) * dir, vy: 2 + Math.random() * 2, life: 0,
      };
    }
    if (!shootingStar) return;
    const s = shootingStar;
    s.x += s.vx; s.y += s.vy; s.life++;
    const a = Math.max(0, 1 - s.life / 55);
    const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 7, s.y - s.vy * 7);
    grad.addColorStop(0, `rgba(255,255,255,${0.85 * a})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 7, s.y - s.vy * 7);
    ctx.stroke();
    if (s.life > 55 || s.x < -60 || s.x > W + 60 || s.y > H + 60) shootingStar = null;
  }

  function drawSun(t, scr) {
    const x = scr.x, y = scr.y;
    const R = SUN.r * scr.s;

    // Glow (gently breathing)
    const pulse = 1 + 0.05 * Math.sin(t * 0.0012);
    const glow = ctx.createRadialGradient(x, y, R * 0.5, x, y, R * 3 * pulse);
    glow.addColorStop(0, 'rgba(255,200,40,0.55)');
    glow.addColorStop(1, 'rgba(255,200,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, R * 3 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Slowly rotating corona rays
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 0.00006);
    ctx.fillStyle = 'rgba(255,205,60,0.07)';
    for (let i = 0; i < 12; i++) {
      const a = i * (Math.PI * 2 / 12);
      const len = R * (2.0 + 0.4 * Math.sin(t * 0.001 + i * 1.7));
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.1) * R * 0.9, Math.sin(a - 0.1) * R * 0.9);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.lineTo(Math.cos(a + 0.1) * R * 0.9, Math.sin(a + 0.1) * R * 0.9);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // Body
    ctx.fillStyle = SUN.color;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fill();

    // Sun spots / surface noise
    ctx.fillStyle = SUN.accent;
    for (let i = 0; i < 4; i++) {
      const a = i * 1.7 + t * 0.0003;
      const sx = x + Math.cos(a) * R * 0.55;
      const sy = y + Math.sin(a) * R * 0.45;
      ctx.beginPath();
      ctx.arc(sx, sy, (3 + Math.sin(t * 0.002 + i)) * scr.s, 0, Math.PI * 2);
      ctx.fill();
    }

    if (hoverSun) {
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, R + 5, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (sunFlash > 0) {
      ctx.fillStyle = `rgba(255,240,180,${sunFlash / 24})`;
      ctx.beginPath();
      ctx.arc(x, y, R + 6 + (12 - sunFlash) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawAsteroidBelt() {
    // Between Mars and Jupiter
    const r1 = realScale ? orbitRadius({ orbitAU: 2.2 }) : (PLANETS[3].compressedR + 18) * WORLD_SCALE;
    const r2 = realScale ? orbitRadius({ orbitAU: 3.2 }) : (PLANETS[3].compressedR + 30) * WORLD_SCALE;
    ctx.fillStyle = 'rgba(170,170,170,0.45)';
    // Deterministic dots so they don't shimmer; small Y jitter gives the belt
    // a little real thickness in 3D.
    for (let i = 0; i < 220; i++) {
      const a = (i * 137.5 * Math.PI / 180) + simDays * 0.0008;
      const r = r1 + ((i * 73) % 1000) / 1000 * (r2 - r1);
      const yj = ((((i * 37) % 100) - 50) / 50) * 3;
      const pt = project(Math.cos(a) * r, yj, Math.sin(a) * r);
      const sz = Math.max(1, pt.s);
      ctx.fillRect(pt.x, pt.y, sz, sz);
    }
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
  }

  // Recent path of each planet, glowing in the planet's own color.
  function drawTrails() {
    for (let i = 0; i < PLANETS.length; i++) {
      const tr = planetTrails[i];
      if (tr.length < 2) continue;
      const rgb = hexToRgb(PLANETS[i].color);
      let prev = project(tr[0].wx, tr[0].wy, tr[0].wz);
      for (let k = 1; k < tr.length; k++) {
        const pt = project(tr[k].wx, tr[k].wy, tr[k].wz);
        const a = k / tr.length;
        ctx.strokeStyle = `rgba(${rgb},${a * 0.55})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
        prev = pt;
      }
    }
  }

  function drawOrbit(p, highlight) {
    const r = orbitRadius(p);
    const incl = (p.inclDeg || 0) * Math.PI / 180;
    ctx.strokeStyle = highlight ? '#ffe60055' : (p.dwarf ? '#ffffff0a' : '#ffffff12');
    ctx.lineWidth = 1;
    if (p.dwarf) ctx.setLineDash([3, 5]);
    ctx.beginPath();
    const STEPS = 90;
    for (let k = 0; k <= STEPS; k++) {
      const a = (k / STEPS) * Math.PI * 2;
      const pt = project(Math.cos(a) * r, Math.sin(a) * r * Math.sin(incl), Math.sin(a) * r * Math.cos(incl));
      if (k === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Saturn-style rings split into a far half (behind the planet) and a
  // near half (in front), with a Cassini-division gap between bands.
  // squash follows the camera pitch in orbit view so the rings open up
  // as you fly over the top of the system.
  function drawSaturnRings(x, y, r, half, squash = 0.35) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.4);
    ctx.scale(1, squash);
    const start = half === 'front' ? 0 : Math.PI;
    const end = half === 'front' ? Math.PI : Math.PI * 2;
    const bands = [
      [1.35, r * 0.42, 'rgba(196,180,130,0.55)'],
      [1.78, r * 0.30, 'rgba(226,212,164,0.8)'],
      [2.18, r * 0.16, 'rgba(170,155,110,0.45)'],
    ];
    for (const [mul, wd, col] of bands) {
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(1.5, wd);
      ctx.beginPath();
      ctx.arc(0, 0, r * mul, start, end);
      ctx.stroke();
    }
    ctx.restore();
  }

  function ringSquash() {
    return clamp(0.18 + Math.sin(cam.pitch) * 0.45, 0.15, 0.75);
  }

  function drawPlanet(p, i, t, scr, w) {
    const isHover = hoverIndex === i;
    const isSel = selected === p;
    const pr = p.r * scr.s;

    // Moons orbit in 3D around the planet; the ones behind it are painted
    // first so they disappear behind the disc like the real thing.
    const sats = (p.sats || []).map((m, k) => {
      const ma = simDays * m.spd + i + k * 2.1;
      const mr = p.r + m.d;
      const ms = project(w.wx + Math.cos(ma) * mr, w.wy, w.wz + Math.sin(ma) * mr);
      return { m, ms };
    });
    const drawSat = ({ m, ms }) => {
      ctx.fillStyle = m.col;
      ctx.beginPath();
      ctx.arc(ms.x, ms.y, Math.max(0.8, m.r * ms.s), 0, Math.PI * 2);
      ctx.fill();
    };
    sats.filter(sat => sat.ms.depth > scr.depth).forEach(drawSat);

    // Saturn rings, far half (drawn behind the body)
    if (p.rings) drawSaturnRings(scr.x, scr.y, pr, 'back', ringSquash());

    // Soft atmosphere glow
    const atmo = ATMO[p.name];
    if (atmo) {
      const ag = ctx.createRadialGradient(scr.x, scr.y, pr * 0.7, scr.x, scr.y, pr * 2.1);
      ag.addColorStop(0, atmo + '0.28)');
      ag.addColorStop(1, atmo + '0)');
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, pr * 2.1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Body
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(scr.x, scr.y, pr, 0, Math.PI * 2);
    ctx.fill();

    // Shading (sun-side highlight)
    const lightAng = Math.atan2(sunScr.y - scr.y, sunScr.x - scr.x);
    const lx = scr.x + Math.cos(lightAng) * pr * 0.35;
    const ly = scr.y + Math.sin(lightAng) * pr * 0.35;
    const grad = ctx.createRadialGradient(lx, ly, 0, scr.x, scr.y, pr);
    grad.addColorStop(0, 'rgba(255,255,255,0.25)');
    grad.addColorStop(0.6, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(scr.x, scr.y, pr, 0, Math.PI * 2);
    ctx.fill();

    drawSurface(p, scr, pr, t);

    // Jupiter bands
    if (p.bands) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, pr, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = p.accent;
      for (let k = -2; k <= 2; k++) {
        ctx.fillRect(scr.x - pr, scr.y + k * 5 * scr.s - 1, pr * 2, Math.max(1.5, 2 * scr.s));
      }
      // Great red spot
      ctx.fillStyle = '#c44a3a';
      ctx.beginPath();
      ctx.ellipse(scr.x + pr * 0.3, scr.y + pr * 0.2, 4 * scr.s, 2 * scr.s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Saturn rings, near half (in front of the body)
    if (p.rings) drawSaturnRings(scr.x, scr.y, pr, 'front', ringSquash());

    // Uranus has faint, nearly-vertical rings (it spins on its side)
    if (p.thinRings) {
      ctx.save();
      ctx.translate(scr.x, scr.y);
      ctx.rotate(1.35);
      ctx.scale(1, 0.3);
      ctx.strokeStyle = 'rgba(160,210,220,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, pr * 1.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Moons in front of the planet
    sats.filter(sat => sat.ms.depth <= scr.depth).forEach(drawSat);

    // Name label
    if (showLabels) {
      ctx.fillStyle = 'rgba(220,220,220,0.75)';
      ctx.font = '9px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(p.name.toUpperCase(), scr.x, scr.y + pr + 13);
    }

    // Highlight ring
    if (isHover || isSel) {
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, pr + 5, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (quizFlash !== 0 && quiz && quiz.targetIndex === i) {
      const c = quizFlash > 0 ? '#6bffd1' : '#ff6b6b';
      ctx.strokeStyle = c;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, pr + 8 + (Math.abs(quizFlash) % 10), 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Cartoon surface features that slowly rotate so each world looks like a
  // spinning globe rather than a flat dot. [lon, lat, w, h] in globe units.
  const EARTH_LAND = [[0.3, -0.15, 0.30, 0.42], [0.55, 0.42, 0.18, 0.30], [2.5, -0.30, 0.55, 0.32], [2.35, 0.20, 0.24, 0.42], [3.9, 0.42, 0.20, 0.14]];
  const MARS_DARK  = [[0.4, 0.05, 0.35, 0.25], [2.6, -0.2, 0.28, 0.2], [4.4, 0.3, 0.22, 0.15]];
  function drawSurface(p, scr, pr, t) {
    if (pr < 3.5) return;
    ctx.save();
    ctx.beginPath();
    ctx.arc(scr.x, scr.y, pr, 0, Math.PI * 2);
    ctx.clip();
    const rot = t * 0.0005;
    const blob = (list, color, alpha) => {
      ctx.fillStyle = color;
      ctx.globalAlpha = alpha;
      for (const [lon, lat, bw, bh] of list) {
        const a = lon + rot;
        const c = Math.cos(a);
        if (c <= 0.08) continue; // on the far side of the globe
        ctx.beginPath();
        ctx.ellipse(scr.x + Math.sin(a) * pr * 0.92, scr.y + lat * pr, Math.max(0.6, bw * pr * c), bh * pr, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };
    const caps = (size, color) => {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.ellipse(scr.x, scr.y - pr * 0.92, pr * size, pr * 0.22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(scr.x, scr.y + pr * 0.92, pr * size * 0.8, pr * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    };
    switch (p.name) {
      case 'Earth':
        blob(EARTH_LAND, '#4f9a3c', 0.95);
        caps(0.55, 'rgba(240,248,255,0.85)');
        // drifting clouds
        blob([[1.2 + rot * 0.6, -0.5, 0.35, 0.10], [3.5 + rot * 0.6, 0.15, 0.4, 0.09], [5.4 + rot * 0.6, 0.55, 0.3, 0.08]], '#ffffff', 0.55);
        break;
      case 'Mars':
        blob(MARS_DARK, '#7a3a1e', 0.75);
        caps(0.35, 'rgba(255,255,255,0.8)');
        break;
      case 'Venus':
        // Swirling sulphuric-acid cloud bands
        ctx.strokeStyle = 'rgba(255,240,200,0.35)';
        ctx.lineWidth = Math.max(1, pr * 0.12);
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.ellipse(scr.x, scr.y + k * pr * 0.35, pr * 1.1, pr * 0.14, -0.25 + k * 0.1, 0, Math.PI * 2);
          ctx.stroke();
        }
        break;
      case 'Mercury':
        blob([[0.5, -0.3, 0.09, 0.12], [1.8, 0.35, 0.07, 0.09], [3.2, 0.0, 0.11, 0.14], [4.6, -0.45, 0.06, 0.08], [5.5, 0.5, 0.08, 0.1]], '#5c4a3a', 0.8);
        break;
      case 'Neptune':
        blob([[1.0, 0.15, 0.20, 0.13]], '#16307a', 0.9); // the Great Dark Spot
        blob([[2.4, -0.45, 0.30, 0.05], [4.3, 0.5, 0.25, 0.05]], '#ffffff', 0.35);
        break;
      case 'Uranus':
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = Math.max(1, pr * 0.08);
        for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(scr.x - pr, scr.y + k * pr * 0.45); ctx.lineTo(scr.x + pr, scr.y + k * pr * 0.45); ctx.stroke(); }
        break;
      case 'Saturn':
        ctx.strokeStyle = 'rgba(160,130,80,0.25)';
        ctx.lineWidth = Math.max(1, pr * 0.1);
        for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(scr.x - pr, scr.y + k * pr * 0.32); ctx.lineTo(scr.x + pr, scr.y + k * pr * 0.32); ctx.stroke(); }
        break;
      case 'Pluto':
        blob([[1.0, 0.1, 0.22, 0.28]], '#f4ece0', 0.9); // the heart-shaped nitrogen glacier
        break;
    }
    ctx.restore();
  }

  function render(t) {
    ctx.fillStyle = '#04040c';
    ctx.fillRect(0, 0, W, H);
    drawStars(t);

    if (mode === 'compare') {
      renderCompare(t);
    } else if (mode === 'gravity') {
      renderGravity(t);
    } else if (mode === 'graph') {
      renderGraph(t);
    } else {
      // Follow-cam: keep the tracked planet centered
      if (followIndex >= 0) fo = planetPos3D(PLANETS[followIndex], followIndex);
      else fo = { wx: 0, wy: 0, wz: 0 };

      // Orbit paths
      for (let i = 0; i < PLANETS.length; i++) {
        drawOrbit(PLANETS[i], hoverIndex === i || selected === PLANETS[i]);
      }
      drawAsteroidBelt();
      if (showTrails) drawTrails();

      sunScr = project(0, 0, 0);

      // Project every body, then paint far-to-near so planets correctly
      // pass in front of / behind the Sun and each other in 3D.
      const bodies = PLANETS.map((p, i) => {
        const w = planetPos3D(p, i);
        return { p, i, w, scr: project(w.wx, w.wy, w.wz) };
      });
      const drawList = [...bodies, { sun: true, scr: sunScr }];
      drawList.sort((a, b) => b.scr.depth - a.scr.depth);
      for (const b of drawList) {
        if (b.sun) drawSun(t, sunScr);
        else drawPlanet(b.p, b.i, t, b.scr, b.w);
      }

      drawComets();
      drawImpacts();

      // Cache screen positions for hit-testing
      sunScreenPos = { x: sunScr.x, y: sunScr.y, r: SUN.r * sunScr.s };
      screenPos = [];
      for (const b of bodies) screenPos[b.i] = { x: b.scr.x, y: b.scr.y, r: b.p.r * b.scr.s };

      // Follow banner
      if (followIndex >= 0) {
        ctx.fillStyle = 'rgba(255,230,0,0.75)';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('FOLLOWING ' + PLANETS[followIndex].name.toUpperCase() + ' — RESET VIEW to stop', cx, 96);
      }
    }

    if (quizFlash > 0) quizFlash--;
    else if (quizFlash < 0) quizFlash++;
  }

  function renderCompare(t) {
    // Pick a scale where Jupiter fits comfortably.
    // Jupiter diameter is ~140000 km; aim for ~140 px diameter (radius 70).
    const KM_PER_PX = 1000;
    const radii = PLANETS.map(p => p.diameterKm / 2 / KM_PER_PX);
    const sunDiameterPx = SUN.diameterKm / KM_PER_PX;

    // Lay planets out left-to-right in solar order
    const gap = 24;
    const totalPlanetsWidth = radii.reduce((a, b) => a + b * 2, 0) + gap * (PLANETS.length - 1);
    const sunSliceWidth = 110; // visible portion of the Sun's curve on the left
    const startX = sunSliceWidth + 30;
    // Scale to fill whatever width we have (shrink on phones, grow on desktops)
    const avail = W - 16 - sunSliceWidth - 30;
    const scale = clamp(avail / totalPlanetsWidth, 0.3, 1.7);
    const scaledRadii = radii.map(r => r * scale);
    const scaledGap = gap * scale;

    // ----- Sun arc on the left -----
    const sunR = (sunDiameterPx / 2) * scale;
    const sunCx = -sunR + sunSliceWidth; // visible arc = sunSliceWidth at the equator
    const sunCy = H / 2;
    // Sun glow
    const sg = ctx.createRadialGradient(sunCx, sunCy, sunR * 0.7, sunCx, sunCy, sunR * 1.05);
    sg.addColorStop(0, 'rgba(255,200,40,0)');
    sg.addColorStop(0.85, 'rgba(255,200,40,0.18)');
    sg.addColorStop(1, 'rgba(255,200,40,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sunCx, sunCy, sunR * 1.05, 0, Math.PI * 2);
    ctx.fill();
    // Sun body
    ctx.fillStyle = SUN.color;
    ctx.beginPath();
    ctx.arc(sunCx, sunCy, sunR, 0, Math.PI * 2);
    ctx.fill();
    // surface flicker
    ctx.fillStyle = SUN.accent;
    for (let i = 0; i < 6; i++) {
      const a = i * 1.2 + t * 0.0004;
      ctx.beginPath();
      ctx.arc(sunCx + Math.cos(a) * sunR * 0.9, sunCy + Math.sin(a) * sunR * 0.7,
              3 + Math.sin(t * 0.002 + i) * 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    // Sun label (vertical along its visible edge)
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('SUN', 12, H / 2 - 4);
    ctx.fillStyle = '#888';
    ctx.font = '10px Courier New';
    ctx.fillText('only the edge', 12, H / 2 + 10);
    ctx.fillText('fits!', 12, H / 2 + 22);
    if (hoverSun) {
      ctx.strokeStyle = '#ffe600';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sunCx, sunCy, sunR + 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    sunScreenPos = { x: sunCx, y: sunCy, r: sunR };

    // ----- Planets line -----
    const baselineY = H / 2 + 30;
    let cursor = startX;
    screenPos = [];
    for (let i = 0; i < PLANETS.length; i++) {
      const p = PLANETS[i];
      const r = scaledRadii[i];
      const x = cursor + r;
      const y = baselineY;
      screenPos.push({ x, y, r });

      // Saturn rings, far half (drawn first, behind body)
      if (p.rings) drawSaturnRings(x, y, r, 'back');

      // Body
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      // Light shading
      const lg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
      lg.addColorStop(0, 'rgba(255,255,255,0.25)');
      lg.addColorStop(0.6, 'rgba(255,255,255,0)');
      lg.addColorStop(1, 'rgba(0,0,0,0.45)');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Jupiter bands
      if (p.bands && r > 14) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = p.accent;
        for (let k = -3; k <= 3; k++) {
          ctx.fillRect(x - r, y + k * (r * 0.18) - 1, r * 2, Math.max(2, r * 0.06));
        }
        ctx.fillStyle = '#c44a3a';
        ctx.beginPath();
        ctx.ellipse(x + r * 0.3, y + r * 0.2, r * 0.16, r * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Saturn rings, near half (in front)
      if (p.rings) drawSaturnRings(x, y, r, 'front');

      // Highlight ring
      if (hoverIndex === i || selected === p) {
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, r + 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (quizFlash !== 0 && quiz && quiz.targetIndex === i) {
        const c = quizFlash > 0 ? '#6bffd1' : '#ff6b6b';
        ctx.strokeStyle = c;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, r + 6 + (Math.abs(quizFlash) % 10), 0, Math.PI * 2);
        ctx.stroke();
      }

      // Name label below (staggered in two rows so neighbours don't overlap)
      const labelY = baselineY + Math.max(r, 12) + 16 + (i % 2) * 28;
      ctx.fillStyle = '#ccc';
      ctx.font = 'bold 11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(p.name.toUpperCase(), x, labelY);
      // Diameter label
      ctx.fillStyle = '#666';
      ctx.font = '10px Courier New';
      ctx.fillText(formatNum(p.diameterKm) + ' km', x, labelY + 14);

      cursor += r * 2 + scaledGap;
    }

    // ----- Header text -----
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PLANETS AT TRUE RELATIVE SIZE', W / 2, 58);
    ctx.fillStyle = '#888';
    ctx.font = '12px Courier New';
    ctx.fillText('Jupiter is ~11× wider than Earth · the Sun is ~109× wider', W / 2, 78);

    // "How many Earths fit across?" callouts on a couple of bodies
    const earthDiam = 12742;
    const callout = (i, text) => {
      const sp = screenPos[i];
      ctx.fillStyle = '#ffe60099';
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(text, sp.x, sp.y - sp.r - 8);
    };
    const earthsAcross = (km) => Math.round(km / earthDiam);
    callout(4, `${earthsAcross(PLANETS[4].diameterKm)} Earths wide`); // Jupiter
    callout(5, `${earthsAcross(PLANETS[5].diameterKm)} Earths wide`); // Saturn
  }

  // ---- Educational mode: Gravity Lab ----
  // Bar chart of what you'd weigh on every world. Weight = mass × gravity,
  // so the same kid weighs 5 kg on the Moon and 76 kg on Jupiter.
  function renderGravity(t) {
    sunScreenPos = { x: -9999, y: -9999, r: 0 };
    screenPos = [];
    const entries = [
      { name: 'MOON', g: 0.17, color: '#c8c8c8' },
      ...PLANETS.map((p, i) => ({ name: p.name.toUpperCase(), g: p.gravityG, color: p.color, idx: i })),
      { name: 'SUN', g: SUN.gravityG, color: '#ffe066', sun: true },
    ];
    const L = Math.max(30, W * 0.05), R = Math.max(20, W * 0.03);
    const top = 118, bottom = H - 168;
    const chartH = bottom - top;
    const n = entries.length;
    const slot = (W - L - R) / n;
    const barW = Math.min(64, slot * 0.6);
    const maxVal = userKg * 3; // Jupiter (2.53×) is the tallest un-clipped bar

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 16px Courier New';
    ctx.fillText('GRAVITY LAB — WHAT WOULD YOU WEIGH?', cx, 58);
    ctx.fillStyle = '#8a93b0';
    ctx.font = '12px Courier New';
    ctx.fillText(`Same you (${userKg} kg of mass), different gravity. Weight = mass × gravity!`, cx, 78);

    // Your-weight-on-Earth reference line
    const earthY = bottom - (userKg / maxVal) * chartH;
    ctx.strokeStyle = 'rgba(90,160,230,0.5)';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(L, earthY);
    ctx.lineTo(W - R, earthY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(90,160,230,0.85)';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('YOUR WEIGHT ON EARTH', L + 4, earthY - 5);

    for (let k = 0; k < n; k++) {
      const e = entries[k];
      const val = userKg * e.g;
      const x = L + slot * k + slot / 2;
      const clipped = val > maxVal;
      const h = clipped ? chartH : Math.max(3, (val / maxVal) * chartH);
      const y = bottom - h;

      ctx.fillStyle = e.color;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x - barW / 2, y, barW, h, [6, 6, 0, 0]);
      else ctx.rect(x - barW / 2, y, barW, h);
      ctx.fill();

      if (clipped) {
        // Jagged break: the Sun's bar is WAY off this chart (28× Earth!)
        ctx.fillStyle = '#04040c';
        ctx.beginPath();
        ctx.moveTo(x - barW / 2, y + 14);
        ctx.lineTo(x + barW / 2, y + 14);
        for (let zz = 6; zz >= 0; zz--) {
          ctx.lineTo(x - barW / 2 + (barW / 6) * zz, y + 26 + (zz % 2 === 0 ? 0 : 9));
        }
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(val) + ' kg', x, y - 6);

      ctx.fillStyle = '#aab';
      ctx.font = '10px Courier New';
      ctx.save();
      ctx.translate(x, bottom + 14);
      if (slot < 58) { ctx.rotate(-0.7); ctx.textAlign = 'right'; }
      ctx.fillText(e.name, 0, 0);
      ctx.restore();

      const hitR = Math.max(barW * 0.7, 16);
      if (e.idx !== undefined) screenPos[e.idx] = { x, y: y + h / 2, r: hitR };
      if (e.sun) sunScreenPos = { x, y: y + h / 2, r: hitR };
    }

    ctx.fillStyle = '#667';
    ctx.font = '11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('Slide YOUR MASS below · click a bar to learn about that world', cx, bottom + 44);
  }

  // ---- Educational mode: Orbit Speedometer (Kepler) ----
  // Orbital speed vs. distance, with the v = 29.8/√AU curve the planets
  // actually sit on. Closer to the Sun = stronger pull = faster orbit.
  function renderGraph(t) {
    sunScreenPos = { x: -9999, y: -9999, r: 0 };
    screenPos = [];
    const L = Math.max(56, W * 0.07), R = Math.max(24, W * 0.035);
    const top = 118, bottom = H - 150;
    const plotW = W - L - R, plotH = bottom - top;
    const MAXAU = 41, MAXV = 50;
    const xOf = au => L + (Math.sqrt(au) / Math.sqrt(MAXAU)) * plotW;
    const yOf = v => bottom - (v / MAXV) * plotH;

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 16px Courier New';
    ctx.fillText('ORBIT SPEEDOMETER — WHY OUTER PLANETS ARE SLOW', cx, 58);
    ctx.fillStyle = '#8a93b0';
    ctx.font = '12px Courier New';
    ctx.fillText('Farther from the Sun, gravity pulls less — so planets cruise slower. Kepler figured this out in 1619!', cx, 78);

    // Grid + axes
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.fillStyle = '#667';
    ctx.font = '10px Courier New';
    for (let v = 0; v <= MAXV; v += 10) {
      ctx.beginPath();
      ctx.moveTo(L, yOf(v));
      ctx.lineTo(W - R, yOf(v));
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(String(v), L - 6, yOf(v) + 3);
    }
    for (const au of [1, 5, 10, 20, 30, 40]) {
      ctx.beginPath();
      ctx.moveTo(xOf(au), top);
      ctx.lineTo(xOf(au), bottom);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(au + ' AU', xOf(au), bottom + 14);
    }
    ctx.save();
    ctx.translate(Math.max(14, L - 38), (top + bottom) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8a93b0';
    ctx.font = '11px Courier New';
    ctx.fillText('ORBITAL SPEED (km/s)', 0, 0);
    ctx.restore();
    ctx.fillStyle = '#8a93b0';
    ctx.textAlign = 'center';
    ctx.font = '11px Courier New';
    ctx.fillText('DISTANCE FROM SUN (1 AU = Earth–Sun distance)', cx, bottom + 30);

    // The Kepler curve every planet sits on
    ctx.strokeStyle = 'rgba(255,230,0,0.6)';
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let first = true;
    for (let au = 0.35; au <= MAXAU; au *= 1.06) {
      const v = 29.78 / Math.sqrt(au);
      if (v > MAXV) continue;
      const px = xOf(au), py = yOf(v);
      if (first) { ctx.moveTo(px, py); first = false; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffe600';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('speed ≈ 29.8 ÷ √distance', xOf(6), yOf(29.78 / Math.sqrt(6)) - 14);

    // Planet dots on the curve
    for (let i = 0; i < PLANETS.length; i++) {
      const p = PLANETS[i];
      const v = EXTRA[p.name].orbitKmS;
      const x = xOf(p.orbitAU), y = yOf(v);
      const hot = hoverIndex === i || selected === p;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, hot ? 10 : 7, 0, Math.PI * 2);
      ctx.fill();
      if (hot) {
        ctx.strokeStyle = '#ffe600';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 14, 0, Math.PI * 2);
        ctx.stroke();
      }
      const above = i % 2 === 0;
      ctx.fillStyle = '#dde';
      ctx.font = 'bold 10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(p.name.toUpperCase(), x, above ? y - 21 : y + 22);
      ctx.fillStyle = '#889';
      ctx.font = '9px Courier New';
      ctx.fillText(v + ' km/s', x, above ? y - 11 : y + 32);
      screenPos[i] = { x, y, r: 12 };
    }

    ctx.fillStyle = '#667';
    ctx.font = '11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('Click a planet dot to learn more', cx, bottom + 46);
  }

  // ---- Loop ----
  let lastTime = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = lastTime ? Math.min(100, now - lastTime) : 16;
    lastTime = now;
    if (!paused) {
      simDays += (dt / 1000) * timePerSec * speed;
      if (comets.length) stepComets(speed);
      if (showTrails && mode === 'orbit' && (frameNo++ % 2 === 0)) {
        for (let i = 0; i < PLANETS.length; i++) {
          const w = planetPos3D(PLANETS[i], i);
          const tr = planetTrails[i];
          tr.push({ wx: w.wx, wy: w.wy, wz: w.wz });
          if (tr.length > 110) tr.shift();
        }
      }
    }
    if (sunFlash > 0) sunFlash--;
    render(now);
  }

  // Newtonian gravity toward the Sun, simulated in world space on the
  // ecliptic plane. Uses small sub-steps for a stable inverse-square
  // integration, so comets trace real orbits, slingshots, and escape
  // trajectories — and they stay correct as you spin the camera.
  // mult = the time-warp multiplier, so comets honor the 0.5×–20× speed
  // buttons just like the planets. The sub-step size stays constant
  // (more steps at higher speeds) to keep the orbits stable.
  function stepComets(mult = 1) {
    const SUBSTEPS = Math.min(96, Math.max(2, Math.ceil(4 * mult)));
    const h = mult / SUBSTEPS;
    const positions = PLANETS.map((p, i) => planetPos3D(p, i));
    const survivors = [];
    for (const c of comets) {
      let alive = true;
      for (let s = 0; s < SUBSTEPS && alive; s++) {
        const r2 = c.x * c.x + c.z * c.z;
        const r = Math.sqrt(r2);
        if (r < SUN.r) { alive = false; sunFlash = 12; sfx.sun(); cometEnded(c, 'sun'); break; }   // fell into the Sun
        const a = GM * gravMult / r2;      // acceleration magnitude (inverse square)
        c.vx += a * (-c.x / r) * h;
        c.vz += a * (-c.z / r) * h;
        c.x += c.vx * h;
        c.z += c.vz * h;
        if (c.mission) {
          // Mission telemetry: closest approach to the Sun and how far
          // around the Sun the probe has swung (for the orbit mission)
          const ang = Math.atan2(c.z, c.x);
          let da = ang - c.lastAng;
          if (da > Math.PI) da -= Math.PI * 2; else if (da < -Math.PI) da += Math.PI * 2;
          c.sweep += da; c.lastAng = ang;
          if (r < c.minR) c.minR = r;
          if (!c.leftHome) {
            const e = positions[2];
            if (Math.hypot(c.x - e.wx, c.z - e.wz) > PLANETS[2].r + 12) c.leftHome = true;
          }
          if (checkMissionProgress(c, r)) { alive = false; break; }
        }
        // Splat on any planet in the way — checked every sub-step so fast
        // time-warp can't tunnel a comet through a planet. Full 3D
        // distance: inclined planets can dodge above or below a comet!
        // (Mission probes fly a flat course, so for them only the 2D
        // distance counts — otherwise tilted Pluto could never be reached.)
        for (let i = 0; i < PLANETS.length; i++) {
          if (c.mission && i === 2 && !c.leftHome) continue; // still leaving Earth
          const w = positions[i];
          const ddx = c.x - w.wx, ddy = c.mission ? 0 : -w.wy, ddz = c.z - w.wz;
          const hitR = PLANETS[i].r + (c.mission ? 7 : 3);
          if (ddx * ddx + ddy * ddy + ddz * ddz < hitR * hitR) {
            alive = false;
            impacts.push({ wx: w.wx, wy: w.wy, wz: w.wz, r: PLANETS[i].r, life: 0 });
            sfx.impact();
            cometEnded(c, 'hit', i);
            break;
          }
        }
        // Lay down trail points at a steady world-distance cadence (every
        // 4 sub-steps ≈ once per frame at 1×) so trails stay smooth at 20×.
        c.stepAcc = (c.stepAcc || 0) + 1;
        if (alive && c.stepAcc % 4 === 0) {
          c.trail.push({ x: c.x, z: c.z });
          if (c.trail.length > 80) c.trail.shift();
        }
      }
      if (!alive) continue;
      // Drop comets that fly far away
      if (Math.abs(c.x) > 2600 || Math.abs(c.z) > 2600) { cometEnded(c, 'lost'); continue; }
      survivors.push(c);
    }
    comets = survivors;
  }

  function drawImpacts() {
    impacts = impacts.filter(im => im.life < 20);
    for (const im of impacts) {
      im.life++;
      const k = im.life / 20;
      const scr = project(im.wx, im.wy, im.wz);
      ctx.strokeStyle = `rgba(255,210,120,${1 - k})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, im.r * scr.s + 4 + k * 16, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawComets() {
    // Trails (projected from world space each frame, so they bend correctly
    // when you rotate the view)
    for (const c of comets) {
      if (c.trail.length > 1) {
        let prev = project(c.trail[0].x, 0, c.trail[0].z);
        for (let i = 1; i < c.trail.length; i++) {
          const pt = project(c.trail[i].x, 0, c.trail[i].z);
          const a = i / c.trail.length;
          ctx.strokeStyle = `rgba(140,200,255,${a * 0.5})`;
          ctx.lineWidth = a * 2;
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(pt.x, pt.y);
          ctx.stroke();
          prev = pt;
        }
      }
    }
    // Heads + sun-pointing tails
    for (const c of comets) {
      const head = project(c.x, 0, c.z);
      const d = Math.hypot(c.x, c.z) || 1;
      const tailLen = 18 + 1200 / d; // longer tail when closer to the Sun
      const tip = project(c.x + (c.x / d) * tailLen, 0, c.z + (c.z / d) * tailLen);
      const tg = ctx.createLinearGradient(head.x, head.y, tip.x, tip.y);
      tg.addColorStop(0, 'rgba(160,220,255,0.8)');
      tg.addColorStop(1, 'rgba(160,220,255,0)');
      ctx.strokeStyle = tg;
      ctx.lineWidth = Math.max(1.5, 3 * head.s);
      ctx.beginPath();
      ctx.moveTo(head.x, head.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.stroke();
      // Nucleus
      ctx.fillStyle = '#dff1ff';
      ctx.beginPath();
      ctx.arc(head.x, head.y, Math.max(1.5, 3 * head.s), 0, Math.PI * 2);
      ctx.fill();
      // Live speed readout (notice how it climbs as the comet falls toward
      // the Sun and drops as it swings back out — that's Kepler's 2nd law)
      ctx.fillStyle = 'rgba(220,240,255,0.9)';
      ctx.font = '10px Courier New';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.lineWidth = 3;
      ctx.strokeText(speedKmS(c.vx, c.vz).toFixed(1) + ' km/s', head.x + 6, head.y - 6);
      ctx.fillText(speedKmS(c.vx, c.vz).toFixed(1) + ' km/s', head.x + 6, head.y - 6);
    }
    // Aiming arrow while dragging (lives on the ecliptic plane)
    if (aiming) {
      refreshAimOrigin();
      const a0 = project(aiming.x0, 0, aiming.z0);
      const a1 = project(aiming.x1, 0, aiming.z1);
      ctx.strokeStyle = '#6bd1ff';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(a0.x, a0.y);
      ctx.lineTo(a1.x, a1.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // Launch point
      ctx.fillStyle = '#dff1ff';
      ctx.beginPath();
      ctx.arc(a0.x, a0.y, 4, 0, Math.PI * 2);
      ctx.fill();
      // Arrowhead
      const ang = Math.atan2(a1.y - a0.y, a1.x - a0.x);
      ctx.fillStyle = '#6bd1ff';
      ctx.beginPath();
      ctx.moveTo(a1.x, a1.y);
      ctx.lineTo(a1.x - 8 * Math.cos(ang - 0.4), a1.y - 8 * Math.sin(ang - 0.4));
      ctx.lineTo(a1.x - 8 * Math.cos(ang + 0.4), a1.y - 8 * Math.sin(ang + 0.4));
      ctx.closePath();
      ctx.fill();
      // Launch-speed preview at the arrowhead, using the same VEL_SCALE
      // as launchComet so the number matches what the comet starts with.
      const previewVx = (aiming.x1 - aiming.x0) * 0.05;
      const previewVz = (aiming.z1 - aiming.z0) * 0.05;
      const kms = speedKmS(previewVx, previewVz);
      const capped = aiming.fromEarth && mission && kms >= mission.def.maxKmS - 0.05;
      ctx.fillStyle = capped ? '#ff9f6b' : '#6bd1ff';
      ctx.font = 'bold 11px Courier New';
      ctx.textAlign = 'left';
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.lineWidth = 3;
      ctx.strokeText(kms.toFixed(1) + ' km/s' + (capped ? ' (MAX FUEL)' : ''), a1.x + 8, a1.y + 4);
      ctx.fillText(kms.toFixed(1) + ' km/s' + (capped ? ' (MAX FUEL)' : ''), a1.x + 8, a1.y + 4);
    }
  }

  // ---- Interaction ----
  function getPlanetAt(mx, my) {
    // Sun (use cached screen position so it works in compare mode too)
    const sdx = mx - sunScreenPos.x, sdy = my - sunScreenPos.y;
    const sR = sunScreenPos.r + 4;
    if (sdx * sdx + sdy * sdy <= sR * sR) {
      return { type: 'sun' };
    }
    for (let i = 0; i < PLANETS.length; i++) {
      const sp = screenPos[i];
      if (!sp) continue;
      const dx = mx - sp.x, dy = my - sp.y;
      const hit = Math.max(sp.r + 5, 8); // generous hit area for tiny Mercury/Mars
      if (dx * dx + dy * dy <= hit * hit) {
        return { type: 'planet', index: i, planet: PLANETS[i], pos: sp };
      }
    }
    return null;
  }

  function selectBody(body) {
    hideTip();
    if (!body) {
      selected = null;
      panel.classList.remove('open');
      return;
    }
    if (body.type === 'sun') {
      selected = SUN;
      renderPanel(SUN, true);
    } else {
      selected = body.planet;
      renderPanel(body.planet, false, body.index);
    }
    panel.classList.add('open');
  }

  function renderPanel(p, isSun, idx) {
    let stats;
    if (isSun) {
      stats = [
        ['DIAMETER',     formatNum(p.diameterKm) + ' km (~109 Earths)'],
        ['SURFACE TEMP', '~5,500°C (15,000,000°C core)'],
        ['MADE OF',      'Hydrogen (73%) & helium (25%)'],
        ['GRAVITY',      p.gravityG + '× Earth'],
        ['YOU’D WEIGH', `${Math.round(userKg * p.gravityG)} kg (from ${userKg} kg)`],
        ['AGE',          p.ageBy + ' billion years'],
      ];
    } else {
      const ex = EXTRA[p.name] || {};
      const yearText = p.periodDays < 1000 ? `${p.periodDays} Earth days`
                                           : `${(p.periodDays / 365).toFixed(1)} Earth years`;
      const dayText = p.dayHours < 100 ? `${p.dayHours} hrs`
                                       : `${(p.dayHours / 24).toFixed(0)} Earth days`;
      const weighKg = (userKg * p.gravityG).toFixed(1);
      const lightMin = p.orbitAU * 8.317;
      stats = [
        ['DISTANCE FROM SUN', `${p.orbitAU} AU (${formatNum(Math.round(p.orbitAU * 149.6))} mil km)`],
        ['SUNLIGHT TAKES',    `${lightMin < 10 ? lightMin.toFixed(1) : Math.round(lightMin)} min to get there`],
        ['YEAR LENGTH',       yearText],
        ['DAY LENGTH',        dayText],
        ['DIAMETER',          formatNum(p.diameterKm) + ' km'],
        ['TEMPERATURE',       ex.tempC || '—'],
        ['MADE OF',           ex.madeOf || '—'],
        ['ORBITAL SPEED',     ex.orbitKmS ? `${ex.orbitKmS} km/s around the Sun` : '—'],
        ['ORBIT TILT',        `${p.inclDeg}° vs. Earth's orbit`],
        ['GRAVITY',           p.gravityG + '× Earth'],
        ['YOU’D WEIGH',  `${weighKg} kg (from ${userKg} kg)`],
        ['MOONS',             p.moons],
      ];
    }
    panelBody.innerHTML = `
      <h2>${p.name}</h2>
      <div class="ptype">${p.type.toUpperCase()}</div>
      <div class="stats">
        ${stats.map(s => `<div><span class="k">${s[0]}:</span> <span class="v">${s[1]}</span></div>`).join('')}
      </div>
      <div class="fact">${p.fact}</div>
      ${(!isSun && mode === 'orbit')
        ? `<div class="panelBtns"><button id="followBtn">${followIndex === idx ? '&#9632; UNFOLLOW' : '&#9654; FOLLOW'} ${p.name.toUpperCase()}</button></div>`
        : ''}
    `;
    const fb = document.getElementById('followBtn');
    if (fb) fb.onclick = () => {
      followIndex = (followIndex === idx) ? -1 : idx;
      if (followIndex >= 0) cam.dist = Math.min(cam.dist, 620);
      fb.innerHTML = (followIndex === idx ? '&#9632; UNFOLLOW ' : '&#9654; FOLLOW ') + p.name.toUpperCase();
    };
  }

  function formatNum(n) {
    return n.toLocaleString('en-US');
  }

  function canvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height),
    };
  }

  // Set the far end of the aiming arrow. In mission mode the arrow starts on
  // Earth (wherever Earth is right now) and its length is capped by the
  // mission's fuel budget, so the Sun's gravity has to do the rest.
  function setAimEnd(w) {
    if (!aiming) return;
    if (aiming.fromEarth) {
      aiming.dx = w.x - aiming.px;
      aiming.dz = w.z - aiming.pz;
      const max = mission ? mission.def.maxKmS : 0;
      if (max) {
        const kms = speedKmS(aiming.dx * 0.05, aiming.dz * 0.05);
        if (kms > max) { const k = max / kms; aiming.dx *= k; aiming.dz *= k; }
      }
      refreshAimOrigin();
    } else {
      aiming.x1 = w.x; aiming.z1 = w.z;
    }
  }
  function refreshAimOrigin() {
    if (!aiming || !aiming.fromEarth) return;
    const e = planetPos3D(PLANETS[2], 2);
    aiming.x0 = e.wx; aiming.z0 = e.wz;
    aiming.x1 = e.wx + aiming.dx; aiming.z1 = e.wz + aiming.dz;
  }
  function beginAim(w) {
    if (missionMode) {
      if (!mission) { showMissionPanel(); return; }
      aiming = { fromEarth: true, px: w.x, pz: w.z, dx: 0, dz: 0 };
      refreshAimOrigin();
    } else {
      aiming = { x0: w.x, z0: w.z, x1: w.x, z1: w.z };
    }
  }
  function releaseAim() {
    if (!aiming) return;
    if (Math.hypot(aiming.x1 - aiming.x0, aiming.z1 - aiming.z0) > 6) {
      if (aiming.fromEarth) launchProbe(aiming);
      else launchComet(aiming);
    }
    aiming = null;
  }

  function launchComet(aim) {
    // Drag length sets speed; direction is the throw direction.
    const VEL_SCALE = 0.05;
    comets.push({
      x: aim.x0, z: aim.z0,
      vx: (aim.x1 - aim.x0) * VEL_SCALE,
      vz: (aim.z1 - aim.z0) * VEL_SCALE,
      trail: [],
    });
    if (comets.length > 12) comets.shift(); // keep it light
  }

  // ---- Mouse: rotate the camera, aim comets, select planets ----
  let viewDrag = null;       // { sx, sy, yaw0, pitch0, moved }
  let suppressClick = false; // swallow the click that ends a view-drag

  canvas.addEventListener('mousedown', e => {
    if (mode !== 'orbit') return;
    const { x, y } = canvasCoords(e.clientX, e.clientY);
    if (cometMode || missionMode) {
      const w = screenToPlane(x, y);
      if (w) beginAim(w);
    } else {
      viewDrag = { sx: x, sy: y, yaw0: cam.yaw, pitch0: cam.pitch, moved: false };
    }
  });

  window.addEventListener('mouseup', e => {
    if (aiming) {
      const { x, y } = canvasCoords(e.clientX, e.clientY);
      const w = screenToPlane(x, y);
      if (w) setAimEnd(w);
      releaseAim();
    }
    if (viewDrag) {
      if (viewDrag.moved) suppressClick = true;
      viewDrag = null;
      canvas.style.cursor = (cometMode || missionMode) ? 'crosshair' : 'grab';
    }
  });

  canvas.addEventListener('mousemove', e => {
    const { x: mx, y: my } = canvasCoords(e.clientX, e.clientY);
    if (aiming) {
      const w = screenToPlane(mx, my);
      if (w) setAimEnd(w);
      return;
    }
    if (viewDrag) {
      const dx = mx - viewDrag.sx, dy = my - viewDrag.sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) viewDrag.moved = true;
      cam.yaw = viewDrag.yaw0 + dx * 0.006;
      cam.pitch = clamp(viewDrag.pitch0 + dy * 0.006, MIN_PITCH, MAX_PITCH);
      hideTip();
      canvas.style.cursor = 'grabbing';
      return;
    }
    const hit = getPlanetAt(mx, my);
    hoverIndex = -1;
    hoverSun = false;
    if (hit) {
      if (hit.type === 'sun') {
        hoverSun = true;
        showTip('Sun — surface rotates at ~2 km/s', e.clientX, e.clientY);
      } else {
        hoverIndex = hit.index;
        const ex = EXTRA[hit.planet.name];
        const label = ex ? `${hit.planet.name} — ${ex.orbitKmS} km/s` : hit.planet.name;
        showTip(label, e.clientX, e.clientY);
      }
      canvas.style.cursor = 'pointer';
    } else {
      hideTip();
      canvas.style.cursor = (cometMode || missionMode) ? 'crosshair' : (mode === 'orbit' ? 'grab' : 'default');
    }
  });

  canvas.addEventListener('mouseleave', () => {
    hoverIndex = -1;
    hoverSun = false;
    hideTip();
  });

  canvas.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    if (cometMode || missionMode) return; // canvas is for launching in these modes
    const { x: mx, y: my } = canvasCoords(e.clientX, e.clientY);
    const hit = getPlanetAt(mx, my);

    if (quiz && hit && hit.type === 'planet') {
      handleQuizAnswer(hit.index);
      // also show the info for the selected planet
      selectBody(hit);
      return;
    }
    if (hit) selectBody(hit);
    else selectBody(null); // click empty space -> close the info drawer
  });

  canvas.addEventListener('wheel', e => {
    if (mode !== 'orbit') return;
    e.preventDefault();
    cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), MIN_DIST, MAX_DIST);
  }, { passive: false });

  // ---- Touch: one finger rotates (or aims comets), pinch zooms, tap selects ----
  let touchState = null;

  function touchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.hypot(dx, dy) || 1;
  }

  canvas.addEventListener('touchstart', e => {
    if (mode !== 'orbit') return;
    e.preventDefault();
    if (e.touches.length >= 2) {
      aiming = null;
      touchState = { kind: 'pinch', d0: touchDist(e), dist0: cam.dist };
      return;
    }
    const t0 = e.touches[0];
    const { x, y } = canvasCoords(t0.clientX, t0.clientY);
    if (cometMode || missionMode) {
      const w = screenToPlane(x, y);
      if (w) {
        beginAim(w);
        if (aiming) touchState = { kind: 'aim' };
      }
    } else {
      touchState = { kind: 'rotate', sx: x, sy: y, yaw0: cam.yaw, pitch0: cam.pitch, moved: false };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    if (!touchState) return;
    e.preventDefault();
    if (touchState.kind === 'pinch' && e.touches.length >= 2) {
      cam.dist = clamp(touchState.dist0 * (touchState.d0 / touchDist(e)), MIN_DIST, MAX_DIST);
      return;
    }
    const t0 = e.touches[0];
    if (!t0) return;
    const { x, y } = canvasCoords(t0.clientX, t0.clientY);
    if (touchState.kind === 'aim' && aiming) {
      const w = screenToPlane(x, y);
      if (w) setAimEnd(w);
    } else if (touchState.kind === 'rotate') {
      const dx = x - touchState.sx, dy = y - touchState.sy;
      if (Math.abs(dx) + Math.abs(dy) > 6) touchState.moved = true;
      cam.yaw = touchState.yaw0 + dx * 0.006;
      cam.pitch = clamp(touchState.pitch0 + dy * 0.006, MIN_PITCH, MAX_PITCH);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (!touchState) return;
    e.preventDefault();
    if (touchState.kind === 'aim' && aiming) {
      releaseAim();
    } else if (touchState.kind === 'rotate' && !touchState.moved) {
      // A tap: treat it like a click (select / answer quiz)
      const hit = getPlanetAt(touchState.sx, touchState.sy);
      if (quiz && hit && hit.type === 'planet') {
        handleQuizAnswer(hit.index);
        selectBody(hit);
      } else if (hit) {
        selectBody(hit);
      }
    }
    touchState = null;
  }, { passive: false });

  function showTip(text, x, y) {
    tooltip.textContent = text;
    tooltip.style.left = (x + 14) + 'px';
    tooltip.style.top  = (y + 14) + 'px';
    tooltip.classList.add('show');
  }
  function hideTip() { tooltip.classList.remove('show'); }

  // ---- Controls ----
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.innerHTML = paused ? '&#9654;' : '&#9208;';
    pauseBtn.classList.toggle('active', paused);
  });

  document.querySelectorAll('button[data-speed]').forEach(b => {
    b.addEventListener('click', () => {
      speed = parseFloat(b.dataset.speed);
      document.querySelectorAll('button[data-speed]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  });

  viewBtn.addEventListener('click', () => {
    cam = { ...DEFAULT_CAM };
    followIndex = -1;
  });

  scaleBtn.addEventListener('click', () => {
    realScale = !realScale;
    scaleBtn.textContent = realScale ? 'COMPRESSED' : 'REAL DISTANCES';
    scaleBtn.classList.toggle('active', realScale);
  });

  const labelBtn = document.getElementById('labelBtn');
  labelBtn.addEventListener('click', () => {
    showLabels = !showLabels;
    labelBtn.classList.toggle('active', showLabels);
  });

  trailBtn.addEventListener('click', () => {
    showTrails = !showTrails;
    trailBtn.classList.toggle('active', showTrails);
    if (!showTrails) planetTrails = PLANETS.map(() => []);
  });

  // One toggle per full-screen mode; clicking the active one returns to orbits.
  function setMode(m) {
    mode = (mode === m) ? 'orbit' : m;
    if (mode !== 'orbit' && cometMode) stopComet();
    if (mode !== 'orbit' && missionMode) stopMissions();
    sfx.click();
    selectBody(null); // stale info (e.g. a FOLLOW button) doesn't carry across modes
    compareBtn.textContent = mode === 'compare' ? 'BACK TO ORBITS' : 'SIZES';
    gravityBtn.textContent = mode === 'gravity' ? 'BACK TO ORBITS' : 'GRAVITY LAB';
    graphBtn.textContent = mode === 'graph' ? 'BACK TO ORBITS' : 'SPEED GRAPH';
    compareBtn.classList.toggle('active', mode === 'compare');
    gravityBtn.classList.toggle('active', mode === 'gravity');
    graphBtn.classList.toggle('active', mode === 'graph');
    document.querySelectorAll('.orbitOnly').forEach(el => {
      el.style.display = mode === 'orbit' ? '' : 'none';
    });
    weightWrap.classList.toggle('show', mode === 'gravity');
    canvas.style.cursor = mode === 'orbit' ? 'grab' : 'default';
  }
  compareBtn.addEventListener('click', () => setMode('compare'));
  gravityBtn.addEventListener('click', () => setMode('gravity'));
  graphBtn.addEventListener('click', () => setMode('graph'));

  gravSlider.addEventListener('input', () => {
    gravMult = gravSlider.value / 100;
    gravVal.textContent = gravMult.toFixed(gravMult < 1 ? 2 : 1) + '×';
  });

  weightSlider.addEventListener('input', () => {
    userKg = parseInt(weightSlider.value, 10);
    weightVal.textContent = userKg + ' kg';
    if (selected) renderPanel(selected, selected === SUN, PLANETS.indexOf(selected));
  });

  panelClose.addEventListener('click', () => selectBody(null));

  function startComet() {
    if (quiz) stopQuiz();
    if (missionMode) stopMissions();
    cometMode = true;
    sfx.click();
    canvas.style.cursor = 'crosshair';
    cometBtn.innerHTML = '&#9732; STOP COMETS';
    cometBtn.classList.add('active');
    gravWrap.classList.add('show');
    questionBar.className = 'show';
    questionBar.textContent = 'Drag and release to fling a comet — the Sun\'s gravity does the rest! Try the SUN GRAVITY slider below.';
  }

  function stopComet() {
    cometMode = false;
    comets = comets.filter(c => c.mission);
    aiming = null;
    canvas.style.cursor = missionMode ? 'crosshair' : 'grab';
    cometBtn.innerHTML = '&#9732; COMETS';
    cometBtn.classList.remove('active');
    gravWrap.classList.remove('show');
    questionBar.classList.remove('show');
