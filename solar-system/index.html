    questionBar.textContent = '';
  }

  cometBtn.addEventListener('click', () => {
    if (cometMode) stopComet();
    else startComet();
  });

  // ---- Missions ----
  // Real probe physics on top of the comet sandbox: every probe launches
  // from wherever Earth is right now, with a fuel budget (a max launch
  // speed) so the Sun's gravity has to bend the path the rest of the way.
  const MISSIONS = [
    { id: 'mars',    name: 'RED PLANET',    target: 'Mars',    maxKmS: 36,
      brief: 'Land a probe on Mars.',
      tip: 'Mars keeps moving while your probe flies — aim a little ahead of it, like leading a pass. NASA waits for a launch window every 26 months!' },
    { id: 'venus',   name: 'MORNING STAR',  target: 'Venus',   maxKmS: 36,
      brief: 'Hit Venus. Falling inward, your probe speeds up as it goes.',
      tip: 'Throw gently — toward the Sun the pull gets stronger and stronger. Watch the km/s number climb on the way in.' },
    { id: 'jupiter', name: 'GIANT LEAP',    target: 'Jupiter', maxKmS: 40,
      brief: 'Reach Jupiter, the biggest target out there.',
      tip: 'Long trips need more fuel. Fling hard and mostly outward — the Sun\'s gravity will curve your path.' },
    { id: 'saturn',  name: 'RING RUNNER',   target: 'Saturn',  maxKmS: 42,
      brief: 'Deliver a probe to Saturn, like Cassini did in 2004 after 7 years in flight.',
      tip: 'Watch the km/s readout drop as the probe climbs away from the Sun — it\'s trading speed for height, like a ball thrown upward.' },
    { id: 'sundive', name: 'SUN DIVER',     type: 'sundive',   maxKmS: 40,
      brief: 'Dive in closer than 3 Sun-radii, then swing back out past Earth\'s orbit — without falling in.',
      tip: 'The Parker Solar Probe does this for real. Aim just beside the Sun, not at it — gravity will whip you around.' },
    { id: 'orbit',   name: 'ORBITER',       type: 'orbit',     maxKmS: 40,
      brief: 'Put a probe into an orbit that goes all the way around the Sun once.',
      tip: 'Throw sideways, not at the Sun. Too slow and it falls in; too fast and it escapes. That balance is what keeps every planet in orbit!' },
    { id: 'mercury', name: 'HOT SHOT',      target: 'Mercury', maxKmS: 40,
      brief: 'Hit tiny, speedy Mercury deep in the Sun\'s gravity well.',
      tip: 'Mercury is small AND fast. Try 5× speed first to watch how it moves, then time your throw.' },
    { id: 'pluto',   name: 'THE LONG SHOT', target: 'Pluto',   maxKmS: 46,
      brief: 'Reach Pluto, like New Horizons did after a 9-year flight.',
      tip: 'Pluto barely moves, but it\'s tiny and very far. Almost all your fuel, aimed dead straight — and if you overdo it, the probe leaves the solar system for good.' },
  ];
  let missionMode = false;
  let mission = null;   // { def, attempts, busy }
  let missionStars = {};
  try { missionStars = JSON.parse(localStorage.getItem(MISSIONS_KEY) || '{}'); } catch (e) { missionStars = {}; }
  const missionBtn = document.getElementById('missionBtn');
  const STAR = '★', NOSTAR = '☆';
  function starText(n) { return STAR.repeat(n) + NOSTAR.repeat(3 - n); }
  function totalStars() { return MISSIONS.reduce((a, m) => a + (missionStars[m.id] || 0), 0); }

  function startMissions() {
    if (quiz) stopQuiz();
    if (cometMode) stopComet();
    missionMode = true;
    missionBtn.innerHTML = '&#128640; MISSION LIST';
    missionBtn.classList.add('active');
    canvas.style.cursor = 'crosshair';
    sfx.click();
    showMissionPanel();
    if (!mission) {
      questionBar.className = 'show mission';
      questionBar.innerHTML = 'MISSION CONTROL — pick a mission from the list<span class="mline">Every probe launches from Earth. Drag anywhere to aim, release to launch.</span>';
    }
  }
  function stopMissions() {
    missionMode = false;
    mission = null;
    comets = comets.filter(c => !c.mission);
    aiming = null;
    missionBtn.innerHTML = '&#128640; MISSIONS';
    missionBtn.classList.remove('active');
    canvas.style.cursor = 'grab';
    questionBar.classList.remove('show', 'mission', 'right', 'wrong');
    questionBar.textContent = '';
    if (selected === null) panel.classList.remove('open');
  }
  missionBtn.addEventListener('click', () => {
    if (!missionMode) startMissions();
    else if (panel.classList.contains('open')) { sfx.click(); panel.classList.remove('open'); }
    else { sfx.click(); showMissionPanel(); }
  });

  function showMissionPanel() {
    selected = null;
    const cur = mission ? mission.def.id : null;
    panelBody.innerHTML = `
      <h2>MISSIONS</h2>
      <div class="mhead">${totalStars()} / ${MISSIONS.length * 3} STARS · FEWER ATTEMPTS = MORE STARS</div>
      ${MISSIONS.map((m, i) => {
        const st = missionStars[m.id] || 0;
        return `<div class="mission ${cur === m.id ? 'current' : ''}" data-id="${m.id}">
          <div class="mname"><span>${i + 1}. ${m.name}</span><span class="stars ${st ? '' : 'none'}">${starText(st)}</span></div>
          <div class="mbrief">${m.brief}</div>
          <div class="mcap">FUEL: MAX ${m.maxKmS} KM/S</div>
          <div class="mtip">&#128161; ${m.tip}</div>
        </div>`;
      }).join('')}
      <div class="mtotal">${totalStars() === MISSIONS.length * 3 ? '&#127942; EVERY MISSION PERFECT — MISSION COMMANDER!' : 'Progress is saved on this device'}</div>
      <div class="panelBtns"><button id="endMissionsBtn">END MISSIONS</button></div>`;
    panelBody.querySelectorAll('.mission').forEach(el => el.addEventListener('click', () => startMission(MISSIONS.find(m => m.id === el.dataset.id))));
    document.getElementById('endMissionsBtn').addEventListener('click', stopMissions);
    panel.classList.add('open');
  }

  function startMission(def) {
    mission = { def, attempts: 0, busy: false };
    comets = comets.filter(c => !c.mission);
    aiming = null;
    sfx.select();
    showMissionPanel();
    if (window.innerWidth <= 760) panel.classList.remove('open'); // the bottom sheet would cover the sky
    updateMissionBar();
  }
  function updateMissionBar(extra) {
    if (!mission) return;
    const m = mission.def, idx = MISSIONS.indexOf(m) + 1;
    questionBar.className = 'show mission';
    questionBar.innerHTML = `MISSION ${idx}: ${m.name} — ${m.brief}<span class="mline">${extra || `Drag to aim from Earth (max ${m.maxKmS} km/s), release to launch · attempt ${mission.attempts + 1}`}</span>`;
  }

  function launchProbe(aim) {
    if (!mission || mission.busy) return;
    comets = comets.filter(c => !c.mission); // one probe in flight at a time
    mission.attempts++;
    const VEL_SCALE = 0.05;
    comets.push({
      x: aim.x0, z: aim.z0,
      vx: (aim.x1 - aim.x0) * VEL_SCALE,
      vz: (aim.z1 - aim.z0) * VEL_SCALE,
      trail: [], mission: true, leftHome: false,
      minR: Infinity, sweep: 0, lastAng: Math.atan2(aim.z0, aim.x0),
    });
    sfx.launch();
    updateMissionBar(`Probe away at ${speedKmS(comets[comets.length - 1].vx, comets[comets.length - 1].vz).toFixed(1)} km/s · attempt ${mission.attempts}`);
  }

  const earthOrbitR = () => orbitRadius(PLANETS[2]);
  // Called every physics sub-step for a mission probe. Returns true when the
  // probe has just completed its mission (and should be removed).
  function checkMissionProgress(c, r) {
    if (!mission || mission.busy) return false;
    const t = mission.def.type;
    if (t === 'sundive' && c.minR < SUN.r * 3 && r > earthOrbitR() && c.leftHome) {
      impacts.push({ wx: c.x, wy: 0, wz: c.z, r: 4, life: 0 });
      missionWon(`Closest approach ${(c.minR / SUN.r).toFixed(1)}× the Sun's radius — and it survived!`);
      return true;
    }
    // A lap counts a whisker early, so a probe that swings right back to
    // its launch point wins the moment the loop closes.
    if (t === 'orbit' && Math.abs(c.sweep) >= Math.PI * 2 - 0.15) {
      impacts.push({ wx: c.x, wy: 0, wz: c.z, r: 4, life: 0 });
      missionWon('One full lap around the Sun — that\'s a real orbit!');
      return true;
    }
    return false;
  }
  function cometEnded(c, reason, planetIndex) {
    if (!c.mission || !mission || mission.busy) return;
    const m = mission.def;
    if (reason === 'hit') {
      const name = PLANETS[planetIndex].name;
      if (m.target === name) { missionWon(`Touchdown on ${name}!`); return; }
      if (name === 'Earth') { missionLost('The probe came back and hit Earth!'); return; }
      missionLost(m.target ? `Oops — that was ${name}, not ${m.target}.` : `Crashed into ${name}!`);
    } else if (reason === 'sun') {
      missionLost(m.type === 'sundive' ? 'Too close! The probe fell into the Sun.' : 'The probe fell into the Sun!');
    } else {
      missionLost(m.type === 'orbit' ? 'Too fast — it escaped the Sun\'s gravity.' : 'The probe flew off into deep space.');
    }
  }
  function missionWon(msg) {
    const m = mission.def;
    const stars = mission.attempts <= 1 ? 3 : mission.attempts <= 3 ? 2 : 1;
    const prev = missionStars[m.id] || 0;
    if (stars > prev) {
      missionStars[m.id] = stars;
      try { localStorage.setItem(MISSIONS_KEY, JSON.stringify(missionStars)); } catch (e) {}
    }
    mission.busy = true;
    sfx.win();
    questionBar.className = 'show right';
    questionBar.innerHTML = `&#10003; MISSION COMPLETE — ${msg}<span class="mline">${starText(stars)} in ${mission.attempts} attempt${mission.attempts === 1 ? '' : 's'}${stars > prev ? ' · NEW BEST' : ''}</span>`;
    const idx = MISSIONS.indexOf(m);
    setTimeout(() => {
      if (!missionMode) return;
      if (idx + 1 < MISSIONS.length) startMission(MISSIONS[idx + 1]);
      else { mission = null; showMissionPanel(); questionBar.className = 'show mission'; questionBar.innerHTML = 'ALL MISSIONS FLOWN — replay any of them for 3 stars<span class="mline">Every probe launches from Earth. Drag anywhere to aim, release to launch.</span>'; }
    }, 2600);
  }
  function missionLost(msg) {
    mission.busy = true;
    sfx.lost();
    questionBar.className = 'show wrong';
    questionBar.innerHTML = `&#10007; ${msg}<span class="mline">Try again — attempt ${mission.attempts + 1}</span>`;
    setTimeout(() => { if (mission) { mission.busy = false; updateMissionBar(); } }, 1600);
  }

  // ---- Quiz ----
  const QUIZ_QUESTIONS = [
    { test: p => p.name === 'Jupiter',  q: 'Click the largest planet in the solar system' },
    { test: p => p.name === 'Mercury',  q: 'Click the planet closest to the Sun' },
    { test: p => p.name === 'Saturn',   q: 'Click the planet famous for its rings' },
    { test: p => p.name === 'Mars',     q: 'Click the Red Planet' },
    { test: p => p.name === 'Venus',    q: 'Click the hottest planet' },
    { test: p => p.name === 'Earth',    q: 'Click the only planet known to have life' },
    { test: p => p.name === 'Neptune',  q: 'Click the farthest true planet from the Sun (dwarf planets don\'t count!)' },
    { test: p => p.name === 'Uranus',   q: 'Click the planet that is tipped on its side' },
    { test: p => p.name === 'Mercury',  q: 'Click the smallest true planet (dwarf planets don\'t count!)' },
    { test: p => p.name === 'Jupiter',  q: 'Click the planet with the Great Red Spot' },
    { test: p => p.moons === 1,         q: 'Click the planet with exactly one moon' },
    { test: p => p.name === 'Mars',     q: 'Click the planet with Olympus Mons (the biggest volcano)' },
    { test: p => p.name === 'Pluto',    q: 'Click the dwarf planet that used to be planet #9' },
    { test: p => p.name === 'Saturn',   q: 'Click the planet with the most moons (146!)' },
    { test: p => p.name === 'Neptune',  q: 'Click the windiest planet' },
    { test: p => p.name === 'Saturn',   q: 'Click the planet so light it would float in water' },
    { test: p => p.name === 'Venus',    q: 'Click the planet that spins backward' },
    { test: p => p.name === 'Pluto',    q: 'Click the body with the most tilted orbit (spin the view to see it!)' },
    { test: p => p.name === 'Jupiter',  q: 'Click the planet with the shortest day (under 10 hours!)' },
    { test: p => p.name === 'Venus',    q: 'Click the planet with the longest day (longer than its year!)' },
    { test: p => p.name === 'Neptune',  q: 'Click the planet that was found by math before anyone saw it' },
    { test: p => p.name === 'Mars',     q: 'Click the planet that has two tiny moons, Phobos and Deimos' },
    { test: p => p.name === 'Jupiter',  q: 'Click the planet whose four biggest moons Galileo spotted in 1610' },
    { test: p => p.name === 'Saturn',   q: 'Click the planet that Titan, a moon with lakes of methane, orbits' },
    { test: p => p.name === 'Uranus',   q: 'Click the coldest of the giant planets (about −195°C)' },
    { test: p => p.name === 'Earth',    q: 'Click the planet where sunlight takes about 8 minutes to arrive' },
    { test: p => p.name === 'Mercury',  q: 'Click the planet that races around the Sun at 47 km/s' },
    { test: p => p.name === 'Pluto',    q: 'Click the dwarf planet with a heart-shaped glacier' },
  ];

  function startQuiz() {
    if (cometMode) stopComet();
    if (missionMode) stopMissions();
    sfx.click();
    quiz = {
      score: 0,
      best: parseInt(localStorage.getItem(QUIZ_BEST_KEY) || '0', 10),
      asked: [],
    };
    nextQuestion();
    quizBtn.textContent = 'STOP QUIZ';
    quizBtn.classList.add('active');
  }

  function stopQuiz() {
    quiz = null;
    questionBar.classList.remove('show', 'right', 'wrong');
    questionBar.textContent = '';
    quizBtn.textContent = 'QUIZ ME';
    quizBtn.classList.remove('active');
  }

  function nextQuestion() {
    // Pick a question we haven't just asked
    let pool = QUIZ_QUESTIONS.filter(q => !quiz.asked.slice(-4).includes(q));
    if (pool.length === 0) pool = QUIZ_QUESTIONS;
    const q = pool[Math.floor(Math.random() * pool.length)];
    quiz.asked.push(q);
    quiz.current = q;
    quiz.targetIndex = PLANETS.findIndex(p => q.test(p));
    questionBar.className = 'show';
    questionBar.textContent = `${q.q}  —  Score: ${quiz.score}  Best: ${quiz.best}`;
  }

  function handleQuizAnswer(planetIndex) {
    if (!quiz) return;
    const correct = quiz.current.test(PLANETS[planetIndex]);
    if (correct) {
      quiz.score++;
      if (quiz.score > quiz.best) {
        quiz.best = quiz.score;
        localStorage.setItem(QUIZ_BEST_KEY, quiz.best);
        sfx.best();
      } else sfx.right();
      quizFlash = 30;
      questionBar.className = 'show right';
      questionBar.textContent = `✓ Correct!  Score: ${quiz.score}  Best: ${quiz.best}`;
      setTimeout(nextQuestion, 1100);
    } else {
      sfx.wrong();
      quizFlash = -30;
      questionBar.className = 'show wrong';
      const correctName = PLANETS[quiz.targetIndex].name;
      questionBar.textContent = `✗ Nope — that was ${PLANETS[planetIndex].name}. Answer: ${correctName}.  Score reset.`;
      quiz.score = 0;
      setTimeout(nextQuestion, 1800);
    }
  }

  quizBtn.addEventListener('click', () => {
    if (quiz) stopQuiz();
    else startQuiz();
  });

  // ---- Keyboard shortcuts ----
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
    const speedBtn = v => document.querySelector(`button[data-speed="${v}"]`);
    switch (e.key) {
      case ' ': e.preventDefault(); pauseBtn.click(); break;
      case '1': speedBtn('0.5').click(); break;
      case '2': speedBtn('1').click(); break;
      case '3': speedBtn('5').click(); break;
      case '4': speedBtn('20').click(); break;
      case 'l': case 'L': if (mode === 'orbit') labelBtn.click(); break;
      case 't': case 'T': if (mode === 'orbit') trailBtn.click(); break;
      case 'r': case 'R': viewBtn.click(); break;
      case 'm': case 'M': if (mode === 'orbit') missionBtn.click(); break;
      case 'c': case 'C': if (mode === 'orbit') cometBtn.click(); break;
      case 'q': case 'Q': quizBtn.click(); break;
      case 's': case 'S': muteBtn.click(); break;
      case 'Escape':
        if (panel.classList.contains('open') && selected) selectBody(null);
        else if (missionMode) stopMissions();
        else if (cometMode) stopComet();
        else if (quiz) stopQuiz();
        else if (mode !== 'orbit') setMode(mode);
        else selectBody(null);
        break;
    }
  });

  requestAnimationFrame(loop);
</script>
</body>
</html>
