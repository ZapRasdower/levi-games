<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(900px 500px at 50% -80px, #191932, #0f0f1a 70%);
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 18px rgba(255,230,0,0.35);
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-align: center;
    }

    #gameCanvas {
      border: 3px solid #333;
      border-radius: 10px;
      background: #0c0c1c;
      display: block;
      max-width: 100%;
      touch-action: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      cursor: none;
    }

    #ui {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 560px;
      margin-top: 14px;
      font-size: 0.78rem;
      color: #99a;
      letter-spacing: 1px;
    }

    #ui .pill {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      padding: 6px 14px;
    }

    #ui span { color: #ffe600; font-size: 0.95rem; margin-left: 5px; }
    #ui .lives { color: #ff5b6b; }

    #muteBtn {
      background: #1a1a2e;
      border: 1px solid #2e2e4e;
      border-radius: 999px;
      color: #ffe600;
      font-size: 0.9rem;
      padding: 5px 12px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.12s;
    }

    #muteBtn:hover { border-color: #ffe600; }

    #message {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 2px;
      min-height: 22px;
      text-align: center;
    }

    .back-link {
      margin-top: 24px;
      color: #555;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }

    .back-link:hover { color: #ffe600; }
  </style>
</head>
<body>

  <h1>&#129521; Brick Breaker</h1>
  <p class="subtitle">Move the paddle &middot; Levi IS the ball &middot; catch the power-ups &middot; P to pause</p>

  <canvas id="gameCanvas" width="560" height="640"></canvas>

  <div id="ui">
    <div class="pill">SCORE<span id="score">0</span></div>
    <div class="pill">LEVEL<span id="level">1</span></div>
    <div class="pill">BEST<span id="best">0</span></div>
    <div class="pill lives" id="lives">&#9829;&#9829;&#9829;</div>
    <button id="muteBtn" title="toggle sound">&#128266;</button>
  </div>

  <div id="message">Click, tap or press SPACE to launch Levi</div>

  <a class="back-link" href="../index.html">&larr; back to all games</a>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const bestEl = document.getElementById('best');
  const livesEl = document.getElementById('lives');
  const msgEl = document.getElementById('message');

  const BEST_KEY = 'brickBreaker.best';
  const MUTE_KEY = 'brickBreaker.muted';

  // ---- SOUND (tiny WebAudio synth — no audio files) ----
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  let audio = null;
  function ac() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  function beep(freq, dur, type = 'sine', vol = 0.07, slide = 0) {
    if (muted) return;
    try {
      const a = ac();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g).connect(a.destination);
      o.start();
      o.stop(a.currentTime + dur);
    } catch (e) { /* audio blocked — stay silent */ }
  }
  const sfx = {
    paddle()  { beep(300, 0.06, 'square', 0.05, 80); },
    wall()    { beep(220, 0.05, 'square', 0.035); },
    brick(n)  { beep(480 + Math.min(10, n) * 55, 0.09, 'square', 0.06); },
    tough()   { beep(340, 0.08, 'sawtooth', 0.05); },
    power(k)  { beep(620, 0.09); setTimeout(() => beep(930, 0.12), 70); },
    lost()    { beep(320, 0.45, 'sawtooth', 0.08, -260); },
    clear()   { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.06), i * 110)); },
    win()     { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.07), i * 130)); },
    best()    { beep(660, 0.1); setTimeout(() => beep(880, 0.12), 90); setTimeout(() => beep(1108, 0.18), 200); },
  };

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    refreshMute();
    muteBtn.blur();
  });
  refreshMute();

  // ---- Levi sprite (the ball!) ----
  const leviImg = new Image();
  leviImg.src = 'levi.png';
  let imgLoaded = false;
  leviImg.onload = () => { imgLoaded = true; };

  // ---- State ----
  let state = 'title'; // title | play | clear | over | win | paused
  let score = 0;
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  let lives = 3;
  let level = 0;       // 0-based level index
  let loopNum = 0;     // how many times the 6 levels were beaten (speeds up)
  let bricks = [];
  let balls = [];
  let powerups = [];
  let particles = [];
  let floaters = [];
  let brickStreak = 0; // bricks broken since last paddle touch (combo pitch)
  let wideTimer = 0;
  let slowTimer = 0;
  let shake = 0;
  bestEl.textContent = best;

  const paddle = { x: W / 2, w: 96, baseW: 96, h: 14, y: H - 36 };

  const BALL_R = 10;
  const BASE_SPEED = 5.2;
  function ballSpeed() {
    return (BASE_SPEED + level * 0.25 + loopNum * 0.8) * (slowTimer > 0 ? 0.7 : 1);
  }

  // ---- Bricks ----
  const BRICK_COLS = 10, BRICK_W = 50, BRICK_H = 22, BRICK_GAP = 4;
  const GRID_X = (W - BRICK_COLS * (BRICK_W + BRICK_GAP) + BRICK_GAP) / 2;
  const GRID_Y = 70;
  const ROW_COLORS = ['#ff5b6b', '#ff9d4d', '#ffe600', '#6bff8e', '#6bd1ff', '#b06bff', '#ff6bdc', '#6bffd1'];

  // Each level is a function (col, row) -> hp (0 = no brick, 1 or 2)
  const LEVELS = [
    { name: 'WARM-UP',      rows: 5, hp: (c, r) => 1 },
    { name: 'CHECKERBOARD', rows: 6, hp: (c, r) => (c + r) % 2 === 0 ? 1 : 0 },
    { name: 'THE PYRAMID',  rows: 7, hp: (c, r) => Math.abs(c - 4.5) <= r * 0.75 ? 1 : 0 },
    { name: 'DIAMOND MINE', rows: 7, hp: (c, r) => Math.abs(c - 4.5) + Math.abs(r - 3) <= 4 ? (r === 3 ? 2 : 1) : 0 },
    { name: 'THE FORTRESS', rows: 7, hp: (c, r) => (r === 0 || c === 0 || c === 9) ? 2 : (r < 5 ? 1 : 0) },
    { name: 'FINAL BOSS',   rows: 8, hp: (c, r) => (r % 2 === 0 ? (c % 3 !== 1 ? 2 : 1) : 1) },
  ];

  function buildLevel(idx) {
    bricks = [];
    const def = LEVELS[idx];
    for (let r = 0; r < def.rows; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        const hp = def.hp(c, r);
        if (!hp) continue;
        bricks.push({
          x: GRID_X + c * (BRICK_W + BRICK_GAP),
          y: GRID_Y + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W, h: BRICK_H,
          hp, maxHp: hp,
          color: ROW_COLORS[r % ROW_COLORS.length],
        });
      }
    }
  }

  // ---- Balls ----
  function newBall(stuck = true) {
    return {
      x: paddle.x, y: paddle.y - BALL_R - 6,
      vx: 0, vy: 0, stuck,
      rot: 0, spin: 0,
    };
  }

  function launch(ball) {
    const a = (-60 - Math.random() * 60) * Math.PI / 180; // up-left to up-right
    const sp = ballSpeed();
    ball.vx = Math.cos(a) * sp;
    ball.vy = Math.sin(a) * sp;
    ball.stuck = false;
    ball.spin = (Math.random() < 0.5 ? -1 : 1) * 0.12;
  }

  // ---- Power-ups ----
  const POWER_KINDS = [
    { kind: 'wide',  label: 'WIDE',  color: '#6bd1ff' },
    { kind: 'multi', label: 'x3',    color: '#ff6bdc' },
    { kind: 'slow',  label: 'SLOW',  color: '#6bffd1' },
    { kind: 'life',  label: '+1UP',  color: '#ff5b6b' },
  ];

  function maybeDropPower(x, y) {
    if (Math.random() > 0.13) return;
    // life is rarer than the rest
    let p = POWER_KINDS[Math.floor(Math.random() * POWER_KINDS.length)];
    if (p.kind === 'life' && Math.random() < 0.5) p = POWER_KINDS[0];
    powerups.push({ x, y, vy: 2.2, ...p });
  }

  function applyPower(p) {
    sfx.power(p.kind);
    spawnFloater(p.x, p.y - 10, p.label, p.color);
    score += 50;
    if (p.kind === 'wide') wideTimer = 12 * 60;
    else if (p.kind === 'slow') slowTimer = 8 * 60;
    else if (p.kind === 'life') { if (lives < 5) lives++; updateHud(); }
    else if (p.kind === 'multi') {
      const extra = [];
      for (const b of balls) {
        if (balls.length + extra.length >= 6) break;
        if (b.stuck) continue;
        for (const da of [-0.5, 0.5]) {
          if (balls.length + extra.length >= 6) break;
          const sp = Math.hypot(b.vx, b.vy) || ballSpeed();
          const ang = Math.atan2(b.vy, b.vx) + da;
          extra.push({ ...b, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, spin: -b.spin });
        }
      }
      balls.push(...extra);
    }
  }

  // ---- Particles & floaters ----
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3.5;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
        life: 22 + Math.random() * 14, maxLife: 36, color,
      });
    }
  }

  function spawnFloater(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 45, maxLife: 45 });
  }

  // ---- HUD ----
  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = (level + 1) + (loopNum > 0 ? '+' : '');
    livesEl.innerHTML = '&#9829;'.repeat(lives) + '<span style="color:#3a2a33">' + '&#9829;'.repeat(Math.max(0, 5 - lives)) + '</span>';
  }

  // ---- Game flow ----
  function startGame() {
    score = 0; lives = 3; level = 0; loopNum = 0;
    startLevel();
    state = 'play';
    msgEl.textContent = 'Click, tap or press SPACE to launch Levi';
  }

  function startLevel() {
    buildLevel(level);
    balls = [newBall(true)];
    powerups = [];
    particles = [];
    floaters = [];
    wideTimer = 0; slowTimer = 0;
    brickStreak = 0;
    paddle.w = paddle.baseW;
    updateHud();
  }

  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, best);
      setTimeout(() => sfx.best(), 500);
      return true;
    }
    return false;
  }

  // ---- Update ----
  function update() {
    if (shake > 0) shake *= 0.85;
    if (state !== 'play') return;

    if (wideTimer > 0) wideTimer--;
    if (slowTimer > 0) slowTimer--;
    const targetW = wideTimer > 0 ? 150 : paddle.baseW;
    paddle.w += (targetW - paddle.w) * 0.15;

    // keyboard paddle movement
    if (keys.left)  paddle.x -= 9;
    if (keys.right) paddle.x += 9;
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

    // balls
    for (const b of balls) {
      if (b.stuck) {
        b.x = paddle.x;
        b.y = paddle.y - BALL_R - 6;
        continue;
      }
      b.x += b.vx;
      b.y += b.vy;
      b.rot += b.spin;

      // walls
      if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); sfx.wall(); }
      if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); sfx.wall(); }
      if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); sfx.wall(); }

      // paddle
      if (b.vy > 0 &&
          b.y + BALL_R >= paddle.y && b.y + BALL_R <= paddle.y + paddle.h + 10 &&
          b.x >= paddle.x - paddle.w / 2 - BALL_R && b.x <= paddle.x + paddle.w / 2 + BALL_R) {
        const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w / 2)));
        const ang = rel * 62 * Math.PI / 180 - Math.PI / 2; // -90° ± 62°
        const sp = ballSpeed();
        b.vx = Math.cos(ang) * sp;
        b.vy = Math.sin(ang) * sp;
        b.y = paddle.y - BALL_R;
        b.spin = rel * 0.22;
        brickStreak = 0;
        sfx.paddle();
      }

      // bricks (first hit this frame wins)
      for (const br of bricks) {
        if (br.hp <= 0) continue;
        const nx = Math.max(br.x, Math.min(b.x, br.x + br.w));
        const ny = Math.max(br.y, Math.min(b.y, br.y + br.h));
        const dx = b.x - nx, dy = b.y - ny;
        if (dx * dx + dy * dy > BALL_R * BALL_R) continue;

        // bounce along the shallower penetration axis
        const penX = BALL_R - Math.abs(dx);
        const penY = BALL_R - Math.abs(dy);
        if (penX < penY) b.vx = dx >= 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
        else b.vy = dy >= 0 ? Math.abs(b.vy) : -Math.abs(b.vy);

        br.hp--;
        if (br.hp <= 0) {
          brickStreak++;
          score += br.maxHp === 2 ? 25 : 10;
          burst(br.x + br.w / 2, br.y + br.h / 2, br.color, 10);
          if (brickStreak > 1) spawnFloater(br.x + br.w / 2, br.y, 'x' + brickStreak, '#fff');
          maybeDropPower(br.x + br.w / 2, br.y + br.h / 2);
          sfx.brick(brickStreak);
        } else {
          sfx.tough();
          burst(b.x, b.y, '#ffffff', 4);
        }
        updateHud();
        break;
      }
    }

    // lost balls
    balls = balls.filter(b => b.y < H + BALL_R * 3);
    if (balls.length === 0) {
      lives--;
      shake = 12;
      sfx.lost();
      updateHud();
      if (lives <= 0) {
        state = 'over';
        saveBest();
        msgEl.textContent = '';
      } else {
        balls = [newBall(true)];
        brickStreak = 0;
      }
    }

    // level clear
    if (bricks.every(br => br.hp <= 0) && state === 'play') {
      score += 300;
      saveBest();
      state = 'clear';
      sfx.clear();
      msgEl.textContent = '';
      updateHud();
    }

    // power-ups fall
    for (const p of powerups) p.y += p.vy;
    powerups = powerups.filter(p => {
      if (p.y > H + 20) return false;
      if (p.y + 10 >= paddle.y && p.y - 10 <= paddle.y + paddle.h &&
          p.x >= paddle.x - paddle.w / 2 - 12 && p.x <= paddle.x + paddle.w / 2 + 12) {
        applyPower(p);
        updateHud();
        return false;
      }
      return true;
    });

    // particles & floaters
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; }
    particles = particles.filter(p => p.life > 0);
    for (const f of floaters) { f.y -= 0.7; f.life--; }
    floaters = floaters.filter(f => f.life > 0);
  }

  // ---- Render ----
  function render() {
    if (shake > 0.5) {
      ctx.setTransform(1, 0, 0, 1, (Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    } else {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // background
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#10102a');
    g.addColorStop(1, '#0a0a16');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // faint grid
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // bricks
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      const weak = br.maxHp === 2 && br.hp === 1;
      ctx.fillStyle = br.color;
      ctx.globalAlpha = weak ? 0.55 : 1;
      roundRect(br.x, br.y, br.w, br.h, 4);
      ctx.fill();
      // top shine
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      roundRect(br.x + 2, br.y + 2, br.w - 4, 5, 2);
      ctx.fill();
      // tough brick rivets
      if (br.maxHp === 2 && br.hp === 2) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath();
        ctx.arc(br.x + 8, br.y + br.h / 2, 2.5, 0, Math.PI * 2);
        ctx.arc(br.x + br.w - 8, br.y + br.h / 2, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (weak) {
        // cracks
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(br.x + br.w * 0.3, br.y + 2);
        ctx.lineTo(br.x + br.w * 0.45, br.y + br.h * 0.6);
        ctx.lineTo(br.x + br.w * 0.35, br.y + br.h - 2);
        ctx.moveTo(br.x + br.w * 0.7, br.y + 3);
        ctx.lineTo(br.x + br.w * 0.6, br.y + br.h * 0.5);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // power-ups
    for (const p of powerups) {
      ctx.fillStyle = p.color;
      roundRect(p.x - 22, p.y - 10, 44, 20, 8);
      ctx.fill();
      ctx.fillStyle = '#0c0c1c';
      ctx.font = 'bold 11px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x, p.y + 1);
    }
    ctx.textBaseline = 'alphabetic';

    // paddle
    const pg = ctx.createLinearGradient(paddle.x - paddle.w / 2, 0, paddle.x + paddle.w / 2, 0);
    pg.addColorStop(0, '#6bd1ff');
    pg.addColorStop(0.5, '#e8f8ff');
    pg.addColorStop(1, '#6bd1ff');
    ctx.fillStyle = pg;
    roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.fillStyle = wideTimer > 0 ? 'rgba(107,209,255,0.35)' : 'rgba(107,209,255,0.15)';
    roundRect(paddle.x - paddle.w / 2 - 3, paddle.y - 3, paddle.w + 6, paddle.h + 6, 9);
    ctx.fill();

    // balls: spinning Levi!
    for (const b of balls) {
      // glow
      const bg = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, BALL_R * 3);
      bg.addColorStop(0, 'rgba(255,230,0,0.35)');
      bg.addColorStop(1, 'rgba(255,230,0,0)');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R * 3, 0, Math.PI * 2); ctx.fill();

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      if (imgLoaded) {
        const h = 46;
        const w = h * (leviImg.width / leviImg.height);
        ctx.drawImage(leviImg, -w / 2, -h / 2, w, h);
      } else {
        ctx.fillStyle = '#ffe600';
        ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // floaters
    for (const f of floaters) {
      ctx.globalAlpha = f.life / f.maxLife;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 13px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // power-up timers
    let ty = 8;
    if (wideTimer > 0) { drawTimerBar('WIDE', wideTimer / (12 * 60), '#6bd1ff', ty); ty += 16; }
    if (slowTimer > 0) { drawTimerBar('SLOW', slowTimer / (8 * 60), '#6bffd1', ty); }

    drawScreens();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function drawTimerBar(label, frac, color, y) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(W - 130, y, 122, 12, 6);
    ctx.fill();
    ctx.fillStyle = color;
    roundRect(W - 128, y + 2, 118 * frac, 8, 4);
    ctx.fill();
    ctx.fillStyle = '#0c0c1c';
    ctx.font = 'bold 8px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(label, W - 124, y + 9);
  }

  function drawScreens() {
    ctx.textAlign = 'center';
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.004);
    if (state === 'title') {
      ctx.fillStyle = 'rgba(6,6,16,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 36px Courier New';
      ctx.fillText('BRICK BREAKER', W / 2, H / 2 - 130);
      if (imgLoaded) {
        const h = 110;
        const w = h * (leviImg.width / leviImg.height);
        ctx.save();
        ctx.translate(W / 2, H / 2 - 40);
        ctx.rotate(Math.sin(performance.now() * 0.002) * 0.4);
        ctx.drawImage(leviImg, -w / 2, -h / 2, w, h);
        ctx.restore();
      }
      ctx.fillStyle = '#ccc';
      ctx.font = '14px Courier New';
      ctx.fillText('Levi is the ball — bounce him into the bricks!', W / 2, H / 2 + 60);
      ctx.fillText('mouse / touch / arrows to move the paddle', W / 2, H / 2 + 84);
      ctx.fillStyle = `rgba(255,230,0,${0.4 + 0.5 * pulse})`;
      ctx.font = 'bold 15px Courier New';
      ctx.fillText('CLICK, TAP OR PRESS SPACE TO PLAY', W / 2, H / 2 + 130);
    } else if (state === 'clear') {
      ctx.fillStyle = 'rgba(6,6,16,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#6bffd1';
      ctx.font = 'bold 30px Courier New';
      ctx.fillText(`LEVEL ${level + 1} CLEAR!`, W / 2, H / 2 - 30);
      ctx.fillStyle = '#ccc';
      ctx.font = '14px Courier New';
      ctx.fillText(`${LEVELS[level].name} — +300 pts`, W / 2, H / 2 + 4);
      ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.5 * pulse})`;
      ctx.fillText('press SPACE / tap for the next level', W / 2, H / 2 + 44);
    } else if (state === 'over') {
      ctx.fillStyle = 'rgba(6,6,16,0.75)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff6b7a';
      ctx.font = 'bold 32px Courier New';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px Courier New';
      ctx.fillText(`SCORE ${score}`, W / 2, H / 2 - 4);
      ctx.fillStyle = '#ffe600';
      ctx.font = '13px Courier New';
      ctx.fillText(score >= best ? '★ NEW BEST!' : `BEST ${best}`, W / 2, H / 2 + 24);
      ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.5 * pulse})`;
      ctx.fillText('press SPACE / tap to try again', W / 2, H / 2 + 60);
    } else if (state === 'win') {
      ctx.fillStyle = 'rgba(6,6,16,0.8)';
      ctx.fillRect(0, 0, W, H);
      // confetti
      for (let i = 0; i < 70; i++) {
        const cx = (i * 89 + performance.now() * 0.04 * ((i % 3) + 1)) % W;
        const cy = (i * 47 + performance.now() * (0.05 + (i % 5) * 0.02)) % H;
        ctx.fillStyle = ROW_COLORS[i % ROW_COLORS.length];
        ctx.fillRect(cx, cy, 6, 6);
      }
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 30px Courier New';
      ctx.fillText('ALL BRICKS BUSTED!', W / 2, H / 2 - 70);
      if (imgLoaded) {
        const h = 120;
        const w = h * (leviImg.width / leviImg.height);
        ctx.drawImage(leviImg, W / 2 - w / 2, H / 2 - 50, w, h);
      }
      ctx.fillStyle = '#6bffd1';
      ctx.font = 'bold 18px Courier New';
      ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 2 + 100);
      ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.5 * pulse})`;
      ctx.font = '13px Courier New';
      ctx.fillText('press SPACE / tap to loop the levels — faster!', W / 2, H / 2 + 136);
    } else if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffe600';
      ctx.font = 'bold 26px Courier New';
      ctx.fillText('PAUSED', W / 2, H / 2);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- Fixed timestep loop ----
  const TICK_MS = 1000 / 60;
  let lastTime = 0, acc = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > 250) dt = 250;
    acc += dt;
    let safety = 8;
    while (acc >= TICK_MS && safety-- > 0) {
      update();
      acc -= TICK_MS;
    }
    render();
  }

  // ---- Input ----
  function primaryAction() {
    if (state === 'title') { startGame(); return; }
    if (state === 'play') {
      for (const b of balls) if (b.stuck) launch(b);
      return;
    }
    if (state === 'paused') { state = 'play'; return; }
    if (state === 'clear') {
      if (level === LEVELS.length - 1) {
        state = 'win';
        sfx.win();
      } else {
        level++;
        startLevel();
        state = 'play';
      }
      return;
    }
    if (state === 'win') {
      loopNum++;
      level = 0;
      startLevel();
      state = 'play';
      return;
    }
    if (state === 'over') startGame();
  }

  const keys = { left: false, right: false };
  document.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); keys.left = true; }
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); keys.right = true; }
    else if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); primaryAction(); }
    else if (e.code === 'KeyP') {
      e.preventDefault();
      if (state === 'play') state = 'paused';
      else if (state === 'paused') state = 'play';
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener('mousemove', e => {
    if (state === 'play' || state === 'paused') {
      paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, canvasX(e.clientX)));
    }
  });

  canvas.addEventListener('mousedown', primaryAction);

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state === 'play') {
      paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, canvasX(e.touches[0].clientX)));
      for (const b of balls) if (b.stuck) launch(b);
    } else {
      primaryAction();
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (state === 'play' || state === 'paused') {
      paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, canvasX(e.touches[0].clientX)));
    }
  }, { passive: false });

  // Auto-pause when the tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'play') state = 'paused';
    lastTime = 0;
  });

  // boot: build level 1 so the title screen has bricks behind it
  buildLevel(0);
  balls = [newBall(true)];
  updateHud();
  requestAnimationFrame(loop);
</script>
</body>
</html>
