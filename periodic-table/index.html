<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Periodic Table - Levi's Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #04040c;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px 40px;
    }

    h1 {
      font-size: 1.8rem;
      color: #ffe600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 18px;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
      max-width: 960px;
      width: 100%;
    }

    .controls input {
      background: #1a1a2e;
      color: #ffe600;
      border: 2px solid #333;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 1px;
      width: 180px;
    }

    .controls input::placeholder { color: #555; }
    .controls input:focus { outline: none; border-color: #ffe600; }

    button {
      background: #1a1a2e;
      color: #ffe600;
      border: 2px solid #333;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      letter-spacing: 1px;
    }
    button:hover { border-color: #ffe600; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      justify-content: center;
      margin-bottom: 18px;
      max-width: 1000px;
    }

    .legend span {
      font-size: 0.7rem;
      letter-spacing: 1px;
      padding: 3px 8px;
      border: 1px solid #333;
      border-radius: 2px;
      cursor: pointer;
      user-select: none;
    }
    .legend span.dim { opacity: 0.35; }

    .table-wrap {
      width: 100%;
      max-width: 1100px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .ptable {
      display: grid;
      grid-template-columns: repeat(18, minmax(48px, 1fr));
      grid-template-rows: repeat(10, auto);
      gap: 3px;
      min-width: 900px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border: 2px solid #222;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px 4px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, border-color 0.1s;
      overflow: hidden;
    }

    .cell:hover {
      transform: scale(1.08);
      z-index: 2;
      border-color: #ffe600;
    }

    .cell.dim { opacity: 0.15; pointer-events: none; }
    .cell.match { box-shadow: 0 0 0 2px #ffe600 inset; }

    .cell .num {
      font-size: 0.55rem;
      opacity: 0.75;
      line-height: 1;
    }
    .cell .sym {
      font-size: 1.05rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 0;
      line-height: 1;
    }
    .cell .name {
      font-size: 0.5rem;
      text-align: center;
      letter-spacing: 0;
      opacity: 0.85;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell .mass {
      font-size: 0.5rem;
      text-align: center;
      opacity: 0.55;
      line-height: 1;
    }

    /* Category colors */
    .c-alkali       { background: #5a1820; border-color: #ff6b6b; }
    .c-alkaline     { background: #5a3618; border-color: #ffaf6b; }
    .c-transition   { background: #4a3a14; border-color: #ffd96b; }
    .c-post         { background: #20384a; border-color: #6bb8ff; }
    .c-metalloid    { background: #1f4a32; border-color: #6bffaf; }
    .c-nonmetal     { background: #143a4a; border-color: #6be5ff; }
    .c-halogen      { background: #143a3a; border-color: #6bffd1; }
    .c-noble        { background: #36204a; border-color: #c66bff; }
    .c-lanthanide   { background: #4a1f44; border-color: #ff6bdc; }
    .c-actinide     { background: #4a1430; border-color: #ff6ba0; }
    .c-unknown      { background: #2a2a2a; border-color: #888; }

    .lg-alkali     { color: #ff6b6b; border-color: #ff6b6b55; background: #ff6b6b11; }
    .lg-alkaline   { color: #ffaf6b; border-color: #ffaf6b55; background: #ffaf6b11; }
    .lg-transition { color: #ffd96b; border-color: #ffd96b55; background: #ffd96b11; }
    .lg-post       { color: #6bb8ff; border-color: #6bb8ff55; background: #6bb8ff11; }
    .lg-metalloid  { color: #6bffaf; border-color: #6bffaf55; background: #6bffaf11; }
    .lg-nonmetal   { color: #6be5ff; border-color: #6be5ff55; background: #6be5ff11; }
    .lg-halogen    { color: #6bffd1; border-color: #6bffd155; background: #6bffd111; }
    .lg-noble      { color: #c66bff; border-color: #c66bff55; background: #c66bff11; }
    .lg-lanthanide { color: #ff6bdc; border-color: #ff6bdc55; background: #ff6bdc11; }
    .lg-actinide   { color: #ff6ba0; border-color: #ff6ba055; background: #ff6ba011; }
    .lg-unknown    { color: #aaa;    border-color: #88888855; background: #88888811; }

    .placeholder {
      background: transparent;
      border: none;
      cursor: default;
    }
    .placeholder:hover { transform: none; }

    .ref-label {
      grid-column: span 2;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 0.7rem;
      color: #888;
      padding-right: 6px;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal.show { display: flex; }

    .modal-card {
      background: #0e0e1c;
      border: 3px solid #ffe600;
      max-width: 480px;
      width: 100%;
      padding: 20px;
      position: relative;
    }

    .modal-card .close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: transparent;
      border: none;
      color: #ffe600;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0;
    }

    .modal-card .big-sym {
      font-size: 3rem;
      color: #ffe600;
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1;
    }
    .modal-card .big-name {
      text-align: center;
      font-size: 1.2rem;
      color: #fff;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .modal-card .big-num {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }
    .modal-card .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      border: 1px solid;
      border-radius: 2px;
      text-transform: uppercase;
    }
    .modal-card .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #222;
      font-size: 0.85rem;
    }
    .modal-card .row span:first-child { color: #888; letter-spacing: 1px; }
    .modal-card .row span:last-child  { color: #fff; text-align: right; }
    .modal-card .fact {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #ffe600;
      background: #ffe60011;
      border-left: 3px solid #ffe600;
      padding: 8px 10px;
      line-height: 1.4;
    }
    .modal-card .center { text-align: center; margin-top: 8px; }

    .back {
      margin-top: 18px;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    .back a { color: #ffe600; text-decoration: none; }
    .back a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      h1 { font-size: 1.3rem; letter-spacing: 2px; }
      .ptable { min-width: 720px; }
    }
  </style>
</head>

// Compute grid position for each element
function gridPos(el) {
  const [n, , , , cat, group, period] = el;
  // Lanthanides (57-71): row 9, cols 3-17 (slot 3 is La's marker, but display separately)
  if (n >= 57 && n <= 71) {
    return { row: 9, col: 3 + (n - 57) };
  }
  if (n >= 89 && n <= 103) {
    return { row: 10, col: 3 + (n - 89) };
  }
  return { row: period, col: group };
}

const ptable = document.getElementById('ptable');
const cells = {};

ELEMENTS.forEach(el => {
  const [n, sym, name, mass, cat] = el;
  const pos = gridPos(el);
  const div = document.createElement('div');
  div.className = `cell c-${cat}`;
  div.style.gridRow = pos.row;
  div.style.gridColumn = pos.col;
  div.dataset.cat = cat;
  div.dataset.n = n;
  div.dataset.sym = sym.toLowerCase();
  div.dataset.name = name.toLowerCase();
  const massDisplay = Number.isInteger(mass) ? `(${mass})` : mass.toFixed(mass < 10 ? 3 : 2);
  div.innerHTML = `
    <div class="num">${n}</div>
    <div class="sym">${sym}</div>
    <div class="name">${name}</div>
    <div class="mass">${massDisplay}</div>
  `;
  div.addEventListener('click', () => showModal(el));
  ptable.appendChild(div);
  cells[n] = div;
});

// Add lanthanide/actinide placeholders in main table (row 6/7, col 3)
function placeholder(row, col, label, cls) {
  const ph = document.createElement('div');
  ph.className = `cell ${cls}`;
  ph.style.gridRow = row;
  ph.style.gridColumn = col;
  ph.innerHTML = `<div class="num">57-71</div><div class="sym" style="font-size:0.7rem;">${label}</div>`;
  if (label === '*') ph.innerHTML = `<div class="sym" style="font-size:1.4rem;color:#ff6bdc;">*</div><div class="name">57-71</div>`;
  if (label === '**') ph.innerHTML = `<div class="sym" style="font-size:1.4rem;color:#ff6ba0;">**</div><div class="name">89-103</div>`;
  ph.style.cursor = 'default';
  ph.addEventListener('click', e => e.stopPropagation());
  ptable.appendChild(ph);
}
placeholder(6, 3, '*', 'c-lanthanide');
placeholder(7, 3, '**', 'c-actinide');

// Row labels for the f-block
function refLabel(row, text, color) {
  const l = document.createElement('div');
  l.className = 'ref-label';
  l.style.gridRow = row;
  l.style.gridColumn = '1 / span 2';
  l.style.color = color;
  l.textContent = text;
  ptable.appendChild(l);
}
refLabel(9, '*  Lanthanides', '#ff6bdc');
refLabel(10, '** Actinides', '#ff6ba0');

// Legend
const legend = document.getElementById('legend');
Object.keys(CAT_NAMES).forEach(cat => {
  const s = document.createElement('span');
  s.className = `lg-${cat}`;
  s.textContent = CAT_NAMES[cat];
  s.dataset.cat = cat;
  s.addEventListener('click', () => toggleCat(cat, s));
  legend.appendChild(s);
});

let activeCats = new Set(Object.keys(CAT_NAMES));
function toggleCat(cat, span) {
  if (activeCats.has(cat)) {
    activeCats.delete(cat);
    span.classList.add('dim');
  } else {
    activeCats.add(cat);
    span.classList.remove('dim');
  }
  applyFilter();
}

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', applyFilter);
document.getElementById('clearBtn').addEventListener('click', () => {
  searchInput.value = '';
  activeCats = new Set(Object.keys(CAT_NAMES));
  document.querySelectorAll('.legend span').forEach(s => s.classList.remove('dim'));
  applyFilter();
});
document.getElementById('randomBtn').addEventListener('click', () => {
  const el = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
  showModal(el);
});

function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  Object.values(cells).forEach(cell => {
    const inCat = activeCats.has(cell.dataset.cat);
    let matches = !q;
    if (q) {
      matches = cell.dataset.sym === q ||
                cell.dataset.sym.startsWith(q) ||
                cell.dataset.name.includes(q) ||
                cell.dataset.n === q;
    }
    cell.classList.toggle('dim', !inCat || !matches);
    cell.classList.toggle('match', q && matches && inCat);
  });
}

// Modal
const modal = document.getElementById('modal');
const closeBtn = document.getElementById('closeBtn');
closeBtn.addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => {
  if (e.target === modal) modal.classList.remove('show');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') modal.classList.remove('show');
});

function showModal(el) {
  const [n, sym, name, mass, cat, group, period, ec, state, fact] = el;
  document.getElementById('bSym').textContent = sym;
  document.getElementById('bName').textContent = name;
  document.getElementById('bNum').textContent = `Atomic number ${n}`;
  const badge = document.getElementById('bBadge');
  badge.textContent = CAT_NAMES[cat];
  badge.className = `badge lg-${cat}`;
  document.getElementById('bMass').textContent = Number.isInteger(mass) ? `${mass} (most stable)` : mass;
  document.getElementById('bGroup').textContent = (n >= 57 && n <= 71) ? 'Lanthanide' : (n >= 89 && n <= 103) ? 'Actinide' : group;
  document.getElementById('bPeriod').textContent = period;
  document.getElementById('bEc').textContent = ec;
  const stateMap = { solid: 'Solid', liquid: 'Liquid', gas: 'Gas', unknown: 'Unknown' };
  document.getElementById('bState').textContent = stateMap[state] || state;
  document.getElementById('bFact').textContent = fact;
  const card = document.getElementById('modalCard');
  card.style.borderColor = getComputedStyle(cells[n]).borderColor;
  modal.classList.add('show');
}
</script>
